<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>♔ Royal Chess Arena</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
        html, body { width: 100%; height: 100%; overflow: hidden; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0a0a1a; display: flex; justify-content: center; align-items: center; }
        .app-container { width: 100vw; height: 100vh; height: 100dvh; background: #0a0a2e; overflow: hidden; display: flex; flex-direction: column; max-width: 500px; margin: 0 auto; }
        .screen { display: none; width: 100%; height: 100%; flex-direction: column; }
        .screen.active { display: flex; }

        /* PORTADA Y ACADEMIA - Imagen 1 */
        .home-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 20px; width: 100%; height: 100%; text-align: center; background: linear-gradient(180deg, rgba(10,10,46,0.65), rgba(26,26,78,0.8)), url('1779421764793.png') center center / cover no-repeat; }
        .crown-icon { font-size: 60px; filter: drop-shadow(0 0 25px rgba(255,215,0,0.6)); text-align: center; }
        .title { font-size: 28px; font-weight: 900; background: linear-gradient(45deg, #ffd700, #ffed4a, #daa520); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .btn { padding: 14px 30px; border: none; border-radius: 50px; font-size: 15px; font-weight: 700; cursor: pointer; text-transform: uppercase; width: 100%; max-width: 280px; transition: transform 0.1s; }
        .btn:active { transform: scale(0.95); }
        .btn-play { background: linear-gradient(135deg, #ffd700, #ff8c00); color: #1a1a2e; font-size: 20px; padding: 18px; box-shadow: 0 8px 25px rgba(255,140,0,0.5); }
        .btn-secondary { background: rgba(255,255,255,0.08); color: white; border: 1px solid rgba(255,215,0,0.25); font-size: 13px; }
        input { width: 260px; padding: 14px; border-radius: 50px; border: 2px solid rgba(255,215,0,0.4); background: rgba(0,0,0,0.4); color: white; font-size: 16px; text-align: center; outline: none; backdrop-filter: blur(4px); }

        /* PANTALLA DE JUEGO - Imagen 2 */
        .game-screen { display: flex; flex-direction: column; height: 100%; background: linear-gradient(180deg, rgba(10,10,26,0.6), rgba(10,10,26,0.8)), url('1779422040370.png') center center / cover no-repeat; }
        .game-header { display: flex; justify-content: space-between; padding: 8px; background: rgba(10,10,30,0.85); border-bottom: 1px solid rgba(255,215,0,0.2); backdrop-filter: blur(4px); min-height: 65px; align-items: center; }
        .player-info { display: flex; align-items: center; gap: 6px; color: white; flex: 1; }
        .player-dot { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; }
        .player-dot.white { background: linear-gradient(135deg, #fff, #ccc); color: #000; }
        .player-dot.black { background: linear-gradient(135deg, #333, #000); color: #fff; }
        .player-name { font-size: 11px; font-weight: 500; }
        .timer { font-size: 18px; font-weight: 900; color: #ffd700; font-family: monospace; }
        .turn-dot { width: 10px; height: 10px; border-radius: 50%; }
        .turn-dot.you { background: #44ff44; box-shadow: 0 0 10px #44ff44; }
        .turn-dot.opp { background: #555; }
        .board-container { flex: 1; display: flex; align-items: center; justify-content: center; padding: 5px; position: relative; }
        canvas { border-radius: 8px; box-shadow: 0 0 60px rgba(255,215,0,0.15); cursor: pointer; max-width: 100%; max-height: 100%; }
        .game-footer { display: flex; align-items: center; gap: 8px; padding: 6px 10px; background: rgba(10,10,30,0.85); border-top: 1px solid rgba(255,215,0,0.2); }
        .btn-back { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,215,0,0.2); color: #ffd700; padding: 8px 14px; border-radius: 18px; font-size: 11px; cursor: pointer; }

        /* MODALES Y TARJETAS */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 200; justify-content: center; align-items: center; }
        .modal.active { display: flex; }
        .modal-box { background: linear-gradient(135deg, rgba(26,26,62,0.95), rgba(42,42,94,0.95)); border: 2px solid rgba(255,215,0,0.4); border-radius: 16px; padding: 20px; max-width: 380px; width: 90%; color: white; }
        .room-card { background: rgba(0,0,0,0.4); border: 1px solid rgba(255,215,0,0.2); border-radius: 12px; padding: 12px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; width: 100%; }
        .room-name { color: #ffd700; font-weight: 700; font-size: 14px; }
        .trivia-btn { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,215,0,0.5); padding: 10px; border-radius: 8px; color: white; cursor: pointer; text-align: left; transition: background 0.2s; }
        .trivia-btn:active { background: rgba(255,215,0,0.3); }
        
        #academyMessage { position: absolute; top: 10px; background: rgba(0,0,0,0.8); color: #44ff44; padding: 10px; border-radius: 8px; border: 1px solid #44ff44; font-size: 13px; text-align: center; width: 90%; z-index: 10; display: none; }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- PANTALLA DE INICIO -->
        <div class="screen active" id="homeScreen">
            <div class="home-screen">
                <div class="crown-icon">👑</div>
                <h1 class="title">ROYAL CHESS</h1>
                <input type="text" id="nameInput" placeholder="Tu nombre" maxlength="15">
                <button class="btn btn-play" onclick="playLocal()">⚔️ JUGAR LOCAL</button>
                <button class="btn btn-secondary" onclick="openAcademy()">🧠 ACADEMIA TUTOR</button>
                <button class="btn btn-secondary" onclick="openLobby()">🌐 MULTIJUGADOR</button>
            </div>
        </div>

        <!-- PANTALLA ACADEMIA -->
        <div class="screen" id="academyScreen">
            <div class="home-screen" style="justify-content: flex-start; padding-top: 40px;">
                <div class="crown-icon">🧠</div>
                <h1 class="title">ACADEMIA</h1>
                <p style="color:#aaa;font-size:12px;margin-bottom:20px;">Aprende Jugadas Maestras</p>
                <div class="room-card" style="cursor: pointer; flex-direction: column; align-items: flex-start;" onclick="startLesson('mate_pastor')">
                    <div class="room-name">💥 El Mate del Pastor</div>
                    <div style="font-size: 12px; color: #bbb; margin-top: 5px;">Supera la trivia y domina la apertura.</div>
                </div>
                <button class="btn btn-secondary" onclick="goHome()" style="margin-top: auto; margin-bottom: 20px;">🏠 VOLVER</button>
            </div>
        </div>

        <!-- MODAL DE TRIVIA -->
        <div class="modal" id="triviaModal">
            <div class="modal-box">
                <h2 id="triviaTitle">Trivia</h2>
                <div style="border-bottom: 1px solid rgba(255,215,0,0.2); margin: 10px 0;"></div>
                <p id="triviaQuestion" style="font-size: 16px; margin-bottom: 15px;"></p>
                <div id="triviaOptions" style="display: flex; flex-direction: column; gap: 8px;"></div>
                <button class="btn-back" onclick="closeTrivia()" style="width: 100%; margin-top: 15px;">CANCELAR</button>
            </div>
        </div>

        <!-- PANTALLA DE JUEGO -->
        <div class="screen" id="gameScreen">
            <div class="game-screen">
                <div class="game-header">
                    <div class="player-info">
                        <div class="player-dot black" id="topDot">⚫</div>
                        <div><div class="player-name" id="topName">OPONENTE</div></div>
                        <div class="turn-dot opp" id="topTurn"></div>
                    </div>
                    <div class="player-info">
                        <div class="player-dot white" id="bottomDot">⚪</div>
                        <div><div class="player-name" id="bottomName">TÚ</div></div>
                        <div class="turn-dot you" id="bottomTurn"></div>
                    </div>
                </div>
                
                <div class="board-container" id="boardContainer">
                    <div id="academyMessage">Sigue las instrucciones...</div>
                    <canvas id="chessCanvas"></canvas>
                </div>

                <div class="game-footer">
                    <button class="btn-back" onclick="exitGame()">🏠 SALIR</button>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL LOBBY -->
    <div class="modal" id="lobbyModal">
        <div class="modal-box">
            <h2 style="color:#ffd700; text-align:center;">🌐 Salas</h2>
            <button class="btn btn-secondary" onclick="createRoom()" style="margin-bottom:10px; width: 100%;">🏠 Crear Sala</button>
            <div id="roomList" style="max-height:200px; overflow-y:auto;"></div>
            <button class="btn-back" onclick="closeLobby()" style="width:100%; margin-top:10px;">CERRAR</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <script>
        // ============ AUDIOS ============
        const sndMove = new Audio('move.mp3');
        const sndCapture = new Audio('capture.mp3');

        // ============ ESTADO GLOBAL ============
        const gs = { 
            mode: 'local', // 'local', 'multi', 'academy'
            roomId: null, role: 'w', viewBlack: false, turn: 'w', sel: null,
            lessonId: null, lessonStep: 0, currentTriviaIndex: 0
        };

        // ============ FIREBASE ============
        firebase.initializeApp({
            apiKey: "AIzaSyDMu83hA5xjmwSlUX4KUgWkYlx6SqHcaAk",
            databaseURL: "https://royal-chess-multiplayer-default-rtdb.firebaseio.com"
        });
        const db = firebase.database();

        // ============ DATOS ACADEMIA ============
        const academyData = {
            mate_pastor: {
                title: "Mate del Pastor",
                trivia: [
                    { q: "¿A qué casilla apunta el ataque directo en f7?", opts: ["Alfil", "Caballo", "Reina", "Rey"], ans: 2 },
                    { q: "¿Cuántos movimientos se necesitan para este mate?", opts: ["2", "3", "4", "5"], ans: 2 }
                ],
                steps: [
                    { msg: "1. Mueve el peón de Rey a e4.", fr: 6, fc: 4, tr: 4, tc: 4, opp: {fr: 1, fc: 4, tr: 3, tc: 4} },
                    { msg: "2. Desarrolla el Alfil a c4.", fr: 7, fc: 5, tr: 4, tc: 2, opp: {fr: 0, fc: 1, tr: 2, tc: 2} },
                    { msg: "3. Saca tu Reina a h5.", fr: 7, fc: 3, tr: 3, tc: 7, opp: {fr: 0, fc: 6, tr: 2, tc: 5} },
                    { msg: "4. ¡Captura en f7 para dar Mate!", fr: 3, fc: 7, tr: 1, tc: 5, end: true }
                ]
            }
        };

        // ============ MOTOR AJEDREZ ============
        const chess = {
            board: [],
            init() { this.board = [['r','n','b','q','k','b','n','r'],['p','p','p','p','p','p','p','p'],['','','','','','','',''],['','','','','','','',''],['','','','','','','',''],['','','','','','','',''],['P','P','P','P','P','P','P','P'],['R','N','B','Q','K','B','N','R']]; },
            getPiece(r,c) { return this.board[r]?.[c]||''; },
            isValid(fr,fc,tr,tc) {
                const p=this.getPiece(fr,fc), tgt=this.getPiece(tr,tc);
                if(!p || (tgt && ((p===p.toUpperCase()&&tgt===tgt.toUpperCase())||(p===p.toLowerCase()&&tgt===tgt.toLowerCase())))) return false;
                const type=p.toLowerCase(), rd=tr-fr, cd=tc-fc, ard=Math.abs(rd), acd=Math.abs(cd);
                const cp=(dr,dc)=>{const s=Math.max(Math.abs(dr),Math.abs(dc)),sr=dr===0?0:dr/Math.abs(dr),sc=dc===0?0:dc/Math.abs(dc);for(let i=1;i<s;i++)if(this.getPiece(fr+sr*i,fc+sc*i))return false;return true;};
                switch(type){case'p':const d=p==='P'?-1:1,sr=p==='P'?6:1;if(cd===0&&!tgt){if(rd===d)return true;if(fr===sr&&rd===2*d&&!this.getPiece(fr+d,fc))return true;}return acd===1&&rd===d&&!!tgt;case'r':return(rd===0||cd===0)&&cp(rd,cd);case'n':return(ard===2&&acd===1)||(ard===1&&acd===2);case'b':return ard===acd&&cp(rd,cd);case'q':return(rd===0||cd===0||ard===acd)&&cp(rd,cd);case'k':return ard<=1&&acd<=1;}return false;
            },
            move(fr,fc,tr,tc){
                const p=this.getPiece(fr,fc), tgt=this.getPiece(tr,tc);
                this.board[tr][tc]=p; this.board[fr][fc]='';
                if(tgt) { 
                    sndCapture.play().catch(e=>console.log("Audio no iniciado")); 
                    spawnExplosion(tc, tr); // Disparar partículas
                } else { 
                    sndMove.play().catch(e=>console.log("Audio no iniciado")); 
                }
            }
        };

        // ============ SISTEMA DE PARTÍCULAS (Desintegración) ============
        let particles = [];
        function spawnExplosion(c, r) {
            let cx = c * S + S/2; let cy = r * S + S/2;
            if(gs.viewBlack) { cx = (7-c)*S + S/2; cy = (7-r)*S + S/2; }
            for(let i=0; i<15; i++) {
                particles.push({x: cx, y: cy, vx: (Math.random()-0.5)*8, vy: (Math.random()-0.5)*8, life: 1, color: '#ffaa00'});
            }
            requestAnimationFrame(animateEffects);
        }
        function animateEffects() {
            if(particles.length === 0) return;
            drawBaseBoard(); // Redibujar sin borrar fondo
            ctx.globalCompositeOperation = 'lighter';
            for(let i=particles.length-1; i>=0; i--) {
                let p = particles[i];
                p.x += p.vx; p.y += p.vy; p.life -= 0.05;
                if(p.life <= 0) { particles.splice(i, 1); continue; }
                ctx.fillStyle = `rgba(255, 100, 0, ${p.life})`;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.life * S*0.15, 0, Math.PI*2); ctx.fill();
            }
            ctx.globalCompositeOperation = 'source-over';
            requestAnimationFrame(animateEffects);
        }

        // ============ MOTOR GRÁFICO ============
        const canvas = document.getElementById('chessCanvas'), ctx = canvas.getContext('2d');
        let B = 0, S = 0;
        function resize() { 
            const c = document.getElementById('boardContainer'); 
            B = Math.floor(Math.min(c.clientWidth, c.clientHeight) * 0.98); 
            S = B / 8; canvas.width = B; canvas.height = B; draw(); 
        }
        const SYM = {K:'♔',Q:'♕',R:'♖',B:'♗',N:'♘',P:'♙',k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟'};

        function drawBaseBoard() {
            ctx.clearRect(0,0,B,B);
            for(let r=0;r<8;r++)for(let c=0;c<8;c++){
                let dr=r,dc=c; if(gs.viewBlack){dr=7-r;dc=7-c;}
                const x=dc*S, y=dr*S, light=(r+c)%2===0;
                
                // Color Madera del Tablero
                ctx.fillStyle = light ? '#e8cfa6' : '#8b5a2b';
                ctx.fillRect(x,y,S,S);

                // COORDENADAS
                ctx.font = `bold ${S*0.2}px sans-serif`;
                ctx.fillStyle = light ? '#8b5a2b' : '#e8cfa6';
                if(dc === 0) { ctx.textAlign='left'; ctx.textBaseline='top'; ctx.fillText(gs.viewBlack?dr+1:8-dr, x+3, y+3); }
                if(dr === 7) { ctx.textAlign='right'; ctx.textBaseline='bottom'; ctx.fillText(String.fromCharCode(97+(gs.viewBlack?7-dc:dc)), x+S-3, y+S-3); }
            }

            // Resaltado Academia
            if(gs.mode === 'academy' && academyData[gs.lessonId]) {
                const step = academyData[gs.lessonId].steps[gs.lessonStep];
                if(step) {
                    let sc = gs.viewBlack ? 7-step.fc : step.fc;
                    let sr = gs.viewBlack ? 7-step.fr : step.fr;
                    let tc = gs.viewBlack ? 7-step.tc : step.tc;
                    let tr = gs.viewBlack ? 7-step.tr : step.tr;
                    ctx.fillStyle = 'rgba(68, 255, 68, 0.4)'; ctx.fillRect(sc*S, sr*S, S, S);
                    ctx.strokeStyle = '#00ffff'; ctx.lineWidth = 3; ctx.strokeRect(tc*S+2, tr*S+2, S-4, S-4);
                }
            }

            // Resaltado Selección
            if(gs.sel){
                let r=gs.sel.row, c=gs.sel.col; if(gs.viewBlack){r=7-r;c=7-c;}
                ctx.fillStyle='rgba(255,215,0,0.5)'; ctx.fillRect(c*S,r*S,S,S);
            }

            // DIBUJAR PIEZAS REALISTAS
            for(let r=0;r<8;r++)for(let c=0;c<8;c++){
                const p=chess.getPiece(r,c); if(!p)continue;
                let dr=r,dc=c; if(gs.viewBlack){dr=7-r;dc=7-c;}
                const cx=dc*S+S/2, cy=dr*S+S/2, isW=p===p.toUpperCase();
                
                // Efecto 3D Sombra
                ctx.shadowColor = 'rgba(0,0,0,0.6)';
                ctx.shadowBlur = 6;
                ctx.shadowOffsetY = 4;

                ctx.fillStyle = isW ? '#ffffff' : '#222222';
                ctx.strokeStyle = isW ? '#555' : '#000';
                ctx.lineWidth = 1.5;
                ctx.font = `bold ${S*0.75}px Arial`; 
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText(SYM[p], cx, cy + S*0.05);
                ctx.strokeText(SYM[p], cx, cy + S*0.05);

                // Resetear sombra para no afectar otras cosas
                ctx.shadowColor = 'transparent';
                ctx.shadowBlur = 0;
                ctx.shadowOffsetY = 0;
            }
        }
        function draw() { drawBaseBoard(); }

        // ============ LÓGICA DE CLICKS ============
        canvas.addEventListener('click', (e) => {
            if (gs.mode === 'multi' && gs.roomId && gs.turn !== gs.role) return;

            const rect = canvas.getBoundingClientRect();
            let c = Math.floor((e.clientX - rect.left) / S);
            let r = Math.floor((e.clientY - rect.top) / S);
            if (gs.viewBlack) { r = 7 - r; c = 7 - c; }
            
            const p = chess.getPiece(r, c);

            if (gs.sel) {
                // MODO ACADEMIA TUTOR
                if(gs.mode === 'academy') {
                    const step = academyData[gs.lessonId].steps[gs.lessonStep];
                    if(gs.sel.row === step.fr && gs.sel.col === step.fc && r === step.tr && c === step.tc) {
                        chess.move(step.fr, step.fc, step.tr, step.tc);
                        gs.sel = null; draw();
                        
                        if(step.end) {
                            document.getElementById('academyMessage').innerText = "¡Mate Conseguido! Lección Completada.";
                            setTimeout(goHome, 3000);
                        } else {
                            setTimeout(() => {
                                chess.move(step.opp.fr, step.opp.fc, step.opp.tr, step.opp.tc);
                                gs.lessonStep++;
                                updateAcademyMessage();
                                draw();
                            }, 800);
                        }
                    } else { gs.sel = null; draw(); }
                    return;
                }

                // MODO NORMAL / MULTI
                if (chess.isValid(gs.sel.row, gs.sel.col, r, c)) {
                    chess.move(gs.sel.row, gs.sel.col, r, c);
                    gs.sel = null;
                    const nextTurn = gs.turn === 'w' ? 'b' : 'w';

                    if (gs.mode === 'multi' && gs.roomId) {
                        db.ref('rooms/' + gs.roomId).update({ board: chess.board, turn: nextTurn });
                    } else { gs.turn = nextTurn; draw(); }
                } else {
                    if(p && ((gs.turn === 'w' && p === p.toUpperCase()) || (gs.turn === 'b' && p === p.toLowerCase()))) {
                        gs.sel = {row: r, col: c};
                    } else { gs.sel = null; }
                }
            } else {
                if(p && ((gs.turn === 'w' && p === p.toUpperCase()) || (gs.turn === 'b' && p === p.toLowerCase()))) {
                    gs.sel = {row: r, col: c};
                }
            }
            draw();
        });

        // ============ NAVEGACIÓN Y MENÚS ============
        function showScreen(id) { document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active')); document.getElementById(id).classList.add('active'); if(id==='gameScreen') resize(); }
        function goHome() { document.getElementById('academyMessage').style.display = 'none'; showScreen('homeScreen'); }
        function openAcademy() { showScreen('academyScreen'); }
        function playLocal() { gs.mode = 'local'; gs.roomId = null; gs.viewBlack = false; gs.turn = 'w'; chess.init(); document.getElementById('topName').innerText="RIVAL"; document.getElementById('bottomName').innerText="JUGADOR 1"; showScreen('gameScreen'); }
        
        // ============ ACADEMIA Y TRIVIA ============
        function startLesson(id) {
            gs.lessonId = id; gs.currentTriviaIndex = 0;
            const lesson = academyData[id];
            document.getElementById('triviaTitle').innerText = lesson.title;
            showTriviaQuestion();
            document.getElementById('triviaModal').classList.add('active');
        }
        function closeTrivia() { document.getElementById('triviaModal').classList.remove('active'); }
        function showTriviaQuestion() {
            const t = academyData[gs.lessonId].trivia[gs.currentTriviaIndex];
            document.getElementById('triviaQuestion').innerText = t.q;
            const optsDiv = document.getElementById('triviaOptions');
            optsDiv.innerHTML = '';
            t.opts.forEach((opt, idx) => {
                optsDiv.innerHTML += `<button class="trivia-btn" onclick="checkTrivia(${idx})">${opt}</button>`;
            });
        }
        function checkTrivia(idx) {
            const t = academyData[gs.lessonId].trivia[gs.currentTriviaIndex];
            if(idx === t.ans) {
                gs.currentTriviaIndex++;
                if(gs.currentTriviaIndex < academyData[gs.lessonId].trivia.length) { showTriviaQuestion(); } 
                else { closeTrivia(); enterAcademyBoard(); }
            } else { alert("Respuesta incorrecta. ¡Intenta de nuevo!"); }
        }
        function enterAcademyBoard() {
            gs.mode = 'academy'; gs.viewBlack = false; gs.lessonStep = 0; chess.init();
            document.getElementById('topName').innerText="TUTOR"; document.getElementById('bottomName').innerText="ESTUDIANTE";
            showScreen('gameScreen');
            document.getElementById('academyMessage').style.display = 'block';
            updateAcademyMessage();
        }
        function updateAcademyMessage() {
            const step = academyData[gs.lessonId].steps[gs.lessonStep];
            if(step) document.getElementById('academyMessage').innerText = step.msg;
        }

        // ============ MULTIJUGADOR ============
        function openLobby() { document.getElementById('lobbyModal').classList.add('active'); db.ref('rooms').on('value', snap => { const list=document.getElementById('roomList'); list.innerHTML=''; snap.forEach(child=>{ const room=child.val(); if(room.status==='waiting') list.innerHTML += `<div class="room-card"><span class="room-name">Sala de ${room.white}</span><button class="btn-secondary" onclick="joinRoom('${child.key}')">UNIRSE</button></div>`; }); }); }
        function closeLobby() { document.getElementById('lobbyModal').classList.remove('active'); db.ref('rooms').off(); }
        function createRoom() { const name=document.getElementById('nameInput').value||'Anfitrión'; const ref=db.ref('rooms').push(); gs.roomId=ref.key; gs.mode='multi'; gs.role='w'; gs.viewBlack=false; chess.init(); ref.onDisconnect().remove(); ref.set({white:name,status:'waiting',turn:'w',board:chess.board}); closeLobby(); listenRoom(gs.roomId); }
        function joinRoom(id) { const name=document.getElementById('nameInput').value||'Invitado'; gs.roomId=id; gs.mode='multi'; gs.role='b'; gs.viewBlack=true; db.ref('rooms/'+id).onDisconnect().remove(); db.ref('rooms/'+id).update({black:name,status:'playing'}).then(()=>{ closeLobby(); listenRoom(id); }); }
        function listenRoom(id) { db.ref('rooms/'+id).on('value', snap=>{ const room=snap.val(); if(!room){ alert('Sala cerrada.'); exitGame(); return; } if(room.status==='playing'){ chess.board=room.board; gs.turn=room.turn; document.getElementById('topName').innerText=gs.role==='w'?room.black:room.white; document.getElementById('bottomName').innerText=gs.role==='w'?room.white:room.black; document.getElementById('bottomTurn').className=gs.turn===gs.role?"turn-dot you":"turn-dot opp"; document.getElementById('topTurn').className=gs.turn===gs.role?"turn-dot opp":"turn-dot you"; showScreen('gameScreen'); draw(); }}); }
        function exitGame() { if(gs.mode==='multi'&&gs.roomId){ db.ref('rooms/'+gs.roomId).remove(); db.ref('rooms/'+gs.roomId).off(); gs.roomId=null; } goHome(); }

        window.addEventListener('resize', resize);
    </script>
</body>
</html>
