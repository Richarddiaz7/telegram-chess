<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>♔ Royal Chess Arena</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
        html, body { width: 100%; height: 100%; overflow: hidden; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0a0a1a; display: flex; justify-content: center; align-items: center; }
        .app-container { width: 100vw; height: 100vh; height: 100dvh; background: #0a0a2e; overflow: hidden; display: flex; flex-direction: column; max-width: 500px; margin: 0 auto; }
        .screen { display: none; width: 100%; height: 100%; flex-direction: column; }
        .screen.active { display: flex; }

        .home-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 20px; width: 100%; height: 100%; text-align: center; background: linear-gradient(180deg, rgba(10,10,46,0.65), rgba(26,26,78,0.8)); }
        .crown-icon { font-size: 60px; filter: drop-shadow(0 0 25px rgba(255,215,0,0.6)); }
        .title { font-size: 28px; font-weight: 900; background: linear-gradient(45deg, #ffd700, #ffed4a, #daa520); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .btn { padding: 14px 30px; border: none; border-radius: 50px; font-size: 15px; font-weight: 700; cursor: pointer; text-transform: uppercase; width: 100%; max-width: 280px; }
        .btn-play { background: linear-gradient(135deg, #ffd700, #ff8c00); color: #1a1a2e; font-size: 20px; padding: 18px; margin-bottom: 5px; }
        .btn-secondary { background: rgba(255,255,255,0.08); color: white; border: 1px solid rgba(255,215,0,0.25); padding: 10px; }
        input { width: 260px; padding: 14px; border-radius: 50px; border: 2px solid rgba(255,215,0,0.4); background: rgba(0,0,0,0.4); color: white; font-size: 16px; text-align: center; outline: none; }

        .game-screen { display: flex; flex-direction: column; height: 100%; }
        .game-header { display: flex; justify-content: space-between; padding: 10px; background: #1a1a2e; }
        .board-container { flex: 1; display: flex; align-items: center; justify-content: center; padding: 5px; }
        canvas { border-radius: 8px; background: #333; max-width: 100%; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 200; justify-content: center; align-items: center; }
        .modal.active { display: flex; }
        .modal-box { background: #1a1a2e; border: 2px solid #ffd700; border-radius: 16px; padding: 20px; width: 90%; max-width: 380px; color: white; }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Pantallas -->
        <div class="screen active" id="homeScreen">
            <div class="home-screen">
                <div class="crown-icon">👑</div>
                <h1 class="title">ROYAL CHESS</h1>
                <input type="text" id="nameInput" placeholder="Tu nombre" maxlength="15">
                <button class="btn btn-play" onclick="playLocal()">⚔️ JUGAR</button>
                <button class="btn btn-secondary" onclick="openLobby()">🌐 MULTIJUGADOR</button>
            </div>
        </div>

        <div class="screen" id="gameScreen">
            <div class="game-screen">
                <div class="game-header"><button class="btn-back" onclick="goHome()">SALIR</button></div>
                <div class="board-container"><canvas id="chessCanvas"></canvas></div>
            </div>
        </div>
    </div>

    <div class="modal" id="lobbyModal">
        <div class="modal-box">
            <h2>🌐 Salas Disponibles</h2>
            <button class="btn btn-secondary" onclick="createRoom()" style="width: 100%; margin-bottom: 10px;">🏠 Crear Nueva Sala</button>
            <div id="roomList"></div>
            <button class="btn-secondary" onclick="closeLobby()" style="width: 100%; margin-top: 10px;">CERRAR</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDMu83hA5xjmwSlUX4KUgWkYlx6SqHcaAk",
            authDomain: "royal-chess-multiplayer.firebaseapp.com",
            databaseURL: "https://royal-chess-multiplayer-default-rtdb.firebaseio.com",
            projectId: "royal-chess-multiplayer",
            storageBucket: "royal-chess-multiplayer.firebasestorage.app",
            messagingSenderId: "380447919929",
            appId: "1:380447919929:web:13c8584bf1e688830ea2e8"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function openLobby() { document.getElementById('lobbyModal').classList.add('active'); loadRooms(); }
        function closeLobby() { document.getElementById('lobbyModal').classList.remove('active'); db.ref('rooms').off(); }
        
        function loadRooms() {
            db.ref('rooms').on('value', (snapshot) => {
                const list = document.getElementById('roomList');
                list.innerHTML = '';
                snapshot.forEach(child => {
                    const room = child.val();
                    if(room.status === 'waiting') {
                        list.innerHTML += `<div class="room-card" style="padding:10px; border-bottom:1px solid #444;">Sala de ${room.white} <button onclick="joinRoom('${child.key}')">UNIRSE</button></div>`;
                    }
                });
            });
        }

        function createRoom() {
            const name = document.getElementById('nameInput').value || 'Jugador';
            const newRoom = db.ref('rooms').push();
            newRoom.set({ white: name, status: 'waiting' });
            closeLobby();
            alert('Sala creada');
        }

        function goHome() {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('homeScreen').classList.add('active');
        }

        function playLocal() {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('gameScreen').classList.add('active');
        }
    </script>
</body>
</html>
