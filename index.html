<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Multiplayer Simple</title>
    <style>
        body { background: #0a0a2e; color: white; font-family: sans-serif; padding: 20px; text-align: center; }
        .btn { padding: 15px 30px; margin: 10px; border-radius: 25px; border: none; font-size: 16px; cursor: pointer; background: #ffd700; color: #000; font-weight: bold; }
        .log { background: #111; padding: 15px; border-radius: 10px; margin: 15px 0; text-align: left; font-family: monospace; font-size: 11px; max-height: 250px; overflow-y: auto; }
        input { padding: 10px; border-radius: 20px; border: 1px solid #ffd700; background: #222; color: white; text-align: center; margin: 5px; width: 200px; }
    </style>
</head>
<body>
    <h2>🧪 Prueba de Sincronización</h2>
    
    <input type="text" id="myName" placeholder="Tu nombre" value="Jugador1">
    <br>
    <button class="btn" onclick="createGame()">🏠 CREAR PARTIDA</button>
    <br>
    <input type="text" id="gameId" placeholder="ID de partida">
    <button class="btn" onclick="joinGame()">🔗 UNIRSE</button>
    
    <hr>
    <p>Turno actual: <b id="turnDisplay">-</b></p>
    <p>Mi color: <b id="colorDisplay">-</b></p>
    <button class="btn" onclick="sendMove()" id="moveBtn" disabled>📤 ENVIAR MOVIMIENTO</button>
    
    <div class="log" id="log"></div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script>
        function log(msg) {
            const l = document.getElementById('log');
            l.innerHTML += '<br>' + new Date().toLocaleTimeString().slice(0,8) + ': ' + msg;
            l.scrollTop = l.scrollHeight;
        }

        // Firebase
        firebase.initializeApp({
            apiKey: "AIzaSyDMu83hA5xjmwSlUX4KUgWkYlx6SqHcaAk",
            authDomain: "royal-chess-multiplayer.firebaseapp.com",
            databaseURL: "https://royal-chess-multiplayer-default-rtdb.firebaseio.com",
            projectId: "royal-chess-multiplayer",
            storageBucket: "royal-chess-multiplayer.firebasestorage.app",
            messagingSenderId: "380447919929",
            appId: "1:380447919929:web:13c8584bf1e688830ea2e8"
        });
        const db = firebase.database();

        let myColor = null;
        let currentGameId = null;
        let moveCount = 0;

        function createGame() {
            const name = document.getElementById('myName').value || 'Jugador1';
            const gid = 'game_' + Date.now();
            
            db.ref('games/' + gid).set({
                white: name,
                black: null,
                turn: 'white',
                moveCount: 0,
                status: 'waiting'
            }).then(() => {
                currentGameId = gid;
                myColor = 'white';
                document.getElementById('gameId').value = gid;
                document.getElementById('colorDisplay').textContent = '⚪ BLANCAS';
                document.getElementById('turnDisplay').textContent = 'TU TURNO';
                document.getElementById('moveBtn').disabled = false;
                log('✅ Partida creada: ' + gid);
                log('👤 Eres BLANCAS');
                
                // Escuchar cambios
                db.ref('games/' + gid).on('value', (snap) => {
                    const game = snap.val();
                    if (!game) return;
                    log('📩 Datos recibidos - turno: ' + game.turn + ', movimientos: ' + game.moveCount);
                    
                    if (game.black && game.status === 'waiting') {
                        log('👤 ¡Un oponente se unió!: ' + game.black);
                        game.status = 'playing';
                    }
                    
                    if (game.turn !== myColor && game.moveCount > moveCount) {
                        moveCount = game.moveCount;
                        document.getElementById('turnDisplay').textContent = 'TU TURNO';
                        document.getElementById('moveBtn').disabled = false;
                        log('🟢 Es tu turno ahora');
                    }
                });
            });
        }

        function joinGame() {
            const gid = document.getElementById('gameId').value.trim();
            const name = document.getElementById('myName').value || 'Jugador2';
            if (!gid) return alert('Ingresa un ID de partida');
            
            db.ref('games/' + gid).once('value', (snap) => {
                const game = snap.val();
                if (!game) return alert('Partida no encontrada');
                if (game.black) return alert('Partida llena');
                
                db.ref('games/' + gid).update({
                    black: name,
                    status: 'playing'
                }).then(() => {
                    currentGameId = gid;
                    myColor = 'black';
                    moveCount = game.moveCount;
                    document.getElementById('colorDisplay').textContent = '⚫ NEGRAS';
                    document.getElementById('turnDisplay').textContent = 'ESPERANDO...';
                    document.getElementById('moveBtn').disabled = true;
                    log('✅ Unido a partida: ' + gid);
                    log('👤 Eres NEGRAS');
                    
                    // Escuchar cambios
                    db.ref('games/' + gid).on('value', (snap) => {
                        const game = snap.val();
                        if (!game) return;
                        log('📩 Datos recibidos - turno: ' + game.turn + ', movimientos: ' + game.moveCount);
                        
                        if (game.turn !== myColor && game.moveCount > moveCount) {
                            moveCount = game.moveCount;
                            document.getElementById('turnDisplay').textContent = 'TU TURNO';
                            document.getElementById('moveBtn').disabled = false;
                            log('🟢 Es tu turno ahora');
                        }
                    });
                });
            });
        }

        function sendMove() {
            if (!currentGameId) return;
            
            moveCount++;
            const nextTurn = myColor === 'white' ? 'black' : 'white';
            
            db.ref('games/' + currentGameId).update({
                turn: nextTurn,
                moveCount: moveCount
            }).then(() => {
                document.getElementById('turnDisplay').textContent = 'ESPERANDO...';
                document.getElementById('moveBtn').disabled = true;
                log('📤 Movimiento #' + moveCount + ' enviado. Turno del oponente');
            });
        }
    </script>
</body>
</html>
