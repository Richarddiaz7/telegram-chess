<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Ajedrez Mini App</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <style>
        * {
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        
        body { 
            font-family: system-ui, -apple-system, sans-serif; 
            padding: 16px; 
            background: linear-gradient(135deg, #1a472a 0%, #2d5a3b 100%);
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            max-width: 500px;
            width: 100%;
        }
        
        /* Encabezado con temporizador */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            gap: 12px;
        }
        
        .timer-box {
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
            padding: 8px 16px;
            border-radius: 32px;
            text-align: center;
            flex: 1;
            color: white;
            font-weight: bold;
        }
        
        .timer-label {
            font-size: 11px;
            opacity: 0.8;
            letter-spacing: 1px;
        }
        
        .timer-value {
            font-size: 22px;
            font-family: 'Courier New', monospace;
            font-weight: bold;
        }
        
        .timer-white { border-left: 3px solid #f0d9b5; }
        .timer-black { border-left: 3px solid #b58863; }
        
        /* Tablero con animaciones */
        #board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            aspect-ratio: 1 / 1;
            background: #f0d9b5;
            border: 4px solid #7b4c2e;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            position: relative;
        }
        
        .square {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(24px, 8vw, 48px);
            cursor: pointer;
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }
        
        /* Animación de hover */
        .square:hover {
            transform: scale(0.95);
            filter: brightness(0.95);
        }
        
        .light { background-color: #f0d9b5; }
        .dark { background-color: #b58863; }
        
        /* Animación de selección */
        .selected { 
            background-color: #b7c962;
            box-shadow: inset 0 0 0 3px gold;
            animation: pulse 0.5s ease;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(0.98); }
            100% { transform: scale(1); }
        }
        
        /* Animación de movimientos legales */
        .legal-move { 
            position: relative;
        }
        
        .legal-move::before {
            content: "";
            position: absolute;
            width: 25%;
            height: 25%;
            background: rgba(0,255,0,0.4);
            border-radius: 50%;
            animation: ripple 0.6s ease-out;
        }
        
        @keyframes ripple {
            0% { transform: scale(0); opacity: 1; }
            100% { transform: scale(3); opacity: 0; }
        }
        
        /* Animación de movimiento de pieza */
        .moving-piece {
            position: fixed;
            z-index: 1000;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: clamp(24px, 8vw, 48px);
            pointer-events: none;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
        }
        
        /* Estado del juego */
        #status {
            margin-top: 20px;
            text-align: center;
            font-weight: bold;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
            color: #f0d9b5;
            padding: 12px;
            border-radius: 32px;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        
        /* Botones */
        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 12px;
        }
        
        button {
            background: rgba(0,136,204,0.9);
            backdrop-filter: blur(10px);
            border: none;
            padding: 12px 20px;
            border-radius: 32px;
            color: white;
            font-weight: bold;
            font-size: 15px;
            flex: 1;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        button:active {
            transform: scale(0.95);
        }
        
        .reset-btn { background: rgba(220,53,69,0.9); }
        .sound-btn { background: rgba(255,193,7,0.9); color: #000; }
        
        /* Modo noche toggle */
        .theme-toggle {
            position: fixed;
            top: 16px;
            right: 16px;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);
            border: none;
            border-radius: 50%;
            width: 44px;
            height: 44px;
            font-size: 24px;
            cursor: pointer;
            z-index: 100;
        }
        
        /* Modo noche */
        body.night-mode {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
        }
        
        body.night-mode .square.light { background-color: #334155; }
        body.night-mode .square.dark { background-color: #1e293b; }
        body.night-mode .square.selected { background-color: #4ade80; }
    </style>
</head>
<body>
    <button class="theme-toggle" id="themeToggle">🌙</button>
    
    <div class="container">
        <div class="header">
            <div class="timer-box timer-white">
                <div class="timer-label">⚪ BLANCAS</div>
                <div class="timer-value" id="whiteTimer">10:00</div>
            </div>
            <div class="timer-box timer-black">
                <div class="timer-label">⚫ NEGRAS</div>
                <div class="timer-value" id="blackTimer">10:00</div>
            </div>
        </div>
        
        <div id="board"></div>
        <div id="status"></div>
        
        <div class="buttons">
            <button id="reset" class="reset-btn">🔄 Reiniciar</button>
            <button id="soundToggle" class="sound-btn">🔊 Sonido ON</button>
        </div>
    </div>

    <script>
        const game = new Chess();
        let selectedSquare = null;
        let legalMoves = [];
        let soundEnabled = true;
        
        // Temporizador
        let whiteTime = 600; // 10 minutos en segundos
        let blackTime = 600;
        let currentTimer = 'w';
        let timerInterval = null;
        
        // Elementos del DOM
        const whiteTimerEl = document.getElementById('whiteTimer');
        const blackTimerEl = document.getElementById('blackTimer');
        
        // Piezas en emoji
        const pieces = {
            'k': '♔', 'q': '♕', 'r': '♖', 'b': '♗', 'n': '♘', 'p': '♙',
            'K': '♚', 'Q': '♛', 'R': '♜', 'B': '♝', 'N': '♞', 'P': '♟'
        };
        
        // Función para reproducir sonido (Web Audio API)
        function playSound(type) {
            if (!soundEnabled) return;
            
            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                if (type === 'move') {
                    oscillator.frequency.value = 523.25; // Do
                    gainNode.gain.value = 0.1;
                    oscillator.start();
                    gainNode.gain.exponentialRampToValueAtTime(0.00001, audioContext.currentTime + 0.3);
                    oscillator.stop(audioContext.currentTime + 0.3);
                } else if (type === 'capture') {
                    oscillator.frequency.value = 392.00; // Sol
                    gainNode.gain.value = 0.15;
                    oscillator.start();
                    gainNode.gain.exponentialRampToValueAtTime(0.00001, audioContext.currentTime + 0.2);
                    oscillator.stop(audioContext.currentTime + 0.2);
                } else if (type === 'check') {
                    oscillator.frequency.value = 659.25; // Mi
                    gainNode.gain.value = 0.2;
                    oscillator.start();
                    gainNode.gain.exponentialRampToValueAtTime(0.00001, audioContext.currentTime + 0.5);
                    oscillator.stop(audioContext.currentTime + 0.5);
                } else if (type === 'gameEnd') {
                    // Melodía simple
                    [523.25, 659.25, 783.99].forEach((freq, i) => {
                        const osc = audioContext.createOscillator();
                        const gain = audioContext.createGain();
                        osc.connect(gain);
                        gain.connect(audioContext.destination);
                        osc.frequency.value = freq;
                        gain.gain.value = 0.15;
                        osc.start(audioContext.currentTime + i * 0.15);
                        gain.gain.exponentialRampToValueAtTime(0.00001, audioContext.currentTime + i * 0.15 + 0.3);
                        osc.stop(audioContext.currentTime + i * 0.15 + 0.3);
                    });
                }
                
                audioContext.close();
            } catch(e) {
                // Fallback silencioso si no soporta AudioContext
            }
        }
        
        // Actualizar temporizador
        function updateTimerDisplay() {
            const whiteMinutes = Math.floor(whiteTime / 60);
            const whiteSeconds = whiteTime % 60;
            const blackMinutes = Math.floor(blackTime / 60);
            const blackSeconds = blackTime % 60;
            
            whiteTimerEl.textContent = `${whiteMinutes.toString().padStart(2, '0')}:${whiteSeconds.toString().padStart(2, '0')}`;
            blackTimerEl.textContent = `${blackMinutes.toString().padStart(2, '0')}:${blackSeconds.toString().padStart(2, '0')}`;
            
            // Cambiar color si queda poco tiempo
            if (whiteTime < 30) whiteTimerEl.style.color = '#ff6b6b';
            else whiteTimerEl.style.color = 'white';
            
            if (blackTime < 30) blackTimerEl.style.color = '#ff6b6b';
            else blackTimerEl.style.color = 'white';
        }
        
        // Iniciar/detener temporizador
        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            
            timerInterval = setInterval(() => {
                if (game.game_over()) return;
                
                if (currentTimer === 'w') {
                    if (whiteTime > 0) {
                        whiteTime--;
                        updateTimerDisplay();
                        if (whiteTime === 0) {
                            clearInterval(timerInterval);
                            document.getElementById('status').innerHTML = '⏰ ¡Se acabó el tiempo! Ganan NEGRAS';
                            playSound('gameEnd');
                        }
                    }
                } else {
                    if (blackTime > 0) {
                        blackTime--;
                        updateTimerDisplay();
                        if (blackTime === 0) {
                            clearInterval(timerInterval);
                            document.getElementById('status').innerHTML = '⏰ ¡Se acabó el tiempo! Ganan BLANCAS';
                            playSound('gameEnd');
                        }
                    }
                }
            }, 1000);
        }
        
        // Cambiar turno del temporizador
        function switchTimer() {
            currentTimer = game.turn();
            startTimer();
        }
        
        // Renderizar tablero con animación
        function renderBoard(animatedMove = null) {
            const boardDiv = document.getElementById('board');
            boardDiv.innerHTML = '';
            const board = game.board();
            
            for (let i = 0; i < 8; i++) {
                for (let j = 0; j < 8; j++) {
                    const square = String.fromCharCode(97 + j) + (8 - i);
                    const piece = board[i][j];
                    const pieceChar = piece ? pieces[piece.type + (piece.color === 'w' ? '' : '')] : '';
                    const squareDiv = document.createElement('div');
                    squareDiv.className = `square ${(i + j) % 2 === 0 ? 'light' : 'dark'}`;
                    
                    if (selectedSquare === square) squareDiv.classList.add('selected');
                    if (legalMoves.includes(square)) squareDiv.classList.add('legal-move');
                    
                    squareDiv.textContent = pieceChar;
                    squareDiv.onclick = (function(s) { return function() { onSquareClick(s); }; })(square);
                    boardDiv.appendChild(squareDiv);
                }
            }
            updateStatus();
        }
        
        function updateStatus() {
            const statusDiv = document.getElementById('status');
            if (game.game_over()) {
                clearInterval(timerInterval);
                if (game.in_checkmate()) {
                    const winner = game.turn() === 'w' ? '⚫ NEGRAS' : '⚪ BLANCAS';
                    statusDiv.innerHTML = `🏆 ¡JAQUE MATE! Ganan ${winner} 🏆`;
                    playSound('gameEnd');
                }
                else if (game.in_stalemate()) statusDiv.innerHTML = '♾️ TABLAS por ahogado';
                else if (game.in_threefold_repetition()) statusDiv.innerHTML = '🔄 TABLAS por repetición';
                else statusDiv.innerHTML = '⏸️ Juego terminado';
            } else {
                const turn = game.turn() === 'w' ? '⚪ BLANCAS' : '⚫ NEGRAS';
                let checkText = game.in_check() ? ' ⚠️ ¡JAQUE!' : '';
                statusDiv.innerHTML = `🎯 Turno: ${turn}${checkText}`;
                if (game.in_check()) playSound('check');
                switchTimer();
            }
        }
        
        function makeRandomMove() {
            if (!game.game_over() && game.turn() === 'b') {
                setTimeout(() => {
                    const moves = game.moves();
                    if (moves.length > 0) {
                        const randomMove = moves[Math.floor(Math.random() * moves.length)];
                        game.move(randomMove);
                        selectedSquare = null;
                        legalMoves = [];
                        renderBoard();
                        playSound('move');
                    }
                }, 200);
            }
        }
        
        function onSquareClick(square) {
            if (game.game_over()) return;
            
            if (selectedSquare) {
                const move = { from: selectedSquare, to: square, promotion: 'q' };
                const moveResult = game.move(move);
                
                if (moveResult) {
                    // Determinar si fue captura
                    if (moveResult.flags && moveResult.flags.includes('c')) {
                        playSound('capture');
                    } else {
                        playSound('move');
                    }
                    
                    selectedSquare = null;
                    legalMoves = [];
                    renderBoard();
                    makeRandomMove();
                } else {
                    const piece = game.get(square);
                    if (piece && piece.color === game.turn()) {
                        selectedSquare = square;
                        legalMoves = game.moves({ square, verbose: true }).map(m => m.to);
                        renderBoard();
                        playSound('move');
                    } else {
                        selectedSquare = null;
                        legalMoves = [];
                        renderBoard();
                    }
                }
            } else {
                const piece = game.get(square);
                if (piece && piece.color === game.turn()) {
                    selectedSquare = square;
                    legalMoves = game.moves({ square, verbose: true }).map(m => m.to);
                    renderBoard();
                    playSound('move');
                }
            }
        }
        
        // Reiniciar juego
        function resetGame() {
            game.reset();
            selectedSquare = null;
            legalMoves = [];
            whiteTime = 600;
            blackTime = 600;
            currentTimer = 'w';
            updateTimerDisplay();
            renderBoard();
            startTimer();
            playSound('move');
        }
        
        // Alternar sonido
        function toggleSound() {
            soundEnabled = !soundEnabled;
            const btn = document.getElementById('soundToggle');
            btn.innerHTML = soundEnabled ? '🔊 Sonido ON' : '🔇 Sonido OFF';
        }
        
        // Alternar modo noche
        function toggleTheme() {
            document.body.classList.toggle('night-mode');
            const btn = document.getElementById('themeToggle');
            btn.textContent = document.body.classList.contains('night-mode') ? '☀️' : '🌙';
        }
        
        // Event listeners
        document.getElementById('reset').onclick = resetGame;
        document.getElementById('soundToggle').onclick = toggleSound;
        document.getElementById('themeToggle').onclick = toggleTheme;
        
        // Inicializar
        renderBoard();
        startTimer();
    </script>
</body>
</html>
