<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AJEDREZ 3D</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #1a1a2e;
            font-family: system-ui, 'Segoe UI', sans-serif;
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
        }

        /* Pantallas */
        .screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transition: transform 0.3s ease;
            overflow-y: auto;
        }

        .screen-hidden {
            transform: translateX(100%);
            pointer-events: none;
        }

        .screen-visible {
            transform: translateX(0);
            pointer-events: auto;
        }

        /* ========== HOME ========== */
        #homeScreen {
            background: linear-gradient(135deg, #16213e, #0f0f23);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .logo-box {
            background: rgba(255, 215, 0, 0.1);
            border-radius: 70px;
            padding: 25px 45px;
            margin-bottom: 40px;
            border: 1px solid rgba(255, 215, 0, 0.3);
            text-align: center;
        }

        .logo-chess {
            font-size: 80px;
        }

        .title {
            font-size: 32px;
            font-weight: 800;
            color: #ffd700;
            letter-spacing: 2px;
        }

        .btn-play {
            background: linear-gradient(145deg, #ffd700, #ffaa00);
            border: none;
            width: 200px;
            padding: 16px;
            border-radius: 50px;
            font-size: 22px;
            font-weight: bold;
            color: #1a1a2e;
            margin: 20px 0;
            cursor: pointer;
            box-shadow: 0 5px 0 #aa8800;
        }

        .btn-play:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #aa8800;
        }

        .home-buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .home-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 215, 0, 0.3);
            padding: 10px 20px;
            border-radius: 40px;
            color: #ffd700;
            font-weight: 600;
            cursor: pointer;
        }

        /* ========== JUEGO ========== */
        #gameScreen {
            background: #0a0a0a;
        }

        #chessCanvas {
            width: 100%;
            height: 100%;
            display: block;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* UI flotante - minimalista */
        .game-header {
            position: absolute;
            top: 10px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 12px;
            z-index: 20;
            pointer-events: none;
        }

        .game-header button {
            pointer-events: auto;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 30px;
            font-size: 20px;
            color: #ffd700;
            cursor: pointer;
        }

        .timers {
            display: flex;
            gap: 15px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            padding: 5px 15px;
            border-radius: 30px;
        }

        .timer {
            text-align: center;
        }

        .timer-label {
            font-size: 10px;
            color: #ffd700;
        }

        .timer-value {
            font-size: 18px;
            font-weight: bold;
            font-family: monospace;
            color: white;
        }

        .energy {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            padding: 5px 15px;
            border-radius: 30px;
            color: #ffd700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .game-footer {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            padding: 0 12px;
            z-index: 20;
            pointer-events: none;
        }

        .game-footer button {
            pointer-events: auto;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            border: none;
            padding: 6px 14px;
            border-radius: 30px;
            color: #ffd700;
            font-weight: 600;
            font-size: 12px;
            cursor: pointer;
        }

        #gameStatus {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            padding: 6px 14px;
            border-radius: 30px;
            color: #ffd700;
            font-size: 12px;
            font-weight: 600;
        }

        /* INSTRUCCIONES */
        #instructionsScreen {
            background: linear-gradient(135deg, #16213e, #0f0f23);
            padding: 20px;
        }

        .back-btn {
            background: rgba(0, 0, 0, 0.5);
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 30px;
            font-size: 20px;
            color: #ffd700;
            margin-bottom: 20px;
            cursor: pointer;
        }

        .section-title {
            font-size: 24px;
            font-weight: bold;
            color: white;
            margin-bottom: 20px;
        }

        .moves-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
        }

        .move-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 15px;
            border: 1px solid rgba(255, 215, 0, 0.2);
            cursor: pointer;
        }

        .move-icon {
            font-size: 40px;
        }

        .move-name {
            font-size: 18px;
            font-weight: bold;
            color: #ffd700;
            margin: 8px 0;
        }

        .move-desc {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
        }

        .move-algebra {
            font-family: monospace;
            font-size: 12px;
            color: #88ff88;
            background: rgba(0, 0, 0, 0.3);
            padding: 5px;
            border-radius: 8px;
            margin-top: 8px;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            visibility: hidden;
            transition: all 0.2s;
        }

        .modal.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: linear-gradient(135deg, #16213e, #0f0f23);
            border-radius: 30px;
            padding: 25px;
            width: 85%;
            max-width: 320px;
            text-align: center;
            border: 1px solid rgba(255, 215, 0, 0.4);
        }

        .modal-icon {
            font-size: 50px;
        }

        .modal-title {
            font-size: 20px;
            font-weight: bold;
            color: #ffd700;
            margin: 10px 0;
        }

        .modal-moves {
            background: rgba(0, 0, 0, 0.4);
            padding: 10px;
            border-radius: 15px;
            font-family: monospace;
            font-size: 14px;
            color: #88ff88;
            margin: 15px 0;
        }

        .modal-desc {
            color: rgba(255, 255, 255, 0.8);
            font-size: 13px;
            line-height: 1.4;
            margin-bottom: 20px;
        }

        .modal-close {
            background: #ffd700;
            border: none;
            width: 100%;
            padding: 10px;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
        }

        #comingScreen {
            background: linear-gradient(135deg, #16213e, #0f0f23);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
    </style>
</head>
<body>
    <!-- HOME -->
    <div id="homeScreen" class="screen screen-visible">
        <div class="logo-box">
            <div class="logo-chess">♔</div>
            <div class="title">AJEDREZ 3D</div>
        </div>
        <button class="btn-play" id="playBtn">▶ JUGAR</button>
        <div class="home-buttons">
            <button class="home-btn" id="learnBtn">📖 APRENDER</button>
            <button class="home-btn" id="comingBtn">🔜 PRÓXIMAMENTE</button>
        </div>
    </div>

    <!-- JUEGO -->
    <div id="gameScreen" class="screen screen-hidden">
        <canvas id="chessCanvas"></canvas>
        
        <div class="game-header">
            <button id="backToHome">←</button>
            <div class="timers">
                <div class="timer"><div class="timer-label">⚪</div><div class="timer-value" id="whiteTime">10:00</div></div>
                <div class="timer"><div class="timer-label">⚫</div><div class="timer-value" id="blackTime">10:00</div></div>
            </div>
            <div class="energy"><span>⚡</span><span id="energyVal">100</span></div>
        </div>
        
        <div class="game-footer">
            <div id="gameStatus">🎮 Turno: Blancas</div>
            <button id="resetGame">🔄</button>
            <button id="soundToggle">🔊</button>
        </div>
    </div>

    <!-- INSTRUCCIONES -->
    <div id="instructionsScreen" class="screen screen-hidden">
        <button class="back-btn" id="backFromLearn">←</button>
        <div class="section-title">📚 JUGADAS MAESTRAS</div>
        <div class="moves-grid" id="movesGrid"></div>
    </div>

    <!-- PRÓXIMAMENTE -->
    <div id="comingScreen" class="screen screen-hidden">
        <button class="back-btn" id="backFromComing" style="position:absolute; top:20px; left:20px;">←</button>
        <div style="font-size: 70px;">🎮</div>
        <div style="font-size: 28px; font-weight: bold; color: white; margin: 20px;">PRÓXIMAMENTE</div>
        <div style="color: rgba(255,255,255,0.7); line-height: 2;">⚡ Modo Torneo<br>🏆 Ranking<br>👥 Multijugador</div>
        <button class="btn-play" id="volverHome" style="width: auto; padding: 10px 30px; font-size: 16px; margin-top: 30px;">Volver</button>
    </div>

    <!-- MODAL APRENDIZAJE -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <div class="modal-icon" id="modalIcon">♔</div>
            <div class="modal-title" id="modalTitle">Apertura Italiana</div>
            <div class="modal-moves" id="modalMoves">1.e4 e5 2.Cf3 Cc6 3.Ac4</div>
            <div class="modal-desc" id="modalDesc">Controla el centro y desarrolla el alfil a c4, apuntando a f7.</div>
            <button class="modal-close" id="closeModal">Entendido</button>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        
        // ========== MODAL APRENDIZAJE ==========
        const movesData = [
            { icon: '♔', name: 'Apertura Italiana', moves: '1.e4 e5 2.Cf3 Cc6 3.Ac4', desc: 'Controla el centro y desarrolla el alfil a c4, apuntando a f7.' },
            { icon: '♕', name: 'Apertura Española', moves: '1.e4 e5 2.Cf3 Cc6 3.Ab5', desc: 'Presiona el caballo que defiende e5, ganando tiempo.' },
            { icon: '♖', name: 'Enroque', moves: 'Corto: 0-0 | Largo: 0-0-0', desc: 'Protege al rey y activa la torre. Fundamental.' },
            { icon: '♝', name: 'Alfil a c4', moves: 'Ac4', desc: 'Apunta a f7, el punto más débil al inicio.' },
            { icon: '♞', name: 'Caballo a f3', moves: 'Cf3', desc: 'Controla el centro y prepara el enroque.' },
            { icon: '♟', name: 'Peón al Centro', moves: '1.e4 o 1.d4', desc: 'El centro es clave para dominar la partida.' }
        ];
        
        const movesGrid = document.getElementById('movesGrid');
        movesData.forEach(m => {
            const card = document.createElement('div');
            card.className = 'move-card';
            card.innerHTML = `<div class="move-icon">${m.icon}</div><div class="move-name">${m.name}</div><div class="move-desc">${m.desc}</div><div class="move-algebra">${m.moves}</div>`;
            card.onclick = () => {
                document.getElementById('modalIcon').textContent = m.icon;
                document.getElementById('modalTitle').textContent = m.name;
                document.getElementById('modalMoves').textContent = m.moves;
                document.getElementById('modalDesc').textContent = m.desc;
                document.getElementById('modal').classList.add('active');
            };
            movesGrid.appendChild(card);
        });
        
        document.getElementById('closeModal').onclick = () => document.getElementById('modal').classList.remove('active');
        document.getElementById('modal').onclick = (e) => { if(e.target === document.getElementById('modal')) document.getElementById('modal').classList.remove('active'); };
        
        // ========== NAVEGACIÓN ==========
        const home = document.getElementById('homeScreen');
        const gameScreen = document.getElementById('gameScreen');
        const learn = document.getElementById('instructionsScreen');
        const coming = document.getElementById('comingScreen');
        
        function showScreen(screen) {
            home.classList.add('screen-hidden'); home.classList.remove('screen-visible');
            gameScreen.classList.add('screen-hidden'); gameScreen.classList.remove('screen-visible');
            learn.classList.add('screen-hidden'); learn.classList.remove('screen-visible');
            coming.classList.add('screen-hidden'); coming.classList.remove('screen-visible');
            screen.classList.remove('screen-hidden');
            screen.classList.add('screen-visible');
            if(screen === gameScreen) setTimeout(() => resizeAndUpdate(), 100);
        }
        
        document.getElementById('playBtn').onclick = () => showScreen(gameScreen);
        document.getElementById('learnBtn').onclick = () => showScreen(learn);
        document.getElementById('comingBtn').onclick = () => showScreen(coming);
        document.getElementById('backToHome').onclick = () => showScreen(home);
        document.getElementById('backFromLearn').onclick = () => showScreen(home);
        document.getElementById('backFromComing').onclick = () => showScreen(home);
        document.getElementById('volverHome').onclick = () => showScreen(home);
        
        // ========== THREE.JS ==========
        const canvas = document.getElementById('chessCanvas');
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
        renderer.setClearColor(0x1a1a2e);
        renderer.shadowMap.enabled = true;
        
        const scene = new THREE.Scene();
        
        // Cámara - ajustada para que NO haya zoom excesivo
        const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);
        camera.position.set(0, 5.5, 6.5);
        camera.lookAt(0, 0, 0);
        
        // Luces (más brillantes para ver bien las piezas)
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);
        
        const mainLight = new THREE.DirectionalLight(0xfff5e6, 1.2);
        mainLight.position.set(5, 10, 5);
        mainLight.castShadow = true;
        mainLight.receiveShadow = true;
        scene.add(mainLight);
        
        const fillLight = new THREE.PointLight(0x88aaff, 0.4);
        fillLight.position.set(-3, 4, 4);
        scene.add(fillLight);
        
        const backLight = new THREE.PointLight(0xffaa66, 0.3);
        backLight.position.set(0, 3, -5);
        scene.add(backLight);
        
        // Tablero
        const boardGroup = new THREE.Group();
        const squareSize = 0.85;
        const offset = 3.5;
        
        // Colores de casillas (más claros para contraste)
        const lightColor = '#e8d5a3';
        const darkColor = '#8b5a3c';
        
        const squares = [];
        
        for(let i = 0; i < 8; i++) {
            for(let j = 0; j < 8; j++) {
                const isLight = (i + j) % 2 === 0;
                const material = new THREE.MeshStandardMaterial({ color: isLight ? lightColor : darkColor, roughness: 0.4, metalness: 0.1 });
                const square = new THREE.Mesh(new THREE.BoxGeometry(squareSize, 0.1, squareSize), material);
                const x = (j - offset) * squareSize;
                const z = (i - offset) * squareSize;
                square.position.set(x, -0.2, z);
                square.castShadow = true;
                square.receiveShadow = true;
                square.userData = { row: i, col: j, name: String.fromCharCode(97 + j) + (8 - i) };
                boardGroup.add(square);
                squares.push(square);
            }
        }
        
        scene.add(boardGroup);
        
        // Piezas
        const piecesGroup = new THREE.Group();
        scene.add(piecesGroup);
        
        const whiteMat = new THREE.MeshStandardMaterial({ color: 0xf0e6d0, metalness: 0.6, roughness: 0.2 });
        const blackMat = new THREE.MeshStandardMaterial({ color: 0x2a2a2a, metalness: 0.4, roughness: 0.3 });
        
        function createPiece(type, isWhite) {
            const group = new THREE.Group();
            const mat = isWhite ? whiteMat : blackMat;
            
            switch(type) {
                case 'p': // Peón
                    const base = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.27, 0.26, 24), mat);
                    base.position.y = 0.13;
                    group.add(base);
                    const body = new THREE.Mesh(new THREE.SphereGeometry(0.2, 24, 16), mat);
                    body.position.y = 0.36;
                    group.add(body);
                    break;
                case 'n': // Caballo
                    const knight = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.36, 0.44), mat);
                    knight.position.y = 0.23;
                    group.add(knight);
                    break;
                case 'b': // Alfil
                    const bishopBase = new THREE.Mesh(new THREE.CylinderGeometry(0.27, 0.29, 0.22, 24), mat);
                    bishopBase.position.y = 0.13;
                    group.add(bishopBase);
                    const bishopBody = new THREE.Mesh(new THREE.ConeGeometry(0.23, 0.5, 16), mat);
                    bishopBody.position.y = 0.45;
                    group.add(bishopBody);
                    break;
                case 'r': // Torre
                    const rookBase = new THREE.Mesh(new THREE.BoxGeometry(0.44, 0.16, 0.44), mat);
                    rookBase.position.y = 0.1;
                    group.add(rookBase);
                    const rookBody = new THREE.Mesh(new THREE.BoxGeometry(0.39, 0.5, 0.39), mat);
                    rookBody.position.y = 0.38;
                    group.add(rookBody);
                    break;
                case 'q': // Reina
                    const queenBase = new THREE.Mesh(new THREE.CylinderGeometry(0.31, 0.34, 0.22, 24), mat);
                    queenBase.position.y = 0.13;
                    group.add(queenBase);
                    const queenBody = new THREE.Mesh(new THREE.CylinderGeometry(0.27, 0.29, 0.42, 16), mat);
                    queenBody.position.y = 0.41;
                    group.add(queenBody);
                    break;
                case 'k': // Rey
                    const kingBase = new THREE.Mesh(new THREE.CylinderGeometry(0.34, 0.37, 0.24, 24), mat);
                    kingBase.position.y = 0.13;
                    group.add(kingBase);
                    const kingBody = new THREE.Mesh(new THREE.CylinderGeometry(0.31, 0.33, 0.46, 16), mat);
                    kingBody.position.y = 0.44;
                    group.add(kingBody);
                    break;
            }
            return group;
        }
        
        function updatePieces(board) {
            while(piecesGroup.children.length) piecesGroup.remove(piecesGroup.children[0]);
            for(let i = 0; i < 8; i++) {
                for(let j = 0; j < 8; j++) {
                    const piece = board[i][j];
                    if(piece) {
                        const piece3d = createPiece(piece.type, piece.color === 'w');
                        const x = (j - offset) * squareSize;
                        const z = (i - offset) * squareSize;
                        piece3d.position.set(x, -0.08, z);
                        piece3d.castShadow = true;
                        piece3d.userData = { row: i, col: j, type: piece.type, color: piece.color };
                        piecesGroup.add(piece3d);
                    }
                }
            }
        }
        
        // ========== LÓGICA DEL AJEDREZ ==========
        const chess = new Chess();
        let selectedPiece = null;
        let selectedPos = null;
        let soundOn = true;
        let energy = 100;
        let whiteSeconds = 600, blackSeconds = 600, currentTurn = 'w', timerInterval = null;
        
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        
        function clearHighlights() {
            squares.forEach(s => s.material.emissiveIntensity = 0);
        }
        
        function updateUI() {
            const status = document.getElementById('gameStatus');
            if(chess.game_over()) {
                status.innerHTML = chess.in_checkmate() ? '🏆 JAQUE MATE' : '♾️ TABLAS';
            } else {
                status.innerHTML = `🎮 ${chess.turn() === 'w' ? 'Blancas' : 'Negras'}${chess.in_check() ? ' ⚠️' : ''}`;
            }
            document.getElementById('energyVal').innerText = Math.floor(energy);
            updateTimers();
        }
        
        function updateTimers() {
            document.getElementById('whiteTime').innerText = `${Math.floor(whiteSeconds/60)}:${(whiteSeconds%60).toString().padStart(2,'0')}`;
            document.getElementById('blackTime').innerText = `${Math.floor(blackSeconds/60)}:${(blackSeconds%60).toString().padStart(2,'0')}`;
        }
        
        function startTimer() {
            if(timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if(chess.game_over()) return;
                if(currentTurn === 'w') { if(whiteSeconds > 0) whiteSeconds--; }
                else { if(blackSeconds > 0) blackSeconds--; }
                updateTimers();
            }, 1000);
        }
        
        function switchTimer() {
            currentTurn = chess.turn();
            startTimer();
        }
        
        function playSound(type) {
            if(!soundOn) return;
            try {
                const audio = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audio.createOscillator();
                const gain = audio.createGain();
                osc.connect(gain);
                gain.connect(audio.destination);
                osc.frequency.value = type === 'capture' ? 392 : 523;
                gain.gain.value = 0.1;
                osc.start();
                gain.gain.exponentialRampToValueAtTime(0.00001, audio.currentTime + 0.2);
                osc.stop(audio.currentTime + 0.2);
                setTimeout(() => audio.close(), 300);
            } catch(e) {}
        }
        
        function aiMove() {
            if(!chess.game_over() && chess.turn() === 'b') {
                setTimeout(() => {
                    const moves = chess.moves();
                    if(moves.length) {
                        chess.move(moves[Math.floor(Math.random() * moves.length)]);
                        updatePieces(chess.board());
                        clearHighlights();
                        selectedPiece = null;
                        updateUI();
                        playSound('move');
                        energy = Math.min(100, energy + 5);
                        document.getElementById('energyVal').innerText = Math.floor(energy);
                        switchTimer();
                    }
                }, 250);
            }
        }
        
        function onCanvasClick(event) {
            if(chess.game_over()) return;
            
            const rect = canvas.getBoundingClientRect();
            let clientX, clientY;
            if(event.touches) {
                clientX = event.touches[0].clientX;
                clientY = event.touches[0].clientY;
                event.preventDefault();
            } else {
                clientX = event.clientX;
                clientY = event.clientY;
            }
            
            const canvasX = (clientX - rect.left) / rect.width * 2 - 1;
            const canvasY = -(clientY - rect.top) / rect.height * 2 + 1;
            
            mouse.x = canvasX;
            mouse.y = canvasY;
            raycaster.setFromCamera(mouse, camera);
            
            const pieceIntersects = raycaster.intersectObjects(piecesGroup.children, true);
            
            if(pieceIntersects.length > 0) {
                let obj = pieceIntersects[0].object;
                while(obj.parent !== piecesGroup && obj.parent !== obj) obj = obj.parent;
                if(obj.userData && !selectedPiece && obj.userData.color === chess.turn()) {
                    selectedPiece = obj;
                    selectedPos = { row: obj.userData.row, col: obj.userData.col };
                    clearHighlights();
                    const sq = squares.find(s => s.userData.row === selectedPos.row && s.userData.col === selectedPos.col);
                    if(sq) { sq.material.emissive = new THREE.Color(0xffaa00); sq.material.emissiveIntensity = 0.5; }
                    
                    const squareName = String.fromCharCode(97 + selectedPos.col) + (8 - selectedPos.row);
                    chess.moves({ square: squareName, verbose: true }).forEach(m => {
                        const col = m.to.charCodeAt(0) - 97;
                        const row = 8 - parseInt(m.to[1]);
                        const ts = squares.find(s => s.userData.row === row && s.userData.col === col);
                        if(ts) { ts.material.emissive = new THREE.Color(0x44ff44); ts.material.emissiveIntensity = 0.4; }
                    });
                }
            } else {
                const squareIntersects = raycaster.intersectObjects(squares);
                if(squareIntersects.length > 0 && selectedPiece) {
                    const { row, col } = squareIntersects[0].object.userData;
                    const toSquare = String.fromCharCode(97 + col) + (8 - row);
                    const fromSquare = String.fromCharCode(97 + selectedPos.col) + (8 - selectedPos.row);
                    const result = chess.move({ from: fromSquare, to: toSquare, promotion: 'q' });
                    if(result) {
                        updatePieces(chess.board());
                        clearHighlights();
                        selectedPiece = null;
                        updateUI();
                        playSound(result.flags?.includes('c') ? 'capture' : 'move');
                        energy = Math.max(0, energy - 2);
                        document.getElementById('energyVal').innerText = Math.floor(energy);
                        switchTimer();
                        aiMove();
                    } else {
                        clearHighlights();
                        selectedPiece = null;
                    }
                } else {
                    clearHighlights();
                    selectedPiece = null;
                }
            }
        }
        
        function resetGame() {
            chess.reset();
            updatePieces(chess.board());
            clearHighlights();
            selectedPiece = null;
            whiteSeconds = 600;
            blackSeconds = 600;
            currentTurn = 'w';
            energy = 100;
            updateUI();
            startTimer();
            playSound('move');
        }
        
        function toggleSound() {
            soundOn = !soundOn;
            document.getElementById('soundToggle').innerHTML = soundOn ? '🔊' : '🔇';
        }
        
        // Eventos
        canvas.addEventListener('click', onCanvasClick);
        canvas.addEventListener('touchstart', (e) => { e.preventDefault(); onCanvasClick(e); });
        document.getElementById('resetGame').onclick = resetGame;
        document.getElementById('soundToggle').onclick = toggleSound;
        
        // Animación de flotación
        let time = 0;
        function animate() {
            requestAnimationFrame(animate);
            time += 0.016;
            piecesGroup.children.forEach((p, i) => {
                p.position.y = -0.08 + Math.sin(time * 2 + i) * 0.005;
            });
            renderer.render(scene, camera);
        }
        animate();
        
        function resizeAndUpdate() {
            const width = window.innerWidth;
            const height = window.innerHeight;
            renderer.setSize(width, height);
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
        }
        
        window.addEventListener('resize', resizeAndUpdate);
        resizeAndUpdate();
        
        // Inicializar
        updatePieces(chess.board());
        updateUI();
        startTimer();
    </script>
</body>
</html>
