<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>♔ Royal Chess Arena</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
        html,body{width:100%;height:100%;overflow:hidden}
        body{font-family:'Segoe UI',system-ui,sans-serif;background:#0a0a1a;display:flex;justify-content:center;align-items:center}
        .app-container{width:100vw;height:100vh;height:100dvh;background:#0a0a2e;overflow:hidden;display:flex;flex-direction:column;max-width:500px;margin:0 auto}
        .screen{display:none;width:100%;height:100%;flex-direction:column}
        .screen.active{display:flex}
        .home-screen{align-items:center;justify-content:center;gap:12px;padding:20px;background:linear-gradient(180deg,#0a0a2e,#1a1a4e);overflow-y:auto}
        .crown-icon{font-size:60px;filter:drop-shadow(0 0 25px rgba(255,215,0,0.6))}
        .title{font-size:28px;font-weight:900;background:linear-gradient(45deg,#ffd700,#ffed4a,#daa520);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .btn{padding:14px 30px;border:none;border-radius:50px;font-size:15px;font-weight:700;cursor:pointer;text-transform:uppercase;letter-spacing:1px;width:100%;max-width:280px}
        .btn:active{transform:scale(0.95)}
        .btn-play{background:linear-gradient(135deg,#ffd700,#ff8c00);color:#1a1a2e;font-size:20px;padding:18px;box-shadow:0 8px 25px rgba(255,140,0,0.5)}
        .btn-secondary{background:rgba(255,255,255,0.08);color:white;border:1px solid rgba(255,215,0,0.25);font-size:13px;padding:10px}
        input{width:260px;padding:14px;border-radius:50px;border:2px solid rgba(255,215,0,0.4);background:rgba(255,255,255,0.1);color:white;font-size:16px;text-align:center;outline:none}
        .game-screen{display:flex;flex-direction:column;height:100%;background:#0a0a1a}
        .game-header{display:flex;justify-content:space-between;padding:8px;background:rgba(10,10,30,0.95);border-bottom:1px solid rgba(255,215,0,0.2)}
        .player-info{display:flex;align-items:center;gap:6px;color:white}
        .player-dot{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px}
        .player-dot.white{background:linear-gradient(135deg,#fff,#ccc);color:#000}
        .player-dot.black{background:linear-gradient(135deg,#333,#000);color:#fff}
        .player-name{font-size:10px;color:#aaa}
        .timer{font-size:20px;font-weight:900;color:#ffd700;font-family:monospace}
        .board-container{flex:1;display:flex;align-items:center;justify-content:center;padding:5px}
        canvas{border-radius:8px;box-shadow:0 0 60px rgba(255,215,0,0.15);cursor:pointer;max-width:100%;max-height:100%}
        .game-footer{display:flex;align-items:center;gap:8px;padding:6px 10px;background:rgba(10,10,30,0.95);border-top:1px solid rgba(255,215,0,0.2)}
        .energy-bar-wrap{flex:1;height:14px;background:rgba(255,255,255,0.08);border-radius:7px;overflow:hidden}
        .energy-bar{height:100%;background:linear-gradient(90deg,#ff3333,#ffd700,#44ff44);transition:width 0.4s}
        .btn-back{background:rgba(255,255,255,0.08);border:1px solid rgba(255,215,0,0.2);color:#ffd700;padding:8px 14px;border-radius:18px;font-size:11px;cursor:pointer}
    </style>
</head>
<body>
    <div class="app-container">
        <div class="screen active" id="homeScreen">
            <div class="home-screen">
                <div class="crown-icon">👑</div>
                <h1 class="title">ROYAL CHESS</h1>
                <input type="text" id="nameInput" placeholder="Tu nombre" maxlength="15">
                <button class="btn btn-play" onclick="playAI()">⚔️ PLAY NOW (vs IA)</button>
                <button class="btn btn-secondary" onclick="playLocal()">👥 2 JUGADORES</button>
            </div>
        </div>
        <div class="screen" id="gameScreen">
            <div class="game-screen">
                <div class="game-header">
                    <div class="player-info"><div class="player-dot white" id="topDot">⚪</div><div><div class="player-name" id="topName">OPONENTE</div><div class="timer" id="topTimer">10:00</div></div></div>
                    <div class="player-info"><div class="player-dot white" id="bottomDot">⚪</div><div><div class="player-name" id="bottomName">TÚ</div><div class="timer" id="bottomTimer">10:00</div></div></div>
                </div>
                <div class="board-container" id="boardContainer"><canvas id="chessCanvas"></canvas></div>
                <div class="game-footer"><span style="color:#ffd700;font-size:10px">⚡</span><div class="energy-bar-wrap"><div class="energy-bar" id="energyBar" style="width:100%"></div></div><button class="btn-back" onclick="goHome()">🏠</button></div>
            </div>
        </div>
    </div>

    <script>
        // CHESS ENGINE
        const chess = {
            board: [],
            init() {
                this.board = [
                    ['r','n','b','q','k','b','n','r'],
                    ['p','p','p','p','p','p','p','p'],
                    ['','','','','','','',''],
                    ['','','','','','','',''],
                    ['','','','','','','',''],
                    ['','','','','','','',''],
                    ['P','P','P','P','P','P','P','P'],
                    ['R','N','B','Q','K','B','N','R']
                ];
            },
            piece(r, c) {
                if (r < 0 || r > 7 || c < 0 || c > 7) return '';
                return this.board[r][c] || '';
            },
            isValid(fr, fc, tr, tc) {
                const p = this.piece(fr, fc);
                if (!p) return false;
                const tgt = this.piece(tr, tc);
                if (tgt && ((p === p.toUpperCase() && tgt === tgt.toUpperCase()) || (p === p.toLowerCase() && tgt === tgt.toLowerCase()))) return false;
                const type = p.toLowerCase(), rd = tr - fr, cd = tc - fc, ard = Math.abs(rd), acd = Math.abs(cd);
                const clear = (dr, dc) => {
                    const steps = Math.max(Math.abs(dr), Math.abs(dc));
                    const sr = dr === 0 ? 0 : dr / Math.abs(dr);
                    const sc = dc === 0 ? 0 : dc / Math.abs(dc);
                    for (let i = 1; i < steps; i++) if (this.piece(fr + sr * i, fc + sc * i)) return false;
                    return true;
                };
                switch (type) {
                    case 'p': const d = p === 'P' ? -1 : 1, sr = p === 'P' ? 6 : 1;
                        if (cd === 0 && !tgt) { if (rd === d) return true; if (fr === sr && rd === 2 * d && !this.piece(fr + d, fc)) return true; }
                        return acd === 1 && rd === d && !!tgt;
                    case 'r': return (rd === 0 || cd === 0) && clear(rd, cd);
                    case 'n': return (ard === 2 && acd === 1) || (ard === 1 && acd === 2);
                    case 'b': return ard === acd && clear(rd, cd);
                    case 'q': return (rd === 0 || cd === 0 || ard === acd) && clear(rd, cd);
                    case 'k': return ard <= 1 && acd <= 1;
                }
                return false;
            },
            move(fr, fc, tr, tc) {
                const p = this.piece(fr, fc);
                const c = this.piece(tr, tc);
                this.board[tr][tc] = p;
                this.board[fr][fc] = '';
            },
            findKing(color) {
                const k = color === 'w' ? 'K' : 'k';
                for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) if (this.board[r][c] === k) return { row: r, col: c };
                return null;
            },
            inCheck(color) {
                const king = this.findKing(color);
                if (!king) return false;
                for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) {
                    const p = this.board[r][c];
                    if (p && ((color === 'w' && p === p.toLowerCase()) || (color === 'b' && p === p.toUpperCase())))
                        if (this.isValid(r, c, king.row, king.col)) return true;
                }
                return false;
            },
            hasMoves(color) {
                for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) {
                    const p = this.board[r][c];
                    if ((color === 'w' && p && p === p.toUpperCase()) || (color === 'b' && p && p === p.toLowerCase()))
                        for (let tr = 0; tr < 8; tr++) for (let tc = 0; tc < 8; tc++)
                            if (this.isValid(r, c, tr, tc)) {
                                const saved = this.board[tr][tc];
                                this.board[tr][tc] = p; this.board[r][c] = '';
                                const check = this.inCheck(color);
                                this.board[r][c] = p; this.board[tr][tc] = saved;
                                if (!check) return true;
                            }
                }
                return false;
            },
            aiMove() {
                const moves = [];
                for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) {
                    const p = this.board[r][c];
                    if (p && p === p.toLowerCase())
                        for (let tr = 0; tr < 8; tr++) for (let tc = 0; tc < 8; tc++)
                            if (this.isValid(r, c, tr, tc)) {
                                const saved = this.board[tr][tc];
                                this.board[tr][tc] = p; this.board[r][c] = '';
                                if (!this.inCheck('b')) {
                                    let sc = saved ? (saved.toUpperCase() === 'Q' ? 9 : saved.toUpperCase() === 'R' ? 5 : 'BN'.includes(saved.toUpperCase()) ? 3 : 1) : 0;
                                    moves.push({ fr: r, fc: c, tr: tr, tc: tc, score: sc });
                                }
                                this.board[r][c] = p; this.board[tr][tc] = saved;
                            }
                }
                if (!moves.length) return null;
                moves.sort((a, b) => b.score - a.score);
                return Math.random() < 0.7 ? moves[0] : moves[Math.floor(Math.random() * Math.min(5, moves.length))];
            }
        };

        // CANVAS - CORREGIDO
        const canvas = document.getElementById('chessCanvas'), ctx = canvas.getContext('2d');
        let B = 0, S = 0;
        function resize() { 
            const c = document.getElementById('boardContainer');
            const s = Math.floor(Math.min(c.clientWidth, c.clientHeight) * 0.98);
            B = s; S = s / 8;
            canvas.width = B; canvas.height = B;
            canvas.style.width = B + 'px'; canvas.style.height = B + 'px';
            drawBoard();
        }
        const SYM = { K: '♔', Q: '♕', R: '♖', B: '♗', N: '♘', P: '♙', k: '♚', q: '♛', r: '♜', b: '♝', n: '♞', p: '♟' };

        function drawBoard() {
            // Limpiar canvas COMPLETAMENTE
            ctx.clearRect(0, 0, B, B);
            
            // RESETEAR todas las propiedades del contexto
            ctx.shadowColor = 'transparent';
            ctx.shadowBlur = 0;
            ctx.shadowOffsetX = 0;
            ctx.shadowOffsetY = 0;
            ctx.globalAlpha = 1;
            
            // Dibujar casillas
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const x = c * S, y = r * S;
                    const light = (r + c) % 2 === 0;
                    ctx.fillStyle = light ? '#f0d9b5' : '#b58863';
                    ctx.fillRect(x, y, S, S);
                }
            }
            
            // Resaltar selección
            if (gs.sel) {
                const r = gs.sel.row, c = gs.sel.col;
                ctx.fillStyle = 'rgba(255, 255, 0, 0.4)';
                ctx.fillRect(c * S, r * S, S, S);
                ctx.strokeStyle = '#ffd700';
                ctx.lineWidth = 3;
                ctx.strokeRect(c * S + 1, r * S + 1, S - 2, S - 2);
            }
            
            // Dibujar piezas - SIN SOMBRAS para evitar bugs
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const piece = chess.board[r] ? chess.board[r][c] : '';
                    if (!piece) continue;
                    
                    const x = c * S + S / 2;
                    const y = r * S + S / 2;
                    const isWhite = piece === piece.toUpperCase();
                    const radius = S * 0.38;
                    
                    // Dibujar círculo base
                    ctx.beginPath();
                    ctx.arc(x, y + 2, radius, 0, Math.PI * 2);
                    
                    if (isWhite) {
                        ctx.fillStyle = '#ffffff';
                        ctx.strokeStyle = '#999999';
                    } else {
                        ctx.fillStyle = '#333333';
                        ctx.strokeStyle = '#000000';
                    }
                    ctx.lineWidth = 1.5;
                    ctx.fill();
                    ctx.stroke();
                    
                    // Dibujar símbolo
                    const fontSize = S * 0.65;
                    ctx.fillStyle = isWhite ? '#000000' : '#ffffff';
                    ctx.font = `bold ${fontSize}px "Segoe UI Symbol", "Apple Color Emoji", Arial`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    const symbol = SYM[piece];
                    if (symbol) {
                        ctx.fillText(symbol, x, y + 2);
                    }
                }
            }
        }

        // GAME STATE
        let gs = { mode: 'ai', sel: null, t1: 600, t2: 600, over: false, turn: 'w', combo: 0, energy: 100 };
        let timer, myName = '';

        function goHome() { clearInterval(timer); document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); document.getElementById('homeScreen').classList.add('active'); }
        function fmt(s) { return Math.floor(s / 60) + ':' + (s % 60).toString().padStart(2, '0'); }
        function startTimers() {
            clearInterval(timer);
            timer = setInterval(() => {
                if (gs.over) return;
                if (gs.turn === 'w') { gs.t1--; if (gs.t1 <= 0) endGame('time'); }
                else { gs.t2--; if (gs.t2 <= 0) endGame('time'); }
                document.getElementById('bottomTimer').textContent = fmt(gs.t1);
                document.getElementById('topTimer').textContent = fmt(gs.t2);
            }, 1000);
        }

        function setupGame() {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('gameScreen').classList.add('active');
            document.getElementById('energyBar').style.width = gs.energy + '%';
            document.getElementById('bottomTimer').textContent = fmt(gs.t1);
            document.getElementById('topTimer').textContent = fmt(gs.t2);
            setTimeout(resize, 100);
            setTimeout(resize, 300);
            startTimers();
        }

        function playAI() {
            myName = document.getElementById('nameInput').value.trim() || 'Jugador';
            chess.init();
            gs = { mode: 'ai', sel: null, t1: 600, t2: 600, over: false, turn: 'w', combo: 0, energy: 100 };
            document.getElementById('bottomName').textContent = myName + ' ⚪';
            document.getElementById('bottomDot').className = 'player-dot white';
            document.getElementById('bottomDot').textContent = '⚪';
            document.getElementById('topName').textContent = 'IA ⚫';
            document.getElementById('topDot').className = 'player-dot black';
            document.getElementById('topDot').textContent = '⚫';
            setupGame();
        }

        function playLocal() {
            myName = document.getElementById('nameInput').value.trim() || 'J1';
            chess.init();
            gs = { mode: 'local', sel: null, t1: 600, t2: 600, over: false, turn: 'w', combo: 0, energy: 100 };
            document.getElementById('bottomName').textContent = myName + ' ⚪';
            document.getElementById('bottomDot').className = 'player-dot white';
            document.getElementById('bottomDot').textContent = '⚪';
            document.getElementById('topName').textContent = 'J2 ⚫';
            document.getElementById('topDot').className = 'player-dot black';
            document.getElementById('topDot').textContent = '⚫';
            setupGame();
        }

        function endGame(reason) {
            gs.over = true; clearInterval(timer);
            alert(reason === 'checkmate' ? '🏆 JAQUE MATE!' : reason === 'time' ? '⏰ TIEMPO!' : '🤝 TABLAS!');
            setTimeout(goHome, 2000);
        }

        function getSquare(e) {
            const r = canvas.getBoundingClientRect();
            const sx = B / r.width, sy = B / r.height;
            const col = Math.floor((e.clientX - r.left) * sx / S);
            const row = Math.floor((e.clientY - r.top) * sy / S);
            return (row >= 0 && row < 8 && col >= 0 && col < 8) ? { row, col } : null;
        }

        function click(row, col) {
            if (gs.over) return;
            if (gs.mode === 'ai' && gs.turn !== 'w') return;

            if (gs.sel) {
                const fr = gs.sel.row, fc = gs.sel.col;
                
                // Click en la misma pieza = deseleccionar
                if (fr === row && fc === col) {
                    gs.sel = null;
                    drawBoard();
                    return;
                }
                
                // Verificar si es un movimiento válido
                if (chess.isValid(fr, fc, row, col)) {
                    // Guardar estado
                    const movingPiece = chess.board[fr][fc];
                    const capturedPiece = chess.board[row][col];
                    
                    // Hacer movimiento
                    chess.board[row][col] = movingPiece;
                    chess.board[fr][fc] = '';
                    
                    // Verificar jaque
                    if (!chess.inCheck(gs.turn)) {
                        // Movimiento válido
                        gs.sel = null;
                        gs.turn = (gs.turn === 'w') ? 'b' : 'w';
                        gs.energy = Math.max(0, gs.energy - 2);
                        document.getElementById('energyBar').style.width = gs.energy + '%';
                        drawBoard();
                        
                        // Verificar fin del juego
                        const opp = gs.turn === 'w' ? 'b' : 'w';
                        if (chess.inCheck(opp) && !chess.hasMoves(opp)) {
                            endGame('checkmate');
                            return;
                        }
                        if (!chess.inCheck(opp) && !chess.hasMoves(opp)) {
                            endGame('stalemate');
                            return;
                        }
                        
                        // Turno de la IA
                        if (gs.mode === 'ai' && gs.turn === 'b' && !gs.over) {
                            setTimeout(() => {
                                const m = chess.aiMove();
                                if (m) {
                                    chess.board[m.tr][m.tc] = chess.board[m.fr][m.fc];
                                    chess.board[m.fr][m.fc] = '';
                                    gs.turn = 'w';
                                    gs.energy = Math.min(100, gs.energy + 5);
                                    document.getElementById('energyBar').style.width = gs.energy + '%';
                                    
                                    const opp2 = 'w';
                                    if (chess.inCheck(opp2) && !chess.hasMoves(opp2)) endGame('checkmate');
                                    else if (!chess.inCheck(opp2) && !chess.hasMoves(opp2)) endGame('stalemate');
                                }
                                drawBoard();
                            }, 300);
                        }
                    } else {
                        // Revertir movimiento
                        chess.board[fr][fc] = movingPiece;
                        chess.board[row][col] = capturedPiece;
                        gs.sel = null;
                        drawBoard();
                    }
                } else {
                    // Movimiento inválido - verificar si click en otra pieza propia
                    const clickedPiece = chess.piece(row, col);
                    if (clickedPiece) {
                        const isW = clickedPiece === clickedPiece.toUpperCase();
                        const canSelect = (gs.mode === 'ai' && isW) || 
                                        (gs.mode === 'local' && ((gs.turn === 'w' && isW) || (gs.turn === 'b' && !isW)));
                        gs.sel = canSelect ? { row, col } : null;
                    } else {
                        gs.sel = null;
                    }
                    drawBoard();
                }
            } else {
                // Seleccionar pieza
                const piece = chess.piece(row, col);
                if (piece) {
                    const isW = piece === piece.toUpperCase();
                    const canSelect = (gs.mode === 'ai' && isW) || 
                                    (gs.mode === 'local' && ((gs.turn === 'w' && isW) || (gs.turn === 'b' && !isW)));
                    if (canSelect) gs.sel = { row, col };
                }
            }
            drawBoard();
        }

        canvas.addEventListener('click', e => { const s = getSquare(e); if (s) click(s.row, s.col); });
        canvas.addEventListener('touchstart', e => { e.preventDefault(); const s = getSquare(e.touches[0]); if (s) click(s.row, s.col); }, { passive: false });
        window.addEventListener('resize', () => { if (document.getElementById('gameScreen').classList.contains('active')) setTimeout(resize, 150); });
    </script>
</body>
</html>
