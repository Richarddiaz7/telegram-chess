<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>♔ Royal Chess Arena</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
        html, body { width: 100%; height: 100%; overflow: hidden; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0a0a1a; display: flex; justify-content: center; align-items: center; }
        .app-container { width: 100vw; height: 100vh; height: 100dvh; background: #0a0a2e; overflow: hidden; display: flex; flex-direction: column; max-width: 500px; margin: 0 auto; }
        .screen { display: none; width: 100%; height: 100%; flex-direction: column; }
        .screen.active { display: flex; }

        /* PORTADA PRINCIPAL */
        .home-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 20px; width: 100%; height: 100%; text-align: center; background: linear-gradient(180deg, rgba(10,10,46,0.65), rgba(26,26,78,0.8)); }
        .crown-icon { font-size: 60px; filter: drop-shadow(0 0 25px rgba(255,215,0,0.6)); text-align: center; }
        .title { font-size: 28px; font-weight: 900; background: linear-gradient(45deg, #ffd700, #ffed4a, #daa520); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-align: center; width: 100%; }
        .btn { padding: 14px 30px; border: none; border-radius: 50px; font-size: 15px; font-weight: 700; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; width: 100%; max-width: 280px; }
        .btn:active { transform: scale(0.95); }
        .btn-play { background: linear-gradient(135deg, #ffd700, #ff8c00); color: #1a1a2e; font-size: 20px; padding: 18px; box-shadow: 0 8px 25px rgba(255,140,0,0.5); margin-bottom: 5px; }
        .btn-secondary { background: rgba(255,255,255,0.08); color: white; border: 1px solid rgba(255,215,0,0.25); font-size: 13px; padding: 10px; }
        input { width: 260px; padding: 14px; border-radius: 50px; border: 2px solid rgba(255,215,0,0.4); background: rgba(0,0,0,0.4); color: white; font-size: 16px; text-align: center; outline: none; backdrop-filter: blur(4px); }

        /* PANTALLA DE JUEGO */
        .game-screen { display: flex; flex-direction: column; height: 100%; background: linear-gradient(180deg, rgba(10,10,26,0.5), rgba(10,10,26,0.7)); }
        .game-header { display: flex; justify-content: space-between; padding: 8px; background: rgba(10,10,30,0.85); border-bottom: 1px solid rgba(255,215,0,0.2); backdrop-filter: blur(4px); min-height: 65px; align-items: center; }
        .player-info { display: flex; align-items: center; gap: 6px; color: white; flex: 1; }
        .player-dot { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; }
        .player-dot.white { background: linear-gradient(135deg, #fff, #ccc); color: #000; }
        .player-dot.black { background: linear-gradient(135deg, #333, #000); color: #fff; }
        .player-name { font-size: 11px; color: #fff; font-weight: 500; }
        .timer { font-size: 18px; font-weight: 900; color: #ffd700; font-family: monospace; }
        .turn-dot { width: 10px; height: 10px; border-radius: 50%; }
        .turn-dot.you { background: #44ff44; box-shadow: 0 0 10px #44ff44; }
        .turn-dot.opp { background: #555; }
        .board-container { flex: 1; display: flex; align-items: center; justify-content: center; padding: 5px; }
        canvas { border-radius: 8px; box-shadow: 0 0 60px rgba(255,215,0,0.15); cursor: pointer; max-width: 100%; max-height: 100%; }
        .game-footer { display: flex; align-items: center; gap: 8px; padding: 6px 10px; background: rgba(10,10,30,0.85); border-top: 1px solid rgba(255,215,0,0.2); backdrop-filter: blur(4px); }
        .energy-bar-wrap { flex: 1; height: 14px; background: rgba(255,255,255,0.08); border-radius: 7px; overflow: hidden; }
        .energy-bar { height: 100%; background: linear-gradient(90deg, #ff3333, #ffd700, #44ff44); transition: width 0.4s; }
        .btn-back { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,215,0,0.2); color: #ffd700; padding: 8px 14px; border-radius: 18px; font-size: 11px; cursor: pointer; }

        /* MODAL / LOBBY */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 200; justify-content: center; align-items: center; }
        .modal.active { display: flex; }
        .modal-box { background: #1a1a3a; border: 2px solid rgba(255,215,0,0.4); border-radius: 16px; padding: 20px; max-width: 380px; width: 90%; color: white; box-shadow: 0 0 30px rgba(0,0,0,0.7); }
        .modal-box h2 { color: #ffd700; text-align: center; margin-bottom: 15px; }
        .room-card { background: rgba(0,0,0,0.4); border: 1px solid rgba(255,215,0,0.2); border-radius: 12px; padding: 12px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; width: 100%; }
        .room-name { color: #ffd700; font-weight: 700; font-size: 14px; }
        .room-join { background: #ffd700; color: #000; padding: 6px 12px; border-radius: 20px; border: none; cursor: pointer; font-weight: 700; font-size: 12px; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="screen active" id="homeScreen">
            <div class="home-screen">
                <div class="crown-icon">👑</div>
                <h1 class="title">ROYAL CHESS</h1>
                <p style="color:#aaa;font-size:12px;margin-bottom:8px;">Play & Earn Arena</p>
                <input type="text" id="nameInput" placeholder="Tu nombre" maxlength="15">
                <button class="btn btn-play" onclick="playLocal()">⚔️ MODO LOCAL</button>
                <button class="btn btn-secondary" onclick="openLobby()">🌐 MULTIJUGADOR</button>
            </div>
        </div>

        <div class="screen" id="gameScreen">
            <div class="game-screen">
                <div class="game-header">
                    <div class="player-info">
                        <div class="player-dot white" id="topDot">⚫</div>
                        <div><div class="player-name" id="topName">OPONENTE</div></div>
                        <div class="turn-dot opp" id="topTurn"></div>
                    </div>
                    <div class="player-info">
                        <div class="player-dot white" id="bottomDot">⚪</div>
                        <div><div class="player-name" id="bottomName">TÚ</div></div>
                        <div class="turn-dot you" id="bottomTurn"></div>
                    </div>
                </div>
                <div class="board-container" id="boardContainer">
                    <canvas id="chessCanvas"></canvas>
                </div>
                <div class="game-footer">
                    <span style="color:#ffd700;font-size:10px;">⚡</span>
                    <div class="energy-bar-wrap"><div class="energy-bar" id="energyBar" style="width:100%"></div></div>
                    <button class="btn-back" onclick="exitRoom()">🏠 SALIR</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal" id="lobbyModal">
        <div class="modal-box">
            <h2>🌐 Salas Disponibles</h2>
            <button class="btn btn-secondary" onclick="createRoom()" style="margin-bottom:10px; width: 100%;">🏠 Crear Nueva Sala</button>
            <div id="roomList" style="max-height:200px; overflow-y:auto;"></div>
            <button class="btn-back" onclick="closeLobby()" style="width:100%; margin-top:10px;">CERRAR</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <script>
        // ============ CONFIGURACIÓN GLOBAL DEL ESTADO ============
        const gs = { 
            viewBlack: false, 
            roomId: null, 
            role: 'w', // 'w' para creador (blancas), 'b' para invitado (negras)
            turn: 'w', 
            sel: null 
        };

        // ============ INICIALIZAR FIREBASE ============
        firebase.initializeApp({
            apiKey: "AIzaSyDMu83hA5xjmwSlUX4KUgWkYlx6SqHcaAk",
            databaseURL: "https://royal-chess-multiplayer-default-rtdb.firebaseio.com"
        });
        const db = firebase.database();

        // ============ MOTOR DE AJEDREZ ============
        const chess = {
            board: [],
            init() { this.board = [['r','n','b','q','k','b','n','r'],['p','p','p','p','p','p','p','p'],['','','','','','','',''],['','','','','','','',''],['','','','','','','',''],['','','','','','','',''],['P','P','P','P','P','P','P','P'],['R','N','B','Q','K','B','N','R']]; },
            getPiece(r,c) { return this.board[r]?.[c]||''; },
            isValid(fr,fc,tr,tc) {
                const p=this.getPiece(fr,fc); if(!p)return false;
                const tgt=this.getPiece(tr,tc); if(tgt&&((p===p.toUpperCase()&&tgt===tgt.toUpperCase())||(p===p.toLowerCase()&&tgt===tgt.toLowerCase())))return false;
                const type=p.toLowerCase(),rd=tr-fr,cd=tc-fc,ard=Math.abs(rd),acd=Math.abs(cd);
                const cp=(dr,dc)=>{const s=Math.max(Math.abs(dr),Math.abs(dc)),sr=dr===0?0:dr/Math.abs(dr),sc=dc===0?0:dc/Math.abs(dc);for(let i=1;i<s;i++)if(this.getPiece(fr+sr*i,fc+sc*i))return false;return true;};
                switch(type){case'p':const d=p==='P'?-1:1,sr=p==='P'?6:1;if(cd===0&&!tgt){if(rd===d)return true;if(fr===sr&&rd===2*d&&!this.getPiece(fr+d,fc))return true;}return acd===1&&rd===d&&!!tgt;case'r':return(rd===0||cd===0)&&cp(rd,cd);case'n':return(ard===2&&acd===1)||(ard===1&&acd===2);case'b':return ard===acd&&cp(rd,cd);case'q':return(rd===0||cd===0||ard===acd)&&cp(rd,cd);case'k':return ard<=1&&acd<=1;}return false;
            },
            move(fr,fc,tr,tc){const p=this.getPiece(fr,fc);this.board[tr][tc]=p;this.board[fr][fc]='';}
        };

        // ============ MOTOR GRÁFICO (CANVAS) ============
        const canvas = document.getElementById('chessCanvas'), ctx = canvas.getContext('2d');
        let B = 0, S = 0;
        function resize() { 
            const c = document.getElementById('boardContainer'); 
            const s = Math.floor(Math.min(c.clientWidth, c.clientHeight) * 0.98); 
            B = s; S = s / 8; canvas.width = B; canvas.height = B; draw(); 
        }
        const SYM = {K:'♔',Q:'♕',R:'♖',B:'♗',N:'♘',P:'♙',k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟'};

        function draw() {
            ctx.clearRect(0,0,B,B);
            for(let r=0;r<8;r++)for(let c=0;c<8;c++){
                let dr=r,dc=c; if(gs.viewBlack){dr=7-r;dc=7-c;}
                const x=dc*S,y=dr*S,light=(r+c)%2===0;
                ctx.fillStyle = light ? '#f5deb3' : '#8b6914';
                ctx.fillRect(x,y,S,S);
            }
            if(gs.sel){
                let r=gs.sel.row,c=gs.sel.col; if(gs.viewBlack){r=7-r;c=7-c;}
                ctx.fillStyle='rgba(255,215,0,0.4)'; ctx.fillRect(c*S,r*S,S,S);
            }
            for(let r=0;r<8;r++)for(let c=0;c<8;c++){
                const p=chess.getPiece(r,c); if(!p)continue;
                let dr=r,dc=c; if(gs.viewBlack){dr=7-r;dc=7-c;}
                const cx=dc*S+S/2,cy=dr*S+S/2,isW=p===p.toUpperCase();
                ctx.fillStyle = isW ? '#fff' : '#000';
                ctx.strokeStyle = isW ? '#000' : '#fff';
                ctx.font = `bold ${S*0.7}px sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText(SYM[p], cx, cy);
            }
        }

        // ============ CLICK DEL JUGADOR SINCRO CON FIREBASE ============
        canvas.addEventListener('click', (e) => {
            // Si estamos en multijugador y no es tu turno, bloquear clicks
            if (gs.roomId && gs.turn !== gs.role) return;

            const rect = canvas.getBoundingClientRect();
            let c = Math.floor((e.clientX - rect.left) / S);
            let r = Math.floor((e.clientY - rect.top) / S);
            if (gs.viewBlack) { r = 7 - r; c = 7 - c; }
            
            const p = chess.getPiece(r, c);

            if (gs.sel) {
                if (chess.isValid(gs.sel.row, gs.sel.col, r, c)) {
                    chess.move(gs.sel.row, gs.sel.col, r, c);
                    gs.sel = null;
                    const nextTurn = gs.turn === 'w' ? 'b' : 'w';

                    if (gs.roomId) {
                        // Enviamos el movimiento al servidor Firebase en tiempo real
                        db.ref('rooms/' + gs.roomId).update({
                            board: chess.board,
                            turn: nextTurn
                        });
                    } else {
                        gs.turn = nextTurn;
                        draw();
                    }
                } else {
                    // Seleccionar otra pieza propia
                    if(p && ((gs.turn === 'w' && p === p.toUpperCase()) || (gs.turn === 'b' && p === p.toLowerCase()))) {
                        gs.sel = {row: r, col: c};
                    } else { gs.sel = null; }
                }
            } else {
                if(p && ((gs.turn === 'w' && p === p.toUpperCase()) || (gs.turn === 'b' && p === p.toLowerCase()))) {
                    gs.sel = {row: r, col: c};
                }
            }
            draw();
        });

        // ============ LÓGICA DE SALAS Y LOBBY EN TIEMPO REAL ============
        function openLobby() {
            document.getElementById('lobbyModal').classList.add('active');
            // Muestra solo salas con estatus 'waiting'
            db.ref('rooms').on('value', (snap) => {
                const list = document.getElementById('roomList');
                list.innerHTML = '';
                snap.forEach(child => {
                    const room = child.val();
                    if(room.status === 'waiting') {
                        list.innerHTML += `<div class="room-card">
                            <span class="room-name">Sala de ${room.white}</span>
                            <button class="room-join" onclick="joinRoom('${child.key}')">UNIRSE</button>
                        </div>`;
                    }
                });
            });
        }

        function closeLobby() { document.getElementById('lobbyModal').classList.remove('active'); }

        function createRoom() {
            const name = document.getElementById('nameInput').value || 'Anfitrión';
            const roomRef = db.ref('rooms').push();
            
            gs.roomId = roomRef.key;
            gs.role = 'w'; // Creador es Blancas
            gs.viewBlack = false; // Vista normal
            chess.init();

            // 🔥 CRUCIAL: Si el creador cierra la app o pierde internet, la sala se destruye sola
            roomRef.onDisconnect().remove();

            roomRef.set({
                white: name,
                status: 'waiting',
                turn: 'w',
                board: chess.board
            });

            closeLobby();
            listenToRoom(gs.roomId);
        }

        function joinRoom(id) {
            const name = document.getElementById('nameInput').value || 'Invitado';
            gs.roomId = id;
            gs.role = 'b'; // Invitado es Negras
            gs.viewBlack = true; // Volteamos el tablero automáticamente para las negras

            // Una vez que te unes, también escuchamos si te desconectas para limpiar
            db.ref('rooms/' + id).onDisconnect().remove();

            db.ref('rooms/' + id).update({
                black: name,
                status: 'playing'
            }).then(() => {
                closeLobby();
                listenToRoom(id);
            });
        }

        // ============ EL ESCUCHADOR CENTRAL DE LA PARTIDA ============
        function listenToRoom(id) {
            db.ref('rooms/' + id).on('value', (snap) => {
                const room = snap.val();
                if (!room) {
                    alert('La sala se ha cerrado o el rival abandonó.');
                    exitRoom();
                    return;
                }

                // Si entra el segundo jugador, Firebase cambia el estatus y arranca para ambos
                if (room.status === 'playing') {
                    chess.board = room.board;
                    gs.turn = room.turn;

                    // Actualizar Interfaz Gráfica de nombres dinámicamente
                    document.getElementById('topName').innerText = gs.role === 'w' ? room.black : room.white;
                    document.getElementById('bottomName').innerText = gs.role === 'w' ? room.white : room.black;
                    
                    // Colocar luces indicadoras de turno
                    if (gs.turn === gs.role) {
                        document.getElementById('bottomTurn').className = "turn-dot you";
                        document.getElementById('topTurn').className = "turn-dot opp";
                    } else {
                        document.getElementById('bottomTurn').className = "turn-dot opp";
                        document.getElementById('topTurn').className = "turn-dot you";
                    }

                    // Forzar el cambio de pantalla a la zona de juego
                    if(!document.getElementById('gameScreen').classList.contains('active')) {
                        document.getElementById('homeScreen').classList.remove('active');
                        document.getElementById('gameScreen').classList.add('active');
                        resize();
                    }
                    draw();
                }
            });
        }

        // ============ SALIR Y RESETEAR (LIMPIEZA DE BASES DE DATOS) ============
        function exitRoom() {
            if (gs.roomId) {
                // Borra la sala de Firebase para que no quede basura guardada
                db.ref('rooms/' + gs.roomId).remove();
                db.ref('rooms/' + gs.roomId).off();
                gs.roomId = null;
            }
            document.getElementById('gameScreen').classList.remove('active');
            document.getElementById('homeScreen').classList.add('active');
            db.ref('rooms').off();
        }

        function playLocal() {
            gs.roomId = null;
            gs.role = 'w';
            gs.viewBlack = false;
            gs.turn = 'w';
            chess.init();
            document.getElementById('homeScreen').classList.remove('active');
            document.getElementById('gameScreen').classList.add('active');
            document.getElementById('topName').innerText = "RIVAL LOCAL";
            document.getElementById('bottomName').innerText = "JUGADOR 1";
            resize();
        }

        window.addEventListener('resize', resize);
    </script>
</body>
</html>
