<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>♔ Royal Chess - Trivia & Quiz</title>
    <style>
        :root {
            --gold: #ffd700;
            --bg: #0a0a2e;
            --panel: rgba(10, 10, 30, 0.95);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--bg);
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            background: linear-gradient(180deg, #0a0a2e 0%, #1a1a4e 50%, #0a0a2e 100%);
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 20%, rgba(255,215,0,0.08) 0%, transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(147,112,219,0.08) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .app-container {
            position: relative;
            z-index: 1;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background: rgba(10, 10, 30, 0.75);
            backdrop-filter: blur(20px);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            max-width: 500px;
            margin: 0 auto;
            border: 1px solid rgba(255,215,0,0.15);
            box-shadow: 0 0 60px rgba(255,215,0,0.08);
        }

        @media (orientation: landscape) {
            .app-container {
                max-width: 750px;
                flex-direction: row;
            }
        }

        .screen {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
            animation: fadeIn 0.35s ease-out;
            overflow-y: auto;
        }

        .screen.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ============ HOME ============ */
        .home-screen {
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 20px;
        }

        .crown-icon {
            font-size: 70px;
            filter: drop-shadow(0 0 30px rgba(255,215,0,0.6));
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .title {
            font-size: 30px;
            font-weight: 900;
            background: linear-gradient(45deg, #ffd700, #ffed4a, #daa520);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
        }

        .subtitle {
            color: #c0c0c0;
            font-size: 11px;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .stats-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .stat-card {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,215,0,0.15);
            border-radius: 12px;
            padding: 10px 16px;
            text-align: center;
            min-width: 70px;
        }

        .stat-card .val {
            color: #ffd700;
            font-size: 22px;
            font-weight: 900;
        }

        .stat-card .lbl {
            color: #888;
            font-size: 9px;
            text-transform: uppercase;
        }

        .btn {
            padding: 14px 30px;
            border: none;
            border-radius: 50px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
            width: 100%;
            max-width: 300px;
        }

        .btn:active {
            transform: scale(0.94);
        }

        .btn-gold {
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            color: #1a1a2e;
            box-shadow: 0 8px 25px rgba(255,140,0,0.5);
            font-size: 20px;
            padding: 18px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 8px 25px rgba(255,140,0,0.5); }
            50% { box-shadow: 0 14px 40px rgba(255,140,0,0.8); }
        }

        .btn-glass {
            background: rgba(255,255,255,0.06);
            color: white;
            border: 1px solid rgba(255,215,0,0.2);
            font-size: 13px;
            padding: 11px;
        }

        .btn-row {
            display: flex;
            gap: 8px;
            width: 100%;
            max-width: 300px;
        }

        .btn-row .btn {
            flex: 1;
            min-width: 0;
            max-width: none;
            font-size: 12px;
            padding: 10px;
        }

        /* ============ GAME SCREEN ============ */
        .game-screen {
            background: #0a0a1a;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 10px;
            background: var(--panel);
            border-bottom: 1px solid rgba(255,215,0,0.15);
            flex-shrink: 0;
            gap: 8px;
        }

        .player-mini {
            display: flex;
            align-items: center;
            gap: 6px;
            color: white;
        }

        .avatar-dot {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            flex-shrink: 0;
        }

        .avatar-dot.gold {
            background: linear-gradient(135deg, #ffd700, #ff8c00);
        }

        .avatar-dot.silver {
            background: linear-gradient(135deg, #c0c0c0, #808080);
        }

        .player-name-sm {
            font-size: 10px;
            color: #aaa;
        }

        .timer {
            font-size: 20px;
            font-weight: 900;
            color: #ffd700;
            font-family: 'Courier New', monospace;
        }

        .timer.urgent {
            color: #ff3333;
            animation: blink 0.4s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }

        .board-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px;
            min-height: 0;
            position: relative;
        }

        canvas {
            border-radius: 8px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.6), 0 0 30px rgba(255,215,0,0.1);
            cursor: pointer;
            touch-action: manipulation;
        }

        .game-footer {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 10px;
            background: var(--panel);
            border-top: 1px solid rgba(255,215,0,0.15);
            flex-shrink: 0;
        }

        .energy-bar-wrap {
            flex: 1;
            height: 14px;
            background: rgba(255,255,255,0.06);
            border-radius: 7px;
            overflow: hidden;
            border: 1px solid rgba(255,215,0,0.2);
        }

        .energy-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff3333, #ffaa00, #ffd700, #44ff44);
            border-radius: 7px;
            transition: width 0.4s;
        }

        .energy-text {
            color: #ffd700;
            font-size: 10px;
            font-weight: 700;
            white-space: nowrap;
        }

        .btn-sm {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,215,0,0.2);
            color: #ffd700;
            padding: 7px 14px;
            border-radius: 18px;
            font-size: 11px;
            cursor: pointer;
            font-weight: 700;
        }

        /* ============ TRIVIA SCREEN ============ */
        .trivia-screen {
            background: linear-gradient(180deg, #0a0a2e, #1a1a4e);
            padding: 15px;
        }

        .trivia-header {
            text-align: center;
            margin-bottom: 15px;
        }

        .trivia-header h2 {
            color: #ffd700;
            font-size: 24px;
        }

        .trivia-tabs {
            display: flex;
            gap: 5px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .trivia-tab {
            padding: 8px 14px;
            border-radius: 20px;
            border: 1px solid rgba(255,215,0,0.2);
            background: rgba(255,255,255,0.04);
            color: #ccc;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .trivia-tab.active {
            background: rgba(255,215,0,0.2);
            color: #ffd700;
            border-color: #ffd700;
        }

        .fact-card {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,215,0,0.15);
            border-radius: 14px;
            padding: 15px;
            margin-bottom: 10px;
            transition: all 0.2s;
        }

        .fact-card.locked {
            opacity: 0.5;
            filter: grayscale(0.5);
        }

        .fact-category {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 10px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .cat-historia { background: #4a90d9; color: #fff; }
        .cat-matematicas { background: #9b59b6; color: #fff; }
        .cat-records { background: #e67e22; color: #fff; }
        .cat-biografias { background: #2ecc71; color: #fff; }
        .cat-estrategia { background: #e74c3c; color: #fff; }

        .fact-text {
            color: #ddd;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 8px;
        }

        .fact-source {
            color: #888;
            font-size: 11px;
            font-style: italic;
        }

        .quiz-btn {
            background: linear-gradient(135deg, #4a90d9, #357abd);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            margin-top: 8px;
            font-weight: 700;
        }

        /* Quiz modal */
        .quiz-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(10px);
            z-index: 200;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .quiz-overlay.active {
            display: flex;
        }

        .quiz-card {
            background: linear-gradient(135deg, #1a1a3e, #2a2a5e);
            border: 2px solid rgba(255,215,0,0.3);
            border-radius: 18px;
            padding: 20px;
            max-width: 400px;
            width: 100%;
            color: white;
        }

        .quiz-card h3 {
            color: #ffd700;
            font-size: 18px;
            margin-bottom: 15px;
            text-align: center;
        }

        .quiz-option {
            display: block;
            width: 100%;
            padding: 14px;
            margin-bottom: 8px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,215,0,0.2);
            border-radius: 12px;
            color: white;
            font-size: 14px;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s;
        }

        .quiz-option:active {
            background: rgba(255,215,0,0.2);
            border-color: #ffd700;
        }

        .quiz-option.correct {
            background: rgba(46,204,113,0.3) !important;
            border-color: #2ecc71 !important;
        }

        .quiz-option.incorrect {
            background: rgba(231,76,60,0.3) !important;
            border-color: #e74c3c !important;
        }

        .quiz-result {
            text-align: center;
            padding: 15px;
            font-size: 16px;
            font-weight: 700;
        }

        .quiz-result.correct {
            color: #2ecc71;
        }

        .quiz-result.incorrect {
            color: #e74c3c;
        }

        /* Notifications */
        .notification-toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #1a1a3e, #2a2a5e);
            border: 1px solid #ffd700;
            border-radius: 12px;
            padding: 12px 20px;
            color: white;
            z-index: 300;
            font-size: 13px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            animation: slideDown 0.4s ease-out;
            max-width: 350px;
            text-align: center;
        }

        @keyframes slideDown {
            from { transform: translate(-50%, -100px); opacity: 0; }
            to { transform: translate(-50%, 0); opacity: 1; }
        }

        /* Landscape */
        @media (orientation: landscape) {
            .game-screen {
                flex-direction: row;
                align-items: stretch;
            }
            .game-header {
                flex-direction: column;
                justify-content: center;
                gap: 12px;
                border-bottom: none;
                border-right: 1px solid rgba(255,215,0,0.15);
                min-width: 100px;
                padding: 8px;
            }
            .board-wrapper {
                flex: 1;
            }
            .game-footer {
                flex-direction: column;
                justify-content: center;
                gap: 10px;
                border-top: none;
                border-left: 1px solid rgba(255,215,0,0.15);
                min-width: 100px;
                padding: 8px;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- ============ HOME SCREEN ============ -->
        <div class="screen active" id="homeScreen">
            <div class="home-screen">
                <div class="crown-icon">👑</div>
                <h1 class="title">ROYAL CHESS</h1>
                <p class="subtitle">Arena & Trivia</p>

                <div class="stats-row">
                    <div class="stat-card">
                        <div class="val" id="hLevel">1</div>
                        <div class="lbl">Nivel</div>
                    </div>
                    <div class="stat-card">
                        <div class="val" id="hXp">0</div>
                        <div class="lbl">XP</div>
                    </div>
                    <div class="stat-card">
                        <div class="val">💰 <span id="hCoins">500</span></div>
                        <div class="lbl">Monedas</div>
                    </div>
                </div>

                <button class="btn btn-gold" onclick="startGame('ai')">⚔️ JUGAR</button>

                <div class="btn-row">
                    <button class="btn btn-glass" onclick="startGame('local')">👥 2P</button>
                    <button class="btn btn-glass" onclick="showTrivia()">📚 TRIVIA</button>
                </div>
                <div class="btn-row">
                    <button class="btn btn-glass" onclick="showComingSoon()">🚀 PRÓX</button>
                </div>
            </div>
        </div>

        <!-- ============ GAME SCREEN ============ -->
        <div class="screen" id="gameScreen">
            <div class="game-screen">
                <div class="game-header">
                    <div class="player-mini">
                        <div class="avatar-dot silver" id="topAv">🤖</div>
                        <div>
                            <div class="player-name-sm" id="topNm">IA</div>
                            <div class="timer" id="topTm">10:00</div>
                        </div>
                    </div>
                    <div class="player-mini">
                        <div class="avatar-dot gold">👤</div>
                        <div>
                            <div class="player-name-sm">TÚ</div>
                            <div class="timer" id="btmTm">10:00</div>
                        </div>
                    </div>
                </div>

                <div class="board-wrapper" id="boardWrap">
                    <canvas id="chessCanvas"></canvas>
                </div>

                <div class="game-footer">
                    <span class="energy-text">⚡</span>
                    <div class="energy-bar-wrap">
                        <div class="energy-bar-fill" id="enBar" style="width:100%"></div>
                    </div>
                    <span class="energy-text" id="enVal">100%</span>
                    <button class="btn-sm" onclick="backHome()">🏠</button>
                </div>
            </div>
        </div>

        <!-- ============ TRIVIA SCREEN ============ -->
        <div class="screen" id="triviaScreen">
            <div class="trivia-screen">
                <div class="trivia-header">
                    <h2>📚 Datos Curiosos</h2>
                    <p style="color:#aaa;font-size:12px;">Desbloquea conocimiento mientras subes de nivel</p>
                    <button class="btn-sm" onclick="backHome()" style="margin-top:8px;">🏠 VOLVER</button>
                </div>

                <div class="trivia-tabs" id="triviaTabs">
                    <div class="trivia-tab active" onclick="filterTrivia('all')">Todos</div>
                </div>

                <div id="triviaContent"></div>
            </div>
        </div>
    </div>

    <!-- Quiz Modal -->
    <div class="quiz-overlay" id="quizOverlay">
        <div class="quiz-card" id="quizCard"></div>
    </div>

    <!-- Notifications container -->
    <div id="notifContainer"></div>

    <script>
        // =============================================
        // DATABASE LAYER (IndexedDB/Storage)
        // =============================================
        const DB = {
            // Users
            getUser() {
                const d = localStorage.getItem('rc_user');
                return d ? JSON.parse(d) : {
                    id: 1,
                    username: 'Jugador' + Math.floor(Math.random() * 1000),
                    elo_rating: 800,
                    current_level: 1,
                    experience_points: 0,
                    balance_coins: 500,
                    total_games_played: 0,
                    total_wins: 0,
                    total_losses: 0,
                    best_streak: 0,
                    current_streak: 0,
                    trivia_questions_answered: 0,
                    trivia_correct_answers: 0
                };
            },

            saveUser(user) {
                localStorage.setItem('rc_user', JSON.stringify(user));
            },

            // Trivia Facts (semilla inicial)
            getFacts() {
                const d = localStorage.getItem('rc_facts');
                if (d) return JSON.parse(d);
                // Semilla inicial
                const seed = [
                    {
                        id: 1,
                        category: 'biografias',
                        fact_text: 'Garry Kasparov fue el campeón mundial de ajedrez más joven de la historia, obteniendo el título en 1985 a los 22 años. Mantuvo el campeonato durante 15 años consecutivos hasta el año 2000.',
                        fact_source: 'FIDE - World Chess Federation',
                        unlock_level_required: 1,
                        is_unlocked: 1,
                        times_viewed: 0
                    },
                    {
                        id: 2,
                        category: 'matematicas',
                        fact_text: 'El Número de Shannon (10^120) representa la cantidad estimada de partidas de ajedrez posibles. Es mayor que el número de átomos en el universo observable (aproximadamente 10^80). Calculado por Claude Shannon en 1950.',
                        fact_source: 'Shannon, C. (1950) - Programming a Computer for Playing Chess',
                        unlock_level_required: 2,
                        is_unlocked: 0,
                        times_viewed: 0
                    },
                    {
                        id: 3,
                        category: 'historia',
                        fact_text: 'La frase "Jaque Mate" proviene del persa "Shah Mat" que significa "el rey está indefenso". El ajedrez se originó en la India alrededor del siglo VI d.C. con el nombre de "Chaturanga".',
                        fact_source: 'Murray, H.J.R. (1913) - A History of Chess',
                        unlock_level_required: 1,
                        is_unlocked: 1,
                        times_viewed: 0
                    },
                    {
                        id: 4,
                        category: 'records',
                        fact_text: 'La partida más larga de ajedrez registrada duró 269 movimientos y terminó en tablas. Fue jugada entre Ivan Nikolic y Goran Arsovic en Belgrado, 1989.',
                        fact_source: 'Guinness World Records',
                        unlock_level_required: 3,
                        is_unlocked: 0,
                        times_viewed: 0
                    },
                    {
                        id: 5,
                        category: 'estrategia',
                        fact_text: 'El "Mate del Pastor" es el jaque mate más rápido posible en ajedrez, ocurriendo en solo 4 movimientos: 1.e4 e5 2.Ac4 Cc6 3.Dh5 Cf6 4.Dxf7#',
                        fact_source: 'Manual de Ajedrez - Estrategias Básicas',
                        unlock_level_required: 1,
                        is_unlocked: 1,
                        times_viewed: 0
                    }
                ];
                localStorage.setItem('rc_facts', JSON.stringify(seed));
                return seed;
            },

            saveFacts(facts) {
                localStorage.setItem('rc_facts', JSON.stringify(facts));
            },

            // Quiz Questions
            getQuestions() {
                const d = localStorage.getItem('rc_questions');
                if (d) return JSON.parse(d);
                const seed = [
                    {
                        id: 1,
                        category: 'biografias',
                        question_text: '¿A qué edad se convirtió Garry Kasparov en el campeón mundial de ajedrez más joven?',
                        option_a: '18 años',
                        option_b: '22 años',
                        option_c: '25 años',
                        option_d: '30 años',
                        correct_option: 'B',
                        reward_coins: 50,
                        difficulty_level: 2,
                        related_fact_id: 1,
                        times_answered: 0,
                        times_correct: 0
                    },
                    {
                        id: 2,
                        category: 'matematicas',
                        question_text: '¿Cuál es el Número de Shannon?',
                        option_a: '10 elevado a 80',
                        option_b: '10 elevado a 100',
                        option_c: '10 elevado a 120',
                        option_d: '10 elevado a 150',
                        correct_option: 'C',
                        reward_coins: 75,
                        difficulty_level: 4,
                        related_fact_id: 2,
                        times_answered: 0,
                        times_correct: 0
                    },
                    {
                        id: 3,
                        category: 'historia',
                        question_text: '¿De qué idioma proviene la frase "Jaque Mate"?',
                        option_a: 'Latín',
                        option_b: 'Árabe',
                        option_c: 'Persa',
                        option_d: 'Sánscrito',
                        correct_option: 'C',
                        reward_coins: 25,
                        difficulty_level: 1,
                        related_fact_id: 3,
                        times_answered: 0,
                        times_correct: 0
                    }
                ];
                localStorage.setItem('rc_questions', JSON.stringify(seed));
                return seed;
            },

            getQuestionById(id) {
                return this.getQuestions().find(q => q.id === id);
            },

            // User Trivia Progress
            getProgress() {
                const d = localStorage.getItem('rc_trivia_progress');
                return d ? JSON.parse(d) : [];
            },

            saveProgress(progress) {
                localStorage.setItem('rc_trivia_progress', JSON.stringify(progress));
            },

            isQuestionAnswered(questionId) {
                return this.getProgress().find(p => p.question_id === questionId && p.is_answered);
            },

            // Notifications
            getNotifications() {
                const d = localStorage.getItem('rc_notifications');
                return d ? JSON.parse(d) : [];
            },

            addNotification(notif) {
                const notifs = this.getNotifications();
                notifs.unshift({
                    id: Date.now(),
                    ...notif,
                    is_read: 0,
                    created_at: new Date().toISOString()
                });
                // Keep only last 20
                localStorage.setItem('rc_notifications', JSON.stringify(notifs.slice(0, 20)));
                return notifs[0];
            }
        };

        // =============================================
        // CORE FUNCTIONS (check_level_up, unlock_new_content, verify_quiz_answer)
        // =============================================
        function checkLevelUp(user) {
            const newLevel = Math.floor(Math.sqrt(user.experience_points / 100)) + 1;
            
            if (newLevel <= user.current_level) {
                return { leveledUp: false, currentLevel: user.current_level };
            }
            
            const oldLevel = user.current_level;
            user.current_level = newLevel;
            DB.saveUser(user);
            
            const unlocked = unlockNewContent(user, newLevel);
            
            showToast(`⬆️ ¡Nivel ${newLevel}! ${unlocked.count} curiosidades desbloqueadas.`);
            
            return { leveledUp: true, currentLevel: newLevel, previousLevel: oldLevel, unlockedItems: unlocked };
        }

        function unlockNewContent(user, newLevel) {
            const facts = DB.getFacts();
            const unlockedFacts = [];
            
            facts.forEach(fact => {
                if (fact.unlock_level_required <= newLevel && !fact.is_unlocked) {
                    fact.is_unlocked = 1;
                    unlockedFacts.push(fact);
                }
            });
            
            if (unlockedFacts.length > 0) {
                DB.saveFacts(facts);
                DB.addNotification({
                    title: '📚 Nuevo Contenido',
                    message: `${unlockedFacts.length} curiosidades desbloqueadas al subir al nivel ${newLevel}.`,
                    type: 'new_content'
                });
            }
            
            return { count: unlockedFacts.length, facts: unlockedFacts };
        }

        function verifyQuizAnswer(questionId, selectedOption) {
            const question = DB.getQuestionById(questionId);
            if (!question) return { error: 'Pregunta no encontrada' };
            
            const alreadyAnswered = DB.isQuestionAnswered(questionId);
            if (alreadyAnswered) {
                return { error: 'Ya respondiste esta pregunta', wasCorrect: alreadyAnswered.is_correct };
            }
            
            const isCorrect = (selectedOption === question.correct_option);
            const user = DB.getUser();
            let rewardCoins = 0;
            
            if (isCorrect) {
                const bonusMultiplier = user.current_streak >= 5 ? 2 : user.current_streak >= 3 ? 1.5 : 1;
                rewardCoins = Math.floor(question.reward_coins * bonusMultiplier);
                user.balance_coins += rewardCoins;
                user.trivia_correct_answers++;
                user.experience_points += 10;
            }
            
            user.trivia_questions_answered++;
            
            const progress = DB.getProgress();
            progress.push({
                user_id: user.id,
                question_id: questionId,
                is_viewed: 1,
                is_answered: 1,
                is_correct: isCorrect ? 1 : 0,
                answered_at: new Date().toISOString()
            });
            
            DB.saveUser(user);
            DB.saveProgress(progress);
            
            // Update question stats
            const questions = DB.getQuestions();
            const qIdx = questions.findIndex(q => q.id === questionId);
            if (qIdx >= 0) {
                questions[qIdx].times_answered++;
                if (isCorrect) questions[qIdx].times_correct++;
                localStorage.setItem('rc_questions', JSON.stringify(questions));
            }
            
            checkLevelUp(user);
            
            return {
                isCorrect,
                correctAnswer: question.correct_option,
                rewardCoins,
                wasCorrect: isCorrect
            };
        }

            // Update active tab
            document.querySelectorAll('.trivia-tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            
            const facts = DB.getFacts();
            const user = DB.getUser();
            const filtered = category === 'all' ? facts : facts.filter(f => f.category === category);
            
            const content = document.getElementById('triviaContent');
            content.innerHTML = filtered.map(fact => {
                const locked = fact.unlock_level_required > user.current_level;
                const categoryClass = `cat-${fact.category}`;
                const categoryLabel = fact.category.charAt(0).toUpperCase() + fact.category.slice(1);
                
                if (locked) {
                    return `
                        <div class="fact-card locked">
                            <span class="fact-category cat-historia">🔒 Nivel ${fact.unlock_level_required}</span>
                            <p class="fact-text" style="color:#888;">Desbloquea este dato curioso al alcanzar el nivel ${fact.unlock_level_required}.</p>
                        </div>`;
                }
                
                const relatedQuestion = DB.getQuestions().find(q => q.related_fact_id === fact.id);
                const answered = relatedQuestion ? DB.isQuestionAnswered(relatedQuestion.id) : null;
                
                return `
                    <div class="fact-card">
                        <span class="fact-category ${categoryClass}">${categoryLabel}</span>
                        <p class="fact-text">${fact.fact_text}</p>
                        <p class="fact-source">📖 ${fact.fact_source}</p>
                        ${relatedQuestion && !answered ? 
                            `<button class="quiz-btn" onclick="openQuiz(${relatedQuestion.id})">🎯 Responder Quiz (+${relatedQuestion.reward_coins} 💰)</button>` :
                            answered ? 
                            `<p style="color:#2ecc71;font-size:12px;margin-top:5px;">✅ Ya respondiste esta trivia ${answered.is_correct ? 'correctamente' : ''}</p>` :
                            ''}

        function submitAnswer(questionId, option, buttonElement) {
            // Disable all buttons
            document.querySelectorAll('.quiz-option').forEach(b => b.disabled = true);
            
            const result = verifyQuizAnswer(questionId, option);

                feedback.innerHTML = `<div class="quiz-result incorrect">❌ Incorrecto. La respuesta era ${result.correctAnswer}</div>`;

                closeQuiz();

        // =============================================
        // CHESS ENGINE (Versión estable)
        // =============================================
        const chess = {
            board: [],
            init() {
                this.board = [
                    ['r','n','b','q','k','b','n','r'],
                    ['p','p','p','p','p','p','p','p'],
                    ['','','','','','','',''],
                    ['','','','','','','',''],
                    ['','','','','','','',''],
                    ['','','','','','','',''],
                    ['P','P','P','P','P','P','P','P'],
                    ['R','N','B','Q','K','B','N','R']
                ];
            },
            piece(r,c) { return this.board[r]?.[c] || ''; },
            isValid(fr,fc,tr,tc) {
                const p = this.piece(fr,fc);
                if (!p) return false;
                const tgt = this.piece(tr,tc);
                if (tgt && ((p===p.toUpperCase()&&tgt===tgt.toUpperCase())||(p===p.toLowerCase()&&tgt===tgt.toLowerCase()))) return false;
                const type = p.toLowerCase();
                const rd=tr-fr, cd=tc-fc, ard=Math.abs(rd), acd=Math.abs(cd);
                const clear = (dr,dc) => {
                    const st = Math.max(Math.abs(dr),Math.abs(dc));
                    const sr=dr===0?0:dr/Math.abs(dr), sc=dc===0?0:dc/Math.abs(dc);
                    for(let i=1;i<st;i++) if(this.piece(fr+sr*i,fc+sc*i)) return false;
                    return true;
                };
                switch(type) {
                    case 'p': const dir=p==='P'?-1:1, sRow=p==='P'?6:1;
                        if(cd===0&&!tgt){if(rd===dir)return true;if(fr===sRow&&rd===2*dir&&!this.piece(fr+dir,fc))return true;}
                        return acd===1&&rd===dir&&!!tgt;
                    case 'r': return (rd===0||cd===0)&&clear(rd,cd);
                    case 'n': return (ard===2&&acd===1)||(ard===1&&acd===2);
                    case 'b': return ard===acd&&clear(rd,cd);
                    case 'q': return (rd===0||cd===0||ard===acd)&&clear(rd,cd);
                    case 'k': return ard<=1&&acd<=1;
                }
                return false;
            },
            move(fr,fc,tr,tc) {
                const p=this.piece(fr,fc), c=this.piece(tr,tc);
                this.board[tr][tc]=p; this.board[fr][fc]='';
                return {piece:p, captured:c};
            },
            findKing(c) {
                const k=c==='w'?'K':'k';
                for(let r=0;r<8;r++)for(let col=0;col<8;col++)if(this.board[r][col]===k)return{row:r,col};
                return null;
            },
            inCheck(c) {
                const k=this.findKing(c); if(!k)return false;
                for(let r=0;r<8;r++)for(let col=0;col<8;col++){
                    const p=this.board[r][col];
                    if(p&&((c==='w'&&p===p.toLowerCase())||(c==='b'&&p===p.toUpperCase())))
                        if(this.isValid(r,col,k.row,k.col))return true;
                }
                return false;
            },
            hasMoves(c) {
                for(let r=0;r<8;r++)for(let col=0;col<8;col++){
                    const p=this.board[r][col];
                    const white=p&&p===p.toUpperCase();
                    if((c==='w'&&white)||(c==='b'&&!white&&p)){
                        for(let tr=0;tr<8;tr++)for(let tc=0;tc<8;tc++){
                            if(this.isValid(r,col,tr,tc)){
                                const sv=this.board[tr][tc];
                                this.board[tr][tc]=p;this.board[r][col]='';
                                const ch=this.inCheck(c);
                                this.board[r][col]=p;this.board[tr][tc]=sv;
                                if(!ch)return true;
                            }
                        }
                    }
                }
                return false;
            },
            aiMove() {
                const moves=[];
                for(let r=0;r<8;r++)for(let c=0;c<8;c++){
                    const p=this.board[r][c];
                    if(p&&p===p.toLowerCase()){
                        for(let tr=0;tr<8;tr++)for(let tc=0;tc<8;tc++){
                            if(this.isValid(r,c,tr,tc)){
                                const sv=this.board[tr][tc];
                                this.board[tr][tc]=p;this.board[r][c]='';
                                if(!this.inCheck('b')){
                                    let sc=sv?(sv.toUpperCase()==='Q'?9:sv.toUpperCase()==='R'?5:'BN'.includes(sv.toUpperCase())?3:1):0;
                                    moves.push({fr:r,fc:c,tr,tc,piece:p,captured:sv,score:sc});
                                }
                                this.board[r][c]=p;this.board[tr][tc]=sv;
                            }
                        }
                    }
                }
                if(!moves.length)return null;
                moves.sort((a,b)=>b.score-a.score);
                return Math.random()<0.7?moves[0]:moves[Math.floor(Math.random()*Math.min(5,moves.length))];
            }
        };

        // =============================================
        // GAME STATE
        // =============================================
        let gs = {
            mode: 'ai',
            selected: null,
            t1: 600, t2: 600,
            over: false,
            turn: 'w',
            combo: 0,
            energy: 100,
            timer: null
        };

        // =============================================
        // CANVAS (Versión estable que funcionaba bien)
        // =============================================
        const canvas = document.getElementById('chessCanvas');
        const ctx = canvas.getContext('2d');
        let bSize = 0, sq = 0;

        function resizeCanvas() {
            const wrap = document.getElementById('boardWrap');
            const s = Math.floor(Math.min(wrap.clientWidth, wrap.clientHeight) * 0.95);
            bSize = s; sq = s / 8;
            canvas.width = bSize; canvas.height = bSize;
            canvas.style.width = bSize+'px'; canvas.style.height = bSize+'px';
            draw();
        }

        const SYMBOLS = {K:'♔',Q:'♕',R:'♖',B:'♗',N:'♘',P:'♙',k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟'};

        function draw() {
            ctx.clearRect(0,0,bSize,bSize);
            for(let r=0;r<8;r++){
                for(let c=0;c<8;c++){
                    const x=c*sq, y=r*sq;
                    const light = (r+c)%2===0;
                    const grad = ctx.createLinearGradient(x,y,x+sq,y+sq);
                    if(light){ grad.addColorStop(0,'#f5deb3'); grad.addColorStop(0.5,'#eed9b0'); grad.addColorStop(1,'#d2b48c'); }
                    else{ grad.addColorStop(0,'#8b6914'); grad.addColorStop(0.5,'#7a5a12'); grad.addColorStop(1,'#5c3d0e'); }
                    ctx.fillStyle=grad;
                    ctx.fillRect(x,y,sq,sq);
                }
            }
            ctx.strokeStyle='rgba(0,0,0,0.3)'; ctx.lineWidth=1;
            for(let i=0;i<=8;i++){
                ctx.beginPath();ctx.moveTo(i*sq,0);ctx.lineTo(i*sq,bSize);ctx.stroke();
                ctx.beginPath();ctx.moveTo(0,i*sq);ctx.lineTo(bSize,i*sq);ctx.stroke();
            }
            if(gs.selected){
                const {row,col}=gs.selected;
                ctx.fillStyle='rgba(255,215,0,0.5)';
                ctx.fillRect(col*sq,row*sq,sq,sq);
                ctx.strokeStyle='#ffd700';ctx.lineWidth=Math.max(2,sq*0.04);
                ctx.strokeRect(col*sq+2,row*sq+2,sq-4,sq-4);
            }
            const pRad=sq*0.4;
            for(let r=0;r<8;r++){
                for(let c=0;c<8;c++){
                    const piece=chess.piece(r,c);
                    if(!piece)continue;
                    const cx=c*sq+sq/2, cy=r*sq+sq/2;
                    const white=piece===piece.toUpperCase();
                    ctx.shadowColor='rgba(0,0,0,0.6)';ctx.shadowBlur=sq*0.1;
                    ctx.shadowOffsetX=sq*0.03;ctx.shadowOffsetY=sq*0.04;
                    ctx.beginPath();ctx.arc(cx,cy,pRad,0,Math.PI*2);
                    const grad=ctx.createRadialGradient(cx-pRad*0.3,cy-pRad*0.3,pRad*0.05,cx,cy,pRad);
                    if(white){ grad.addColorStop(0,'#fff');grad.addColorStop(0.5,'#f0f0f0');grad.addColorStop(0.8,'#d4d4d4');grad.addColorStop(1,'#a0a0a0'); }
                    else{ grad.addColorStop(0,'#606060');grad.addColorStop(0.5,'#2a2a2a');grad.addColorStop(0.8,'#1a1a1a');grad.addColorStop(1,'#000'); }
                    ctx.fillStyle=grad;ctx.fill();
                    ctx.shadowColor='transparent';ctx.shadowBlur=0;ctx.shadowOffsetX=0;ctx.shadowOffsetY=0;
                    ctx.strokeStyle=white?'#888':'#333';ctx.lineWidth=Math.max(1,sq*0.02);ctx.stroke();
                    const fSize=sq*0.72;
                    ctx.fillStyle=white?'#1a1a1a':'#fff';
                    ctx.font=`bold ${fSize}px "Segoe UI Symbol",Arial`;
                    ctx.textAlign='center';ctx.textBaseline='middle';
                    ctx.fillText(SYMBOLS[piece],cx,cy+sq*0.03);
                }
            }
        }

        function startGame(mode) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('gameScreen').classList.add('active');
            chess.init();
            gs = { mode, selected:null, t1:600, t2:600, over:false, turn:'w', combo:0, energy:100, timer:null };
            document.getElementById('topNm').textContent = mode==='ai'?'IA':'Jugador 2';
            document.getElementById('topAv').textContent = mode==='ai'?'🤖':'👤';
            updateTimers(); updateEnergy();
            setTimeout(resizeCanvas,50); setTimeout(resizeCanvas,200);
            gs.timer = setInterval(()=>{
                if(gs.over)return;
                if(gs.turn==='w'){gs.t1--; if(gs.t1<=0)endGame('time','b');}
                else{gs.t2--; if(gs.t2<=0)endGame('time','w');}
                updateTimers();
            },1000);
        }

        function backHome() {
            if(gs.timer)clearInterval(gs.timer);
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('homeScreen').classList.add('active');
            updateHomeStats();
        }

        function updateTimers() {
            const f=s=>`${Math.floor(s/60)}:${(s%60).toString().padStart(2,'0')}`;
            document.getElementById('topTm').textContent=f(gs.t2);
            document.getElementById('btmTm').textContent=f(gs.t1);
            document.getElementById('topTm').className='timer'+(gs.t2<60?' urgent':'');
            document.getElementById('btmTm').className='timer'+(gs.t1<60?' urgent':'');
        }

        function updateEnergy() {
            document.getElementById('enBar').style.width=gs.energy+'%';
            document.getElementById('enVal').textContent=gs.energy+'%';
        }

        function updateHomeStats() {
            const u = DB.getUser();
            document.getElementById('hLevel').textContent = u.current_level;
            document.getElementById('hXp').textContent = u.experience_points;
            document.getElementById('hCoins').textContent = u.balance_coins;
        }

        function doMove(fr,fc,tr,tc) {
            const res = chess.move(fr,fc,tr,tc);
            gs.energy = Math.max(0, gs.energy-2);
            updateEnergy();
            const user = DB.getUser();
            if(res.captured) {
                gs.combo++;
                const bonus = gs.combo*5;
                user.experience_points += 10+bonus;
                user.balance_coins += bonus;
            } else {
                gs.combo=0;
                user.experience_points += 2;
            }
            DB.saveUser(user);
            checkLevelUp(user);
            const opp = gs.turn==='w'?'b':'w';
            if(chess.inCheck(opp)) {
                if(!chess.hasMoves(opp)) { endGame('checkmate', gs.turn); return; }
            } else if(!chess.hasMoves(opp)) { endGame('stalemate', null); return; }
        }

        function endGame(reason, winner) {
            gs.over=true; clearInterval(gs.timer);
            const user = DB.getUser();
            let reward=0, msg='';
            if(reason==='checkmate') {
                reward=100;
                if(winner==='w'){ user.total_wins++; user.current_streak++; msg='🏆 ¡Jaque Mate! Ganaste'; }
                else{ user.total_losses++; user.current_streak=0; msg='💀 Jaque Mate. Perdiste'; }
                if(user.current_streak>user.best_streak) user.best_streak=user.current_streak;
            } else if(reason==='time') {
                reward=50;
                if(winner==='w'){ user.total_wins++; msg='⏰ ¡Ganaste por tiempo!'; }
                else{ user.total_losses++; msg='⏰ ¡Se acabó el tiempo!'; }
            } else { reward=25; msg='🤝 ¡Tablas!'; }
            user.total_games_played++;
            user.balance_coins+=reward;
            user.experience_points+=reward;
            DB.saveUser(user);
            checkLevelUp(user);
            showToast(msg+' +'+reward+'💰');
            setTimeout(backHome, 2000);
        }

        function clickSquare(row,col) {
            if(gs.over||(gs.mode==='ai'&&gs.turn!=='w'))return;
            if(gs.selected){
                const {row:fr, col:fc}=gs.selected;
                const p=chess.piece(fr,fc);
                if(fr===row&&fc===col){gs.selected=null;}
                else if(chess.isValid(fr,fc,row,col)){
                    const sv=chess.board[row][col];
                    chess.board[row][col]=p;chess.board[fr][fc]='';
                    const ch=chess.inCheck(gs.turn);
                    chess.board[fr][fc]=p;chess.board[row][col]=sv;
                    if(!ch){
                        doMove(fr,fc,row,col);
                        gs.selected=null;
                        gs.turn=gs.turn==='w'?'b':'w';
                        draw();
                        if(gs.mode==='ai'&&gs.turn==='b'&&!gs.over){
                            setTimeout(()=>{
                                const aim=chess.aiMove();
                                if(aim){doMove(aim.fr,aim.fc,aim.tr,aim.tc);gs.turn='w';gs.energy=Math.min(100,gs.energy+5);updateEnergy();}
                                draw();
                            },300+Math.random()*600);
                        }
                    }else gs.selected=null;
                }else gs.selected=null;
            }else{
                const p=chess.piece(row,col);
                if(p&&gs.mode==='ai'&&p===p.toUpperCase())gs.selected={row,col};
                else if(p&&gs.mode==='local'&&((gs.turn==='w'&&p===p.toUpperCase())||(gs.turn==='b'&&p===p.toLowerCase())))gs.selected={row,col};
            }
            draw();
        }

        canvas.addEventListener('click',e=>{
            const r=canvas.getBoundingClientRect();
            const col=Math.floor((e.clientX-r.left)*(bSize/r.width)/sq);
            const row=Math.floor((e.clientY-r.top)*(bSize/r.height)/sq);
            if(row>=0&&row<8&&col>=0&&col<8)clickSquare(row,col);
        });
        canvas.addEventListener('touchstart',e=>{
            e.preventDefault();
            const t=e.touches[0], r=canvas.getBoundingClientRect();
            const col=Math.floor((t.clientX-r.left)*(bSize/r.width)/sq);
            const row=Math.floor((t.clientY-r.top)*(bSize/r.height)/sq);
            if(row>=0&&row<8&&col>=0&&col<8)clickSquare(row,col);
        },{passive:false});

        function showComingSoon() {
            showToast('🚀 Próximamente: Torneos, Multijugador Online y más!', 3000);
        }

        window.addEventListener('resize', ()=>{
            if(document.getElementById('gameScreen').classList.contains('active')) setTimeout(resizeCanvas,100);
        });
        window.addEventListener('orientationchange', ()=>{
            setTimeout(resizeCanvas,200); setTimeout(resizeCanvas,500);
        });

        updateHomeStats();
    </script>
</body>
</html>
