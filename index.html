<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>♔ Royal Chess Arena - Play & Earn</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #0a0a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .app-container {
            position: relative;
            z-index: 1;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background: #0a0a2e;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        @media (orientation: landscape) {
            .app-container {
                flex-direction: row;
            }
        }

        .screen {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
            animation: fadeIn 0.4s ease-out;
        }

        .screen.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        /* HOME SCREEN */
        .home-screen {
            align-items: center;
            justify-content: center;
            gap: 15px;
            padding: 15px;
            background: linear-gradient(180deg, #0a0a2e 0%, #1a1a4e 50%, #0a0a2e 100%);
            overflow-y: auto;
        }

        .logo-container {
            text-align: center;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .crown-icon {
            font-size: 60px;
            filter: drop-shadow(0 0 25px rgba(255, 215, 0, 0.6));
        }

        .title {
            font-size: 30px;
            font-weight: 900;
            background: linear-gradient(45deg, #ffd700, #ffed4a, #daa520);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
        }

        .subtitle {
            color: #c0c0c0;
            font-size: 12px;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-top: 5px;
        }

        .btn {
            padding: 14px 35px;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
            position: relative;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn-play {
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            color: #1a1a2e;
            box-shadow: 0 8px 25px rgba(255, 140, 0, 0.5);
            font-size: 22px;
            padding: 18px 50px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 8px 25px rgba(255, 140, 0, 0.5); }
            50% { box-shadow: 0 12px 40px rgba(255, 140, 0, 0.8); }
            100% { box-shadow: 0 8px 25px rgba(255, 140, 0, 0.5); }
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            color: white;
            border: 1px solid rgba(255, 215, 0, 0.25);
            font-size: 13px;
            padding: 10px 20px;
        }

        .btn-secondary:active {
            background: rgba(255, 215, 0, 0.2);
        }

        .btn-music {
            position: fixed;
            bottom: 15px;
            right: 15px;
            z-index: 300;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(0,0,0,0.7);
            border: 2px solid rgba(255,215,0,0.4);
            color: #ffd700;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
        }

        .stats-container {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 215, 0, 0.15);
            border-radius: 12px;
            padding: 10px 18px;
            text-align: center;
            min-width: 80px;
        }

        .stat-value {
            color: #ffd700;
            font-size: 24px;
            font-weight: 900;
        }

        .stat-label {
            color: #888;
            font-size: 10px;
            text-transform: uppercase;
        }

        /* GAME SCREEN */
        .game-screen {
            display: flex;
            flex-direction: column;
            height: 100%;
            background: #0a0a1a;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 10px;
            background: rgba(10, 10, 30, 0.95);
            border-bottom: 1px solid rgba(255, 215, 0, 0.2);
            flex-shrink: 0;
            z-index: 10;
        }

        .player-info {
            display: flex;
            align-items: center;
            gap: 8px;
            color: white;
        }

        .player-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
        }

        .player-avatar.silver {
            background: linear-gradient(135deg, #c0c0c0, #808080);
        }

        .player-name {
            font-size: 11px;
            color: #aaa;
            white-space: nowrap;
        }

        .timer-display {
            font-size: 22px;
            font-weight: 900;
            color: #ffd700;
            font-family: 'Courier New', monospace;
            letter-spacing: 1px;
        }

        .timer-display.urgent {
            color: #ff3333;
            animation: blink 0.5s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }

        /* TABLERO */
        .board-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 5px;
            min-height: 0;
            position: relative;
        }

        canvas {
            border-radius: 8px;
            box-shadow: 0 0 60px rgba(255, 215, 0, 0.15), 0 5px 30px rgba(0, 0, 0, 0.8);
            cursor: pointer;
            touch-action: manipulation;
            max-width: 100%;
            max-height: 100%;
        }

        .game-footer {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 10px;
            background: rgba(10, 10, 30, 0.95);
            border-top: 1px solid rgba(255, 215, 0, 0.2);
            flex-shrink: 0;
            flex-wrap: wrap;
        }

        .energy-bar-container {
            flex: 1;
            min-width: 100px;
            height: 16px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid rgba(255, 215, 0, 0.2);
        }

        .energy-bar {
            height: 100%;
            background: linear-gradient(90deg, #ff3333, #ffaa00, #ffd700, #44ff44);
            border-radius: 8px;
            transition: width 0.4s ease;
            box-shadow: inset 0 0 10px rgba(255, 255, 255, 0.3);
        }

        .energy-label {
            color: #ffd700;
            font-size: 11px;
            font-weight: 700;
            white-space: nowrap;
        }

        .btn-back {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 215, 0, 0.2);
            color: #ffd700;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            white-space: nowrap;
            font-weight: 700;
        }

        .btn-back:active {
            background: rgba(255, 215, 0, 0.2);
        }

        /* Combo */
        .combo-display {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 42px;
            font-weight: 900;
            color: #ffd700;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.9);
            pointer-events: none;
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 100;
        }
        .combo-display.active {
            opacity: 1;
            animation: comboPop 0.6s ease-out;
        }
        @keyframes comboPop {
            0% { transform: translate(-50%, -50%) scale(0.3); opacity: 0; }
            40% { transform: translate(-50%, -50%) scale(1.3); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
        }

        /* Multijugador */
        .multiplayer-setup {
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
            margin: 10px 0;
        }
        .multiplayer-setup input {
            padding: 10px;
            border-radius: 20px;
            border: 1px solid rgba(255,215,0,0.3);
            background: rgba(255,255,255,0.1);
            color: white;
            text-align: center;
            font-size: 14px;
            width: 200px;
        }
        .room-link {
            color: #ffd700;
            word-break: break-all;
            font-size: 12px;
            background: rgba(0,0,0,0.5);
            padding: 8px;
            border-radius: 10px;
            margin: 5px 0;
        }

        /* Resto de pantallas (Trivia, Ranking, etc.) se mantienen igual que antes */
        /* ... (las omito por brevedad, están en el código completo anterior) ... */
    </style>
</head>
<body>
    <button class="btn-music" id="musicBtn" onclick="toggleMusic()">🎵</button>
    <div id="toastContainer"></div>

    <div class="app-container">
        <!-- HOME SCREEN -->
        <div class="screen active" id="homeScreen">
            <div class="home-screen">
                <div class="logo-container">
                    <div class="crown-icon">👑</div>
                    <h1 class="title">ROYAL CHESS</h1>
                    <p class="subtitle">Play & Earn Arena</p>
                </div>

                <div class="stats-container">
                    <div class="stat-card"><div class="stat-value" id="level">1</div><div class="stat-label">Nivel</div></div>
                    <div class="stat-card"><div class="stat-value" id="totalXp">0</div><div class="stat-label">XP</div></div>
                    <div class="stat-card"><div class="stat-value" id="coins">💰 500</div><div class="stat-label">Monedas</div></div>
                </div>

                <!-- Botones secundarios primero -->
                <div style="display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;">
                    <button class="btn btn-secondary" onclick="startGame('local')">👥 2 LOCALES</button>
                    <button class="btn btn-secondary" onclick="showScreen('triviaScreen')">📚 TRIVIA</button>
                </div>
                <div style="display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;">
                    <button class="btn btn-secondary" onclick="showScreen('rankingScreen')">🏆 RANKING</button>
                    <button class="btn btn-secondary" onclick="showInstructions()">📚 CLASES</button>
                </div>
                <div style="display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;">
                    <button class="btn btn-secondary" onclick="showMultiplayerSetup()">🌐 MULTIJUGADOR</button>
                </div>

                <!-- Botón PLAY NOW al final, grande y centrado -->
                <button class="btn btn-play" onclick="startGame('ai')">⚔️ PLAY NOW</button>
            </div>
        </div>

        <!-- GAME SCREEN -->
        <div class="screen" id="gameScreen">
            <div class="game-screen">
                <div class="game-header">
                    <div class="player-info">
                        <div class="player-avatar silver" id="topAvatar">🤖</div>
                        <div><div class="player-name" id="topName">IA OPONENTE</div><div class="timer-display" id="aiTimer">10:00</div></div>
                    </div>
                    <div class="player-info">
                        <div class="player-avatar">👤</div>
                        <div><div class="player-name">TÚ</div><div class="timer-display" id="playerTimer">10:00</div></div>
                    </div>
                </div>
                <div class="board-container" id="boardContainer">
                    <canvas id="chessCanvas"></canvas>
                    <div class="combo-display" id="comboDisplay"></div>
                </div>
                <div class="game-footer">
                    <span class="energy-label">⚡</span>
                    <div class="energy-bar-container"><div class="energy-bar" id="energyBar" style="width:100%"></div></div>
                    <span class="energy-label" id="energyValue">100%</span>
                    <button class="btn-back" onclick="backToHome()">🏠 MENÚ</button>
                </div>
            </div>
        </div>

        <!-- TRIVIA SCREEN (se omite por brevedad, igual que antes) -->
        <!-- RANKING SCREEN (se omite) -->
        <!-- MODALES (se omiten) -->
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
        import { getDatabase, ref, set, onValue, update, remove } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';

        // ⚠️ REEMPLAZA ESTOS DATOS CON LOS DE TU PROYECTO FIREBASE
        const firebaseConfig = {
            apiKey: "TU_API_KEY",
            authDomain: "tu-proyecto.firebaseapp.com",
            databaseURL: "https://tu-proyecto-default-rtdb.firebaseio.com",
            projectId: "tu-proyecto",
            storageBucket: "tu-proyecto.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abc123"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        window.db = db; // exponer para usar en funciones globales
    </script>

    <script>
        // ============ VARIABLES GLOBALES ============
        let userData = getUserData();
        let gameState = {
            mode: 'ai',
            selectedSquare: null,
            playerTimer: 600,
            aiTimer: 600,
            gameOver: false,
            currentTurn: 'w',
            combo: 0,
            energy: 100
        };
        let currentRoomId = null;
        let playerColor = 'w';
        let opponentColor = 'b';

        // ============ MULTIJUGADOR ============
        function showMultiplayerSetup() {
            const setupHTML = `
                <div class="multiplayer-setup">
                    <button class="btn btn-secondary" onclick="createRoom()">🏠 Crear Sala</button>
                    <p style="color:#aaa;">o únete a una sala existente</p>
                    <input type="text" id="roomIdInput" placeholder="Código de sala">
                    <button class="btn btn-secondary" onclick="joinRoom()">🔗 Unirse</button>
                    <div id="roomLinkDisplay" class="room-link" style="display:none;"></div>
                </div>
            `;
            const modal = document.createElement('div');
            modal.className = 'modal-overlay active';
            modal.innerHTML = `<div class="modal">${setupHTML}<button class="btn-close" onclick="this.parentElement.parentElement.remove()">CERRAR</button></div>`;
            document.body.appendChild(modal);
        }

        function generateRoomId() {
            return 'room_' + Math.random().toString(36).substr(2, 8);
        }

        async function createRoom() {
            if (!window.db) return alert('Firebase no está configurado. Sigue las instrucciones.');
            const roomId = generateRoomId();
            const roomRef = ref(window.db, 'rooms/' + roomId);
            await set(roomRef, {
                board: chess.board,
                turn: 'w',
                white: null,
                black: null,
                status: 'waiting'
            });
            currentRoomId = roomId;
            playerColor = 'w';
            opponentColor = 'b';
            // Mostrar enlace para compartir
            const link = `${window.location.origin}${window.location.pathname}?room=${roomId}`;
            document.getElementById('roomLinkDisplay').style.display = 'block';
            document.getElementById('roomLinkDisplay').textContent = `Comparte este enlace: ${link}`;
            // Escuchar cambios
            listenToRoom(roomId);
            // Unirse como blanco
            await update(ref(window.db, 'rooms/' + roomId), { white: getUserData().name });
        }

        async function joinRoom() {
            const roomId = document.getElementById('roomIdInput').value.trim();
            if (!roomId) return alert('Ingresa un código de sala');
            const roomRef = ref(window.db, 'rooms/' + roomId);
            const snapshot = await new Promise(resolve => onValue(roomRef, resolve, { onlyOnce: true }));
            const room = snapshot.val();
            if (!room) return alert('Sala no encontrada');
            if (room.status !== 'waiting') return alert('Sala llena o en juego');
            // Unirse como negro
            await update(roomRef, { black: getUserData().name, status: 'playing' });
            currentRoomId = roomId;
            playerColor = 'b';
            opponentColor = 'w';
            listenToRoom(roomId);
            startGame('multiplayer');
        }

        function listenToRoom(roomId) {
            const roomRef = ref(window.db, 'rooms/' + roomId);
            onValue(roomRef, (snapshot) => {
                const room = snapshot.val();
                if (!room) return;
                if (room.board && room.turn !== gameState.currentTurn) {
                    // Actualizar tablero con el movimiento del oponente
                    chess.board = room.board;
                    gameState.currentTurn = room.turn;
                    drawBoard();
                }
                if (room.status === 'finished') {
                    gameState.gameOver = true;
                    clearInterval(timerInterval);
                    alert(room.winner ? `${room.winner} gana!` : 'Partida terminada');
                }
            });
        }

        function sendMoveToFirebase() {
            if (!currentRoomId || !window.db) return;
            const roomRef = ref(window.db, 'rooms/' + currentRoomId);
            update(roomRef, {
                board: chess.board,
                turn: gameState.currentTurn
            });
        }

        // ============ CHESS ENGINE (sin cambios) ============
        const chess = {
            board: [],
            init() {
                this.board = [
                    ['r','n','b','q','k','b','n','r'],
                    ['p','p','p','p','p','p','p','p'],
                    ['','','','','','','',''],
                    ['','','','','','','',''],
                    ['','','','','','','',''],
                    ['','','','','','','',''],
                    ['P','P','P','P','P','P','P','P'],
                    ['R','N','B','Q','K','B','N','R']
                ];
            },
            getPiece(r,c){ return this.board[r]?.[c]||''; },
            isValidMove(fr,fc,tr,tc){
                const piece = this.getPiece(fr,fc);
                if(!piece) return false;
                const target = this.getPiece(tr,tc);
                if(target && ((piece===piece.toUpperCase()&&target===target.toUpperCase())||(piece===piece.toLowerCase()&&target===target.toLowerCase()))) return false;
                const type=piece.toLowerCase();
                const rd=tr-fr, cd=tc-fc, ard=Math.abs(rd), acd=Math.abs(cd);
                const clearPath=(dr,dc)=>{
                    const steps=Math.max(Math.abs(dr),Math.abs(dc));
                    const sr=dr===0?0:dr/Math.abs(dr), sc=dc===0?0:dc/Math.abs(dc);
                    for(let i=1;i<steps;i++) if(this.getPiece(fr+sr*i,fc+sc*i)) return false;
                    return true;
                };
                switch(type){
                    case'p':const dir=piece==='P'?-1:1, sRow=piece==='P'?6:1;
                        if(cd===0&&!target){if(rd===dir)return true;if(fr===sRow&&rd===2*dir&&!this.getPiece(fr+dir,fc))return true;}
                        return acd===1&&rd===dir&&!!target;
                    case'r':return(rd===0||cd===0)&&clearPath(rd,cd);
                    case'n':return(ard===2&&acd===1)||(ard===1&&acd===2);
                    case'b':return ard===acd&&clearPath(rd,cd);
                    case'q':return(rd===0||cd===0||ard===acd)&&clearPath(rd,cd);
                    case'k':return ard<=1&&acd<=1;
                }return false;
            },
            movePiece(fr,fc,tr,tc){
                const piece=this.getPiece(fr,fc), captured=this.getPiece(tr,tc);
                this.board[tr][tc]=piece; this.board[fr][fc]='';
                return{piece,captured};
            },
            findKing(color){const k=color==='w'?'K':'k';for(let r=0;r<8;r++)for(let c=0;c<8;c++)if(this.board[r][c]===k)return{row:r,col:c};return null;},
            isInCheck(color){const king=this.findKing(color);if(!king)return false;for(let r=0;r<8;r++)for(let c=0;c<8;c++){const p=this.board[r][c];if(p&&((color==='w'&&p===p.toLowerCase())||(color==='b'&&p===p.toUpperCase())))if(this.isValidMove(r,c,king.row,king.col))return true;}return false;},
            hasLegalMoves(color){for(let r=0;r<8;r++)for(let c=0;c<8;c++){const p=this.board[r][c];if((color==='w'&&p&&p===p.toUpperCase())||(color==='b'&&p&&p===p.toLowerCase())){for(let tr=0;tr<8;tr++)for(let tc=0;tc<8;tc++){if(this.isValidMove(r,c,tr,tc)){const saved=this.board[tr][tc];this.board[tr][tc]=p;this.board[r][c]='';if(!this.isInCheck(color)){this.board[r][c]=p;this.board[tr][tc]=saved;return true;}this.board[r][c]=p;this.board[tr][tc]=saved;}}}}return false;},
            getAIMove(){const moves=[];for(let r=0;r<8;r++)for(let c=0;c<8;c++){const p=this.board[r][c];if(p&&p===p.toLowerCase()){for(let tr=0;tr<8;tr++)for(let tc=0;tc<8;tc++){if(this.isValidMove(r,c,tr,tc)){const saved=this.board[tr][tc];this.board[tr][tc]=p;this.board[r][c]='';if(!this.isInCheck('b')){let score=saved?(saved.toUpperCase()==='Q'?9:saved.toUpperCase()==='R'?5:'BN'.includes(saved.toUpperCase())?3:1):0;moves.push({fromRow:r,fromCol:c,toRow:tr,toCol:tc,piece:p,captured:saved,score});}this.board[r][c]=p;this.board[tr][tc]=saved;}}}}if(!moves.length)return null;moves.sort((a,b)=>b.score-a.score);return Math.random()<0.7?moves[0]:moves[Math.floor(Math.random()*Math.min(5,moves.length))];}
        };

        // ... (Canvas, game functions, etc., sin cambios relevantes) ...
        // Por brevedad, omito la repetición completa del Canvas y funciones que ya estaban.
        // En el código final real se incluyen todas las funciones originales.
    </script>
</body>
</html>
