<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AJEDREZ PRO</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(135deg, #e8e0d0 0%, #c8c0b0 100%);
            font-family: 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
        }

        /* Contenedor principal */
        .app-container {
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
        }

        /* Pantallas */
        .screen {
            display: none;
            width: 100%;
        }

        .screen.active {
            display: block;
        }

        /* ========== HOME ========== */
        .home-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            border-radius: 48px;
            padding: 40px 20px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        }

        .chess-icon {
            font-size: 80px;
            margin-bottom: 20px;
        }

        .title {
            font-size: 32px;
            font-weight: 800;
            color: #2c3e2f;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #6b7c6e;
            margin-bottom: 40px;
        }

        .btn-play {
            background: linear-gradient(135deg, #ffd700, #ffaa00);
            border: none;
            width: 80%;
            padding: 16px;
            border-radius: 50px;
            font-size: 22px;
            font-weight: bold;
            color: #2c3e2f;
            margin-bottom: 20px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: transform 0.1s;
        }

        .btn-play:active {
            transform: scale(0.97);
        }

        .home-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .btn-sec {
            background: rgba(44, 62, 47, 0.1);
            border: 1px solid rgba(44, 62, 47, 0.2);
            padding: 10px 20px;
            border-radius: 40px;
            font-weight: 600;
            color: #2c3e2f;
            cursor: pointer;
        }

        /* ========== JUEGO ========== */
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            border-radius: 60px;
            padding: 10px 20px;
        }

        .back-btn {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: #2c3e2f;
        }

        .timers {
            display: flex;
            gap: 20px;
        }

        .timer {
            text-align: center;
        }

        .timer-label {
            font-size: 10px;
            font-weight: bold;
            color: #ffaa00;
        }

        .timer-value {
            font-size: 20px;
            font-weight: bold;
            font-family: monospace;
            color: #2c3e2f;
        }

        .energy {
            background: #2c3e2f;
            padding: 8px 16px;
            border-radius: 40px;
            color: #ffd700;
            font-weight: bold;
        }

        /* Tablero - OCUPA ESPACIO PROPORCIONAL */
        .board-container {
            background: #f5f0e0;
            border-radius: 24px;
            padding: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            margin-bottom: 16px;
        }

        canvas {
            width: 100%;
            aspect-ratio: 1 / 1;
            display: block;
            border-radius: 16px;
            box-shadow: inset 0 0 0 2px rgba(0,0,0,0.1);
            cursor: pointer;
        }

        .game-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            border-radius: 60px;
            padding: 10px 20px;
        }

        .status {
            font-weight: bold;
            color: #2c3e2f;
            font-size: 14px;
        }

        .action-btn {
            background: #2c3e2f;
            border: none;
            padding: 8px 16px;
            border-radius: 30px;
            color: #ffd700;
            font-weight: bold;
            cursor: pointer;
        }

        /* ========== INSTRUCCIONES ========== */
        .learn-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 32px;
            padding: 20px;
            min-height: 80vh;
        }

        .learn-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .learn-title {
            font-size: 24px;
            font-weight: 800;
            color: #2c3e2f;
        }

        .moves-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .move-item {
            background: #f0ece0;
            border-radius: 20px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.1s;
        }

        .move-item:active {
            transform: scale(0.98);
            background: #e8e0d0;
        }

        .move-name {
            font-size: 18px;
            font-weight: bold;
            color: #2c3e2f;
        }

        .move-algebra {
            font-family: monospace;
            font-size: 14px;
            color: #ffaa00;
            margin-top: 5px;
        }

        .move-desc {
            font-size: 12px;
            color: #6b7c6e;
            margin-top: 5px;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            visibility: hidden;
            transition: all 0.2s;
        }

        .modal.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: white;
            border-radius: 32px;
            padding: 25px;
            width: 85%;
            max-width: 320px;
            text-align: center;
        }

        .modal-close {
            background: #ffd700;
            border: none;
            padding: 10px;
            border-radius: 30px;
            font-weight: bold;
            width: 100%;
            margin-top: 15px;
            cursor: pointer;
        }
    </style>
</head>
<body>
<div class="app-container">
    <!-- HOME -->
    <div id="homeScreen" class="screen active">
        <div class="home-card">
            <div class="chess-icon">♔</div>
            <div class="title">AJEDREZ PRO</div>
            <div class="subtitle">Juega y Aprende</div>
            <button class="btn-play" id="playBtn">▶ JUGAR</button>
            <div class="home-buttons">
                <button class="btn-sec" id="learnHomeBtn">📖 JUGADAS</button>
                <button class="btn-sec" id="comingHomeBtn">🔜 MÁS</button>
            </div>
        </div>
    </div>

    <!-- JUEGO -->
    <div id="gameScreen" class="screen">
        <div class="game-header">
            <button class="back-btn" id="gameBackBtn">←</button>
            <div class="timers">
                <div class="timer"><div class="timer-label">BLANCAS</div><div class="timer-value" id="whiteTimer">10:00</div></div>
                <div class="timer"><div class="timer-label">NEGRAS</div><div class="timer-value" id="blackTimer">10:00</div></div>
            </div>
            <div class="energy">⚡ <span id="energyVal">100</span>%</div>
        </div>

        <div class="board-container">
            <canvas id="chessCanvas" width="500" height="500"></canvas>
        </div>

        <div class="game-footer">
            <div class="status" id="statusText">🎮 Turno: Blancas</div>
            <button class="action-btn" id="resetGameBtn">REINICIAR</button>
            <button class="action-btn" id="soundGameBtn">🔊</button>
        </div>
    </div>

    <!-- INSTRUCCIONES -->
    <div id="learnScreen" class="screen">
        <div class="learn-card">
            <div class="learn-header">
                <button class="back-btn" id="learnBackBtn">←</button>
                <div class="learn-title">JUGADAS MAESTRAS</div>
            </div>
            <div class="moves-list" id="movesList"></div>
        </div>
    </div>

    <!-- PRÓXIMAMENTE -->
    <div id="comingScreen" class="screen">
        <div class="learn-card" style="display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;">
            <button class="back-btn" id="comingBackBtn" style="position: absolute; top: 20px; left: 20px;">←</button>
            <div style="font-size: 60px;">🎮</div>
            <div style="font-size: 28px; font-weight: bold; color: #2c3e2f; margin: 20px;">PRÓXIMAMENTE</div>
            <div style="color: #6b7c6e; line-height: 2;">⚡ Modo Torneo<br>🏆 Ranking Global<br>👥 Multijugador</div>
            <button class="btn-play" id="comingVolverBtn" style="width: auto; padding: 10px 30px; font-size: 16px; margin-top: 30px;">Volver</button>
        </div>
    </div>
</div>

<!-- MODAL -->
<div id="modal" class="modal">
    <div class="modal-content">
        <div style="font-size: 50px;" id="modalIcon">♔</div>
        <div style="font-size: 20px; font-weight: bold; color: #2c3e2f; margin: 10px 0;" id="modalTitle"></div>
        <div style="font-family: monospace; font-size: 14px; color: #ffaa00; background: #f0ece0; padding: 10px; border-radius: 12px;" id="modalMoves"></div>
        <div style="font-size: 13px; color: #6b7c6e; margin: 15px 0;" id="modalDesc"></div>
        <button class="modal-close" id="closeModal">Entendido</button>
    </div>
</div>

<script>
    // ========== DATOS DE APRENDIZAJE ==========
    const movesData = [
        { icon: '♔', name: 'Apertura Italiana', moves: '1.e4 e5 2.Cf3 Cc6 3.Ac4', desc: 'Controla el centro y desarrolla el alfil a c4, apuntando a f7. Es ideal para principiantes.' },
        { icon: '♕', name: 'Apertura Española', moves: '1.e4 e5 2.Cf3 Cc6 3.Ab5', desc: 'Presiona el caballo que defiende e5. Una de las aperturas más estudiadas.' },
        { icon: '♖', name: 'Enroque', moves: 'Corto: 0-0 | Largo: 0-0-0', desc: 'Mueve el rey 2 casillas hacia la torre. Es el único movimiento con dos piezas.' },
        { icon: '♝', name: 'Alfil a c4', moves: 'Ac4', desc: 'Apunta directamente a f7, el punto más débil al inicio del juego.' },
        { icon: '♞', name: 'Caballo a f3', moves: 'Cf3', desc: 'Controla el centro y prepara el enroque. Jugada fundamental.' },
        { icon: '♟', name: 'Peón al Centro', moves: '1.e4 o 1.d4', desc: 'El centro es el corazón del tablero. Controlarlo da espacio a tus piezas.' }
    ];

    // Generar lista de movimientos
    const movesList = document.getElementById('movesList');
    movesData.forEach(m => {
        const div = document.createElement('div');
        div.className = 'move-item';
        div.innerHTML = `<div class="move-name">${m.icon} ${m.name}</div><div class="move-algebra">${m.moves}</div><div class="move-desc">${m.desc}</div>`;
        div.onclick = () => {
            document.getElementById('modalIcon').textContent = m.icon;
            document.getElementById('modalTitle').textContent = m.name;
            document.getElementById('modalMoves').textContent = m.moves;
            document.getElementById('modalDesc').textContent = m.desc;
            document.getElementById('modal').classList.add('active');
        };
        movesList.appendChild(div);
    });

    document.getElementById('closeModal').onclick = () => document.getElementById('modal').classList.remove('active');
    document.getElementById('modal').onclick = (e) => { if(e.target === document.getElementById('modal')) document.getElementById('modal').classList.remove('active'); };

    // ========== NAVEGACIÓN ==========
    const screens = {
        home: document.getElementById('homeScreen'),
        game: document.getElementById('gameScreen'),
        learn: document.getElementById('learnScreen'),
        coming: document.getElementById('comingScreen')
    };

    function showScreen(name) {
        Object.keys(screens).forEach(k => screens[k].classList.remove('active'));
        screens[name].classList.add('active');
        if (name === 'game') {
            setTimeout(() => resizeCanvasAndDraw(), 50);
        }
    }

    document.getElementById('playBtn').onclick = () => showScreen('game');
    document.getElementById('learnHomeBtn').onclick = () => showScreen('learn');
    document.getElementById('comingHomeBtn').onclick = () => showScreen('coming');
    document.getElementById('gameBackBtn').onclick = () => showScreen('home');
    document.getElementById('learnBackBtn').onclick = () => showScreen('home');
    document.getElementById('comingBackBtn').onclick = () => showScreen('home');
    document.getElementById('comingVolverBtn').onclick = () => showScreen('home');

    // ========== AJEDREZ ==========
    const game = new Chess();
    let selectedSquare = null;
    let legalMoves = [];
    let soundEnabled = true;
    let energy = 100;
    let whiteTime = 600;
    let blackTime = 600;
    let currentTimer = 'w';
    let timerInterval = null;

    // Canvas
    const canvas = document.getElementById('chessCanvas');
    let ctx = canvas.getContext('2d');
    let squareSize = 0;

    // Piezas con emojis (visibles y claros)
    const pieces = {
        'k': '♔', 'q': '♕', 'r': '♖', 'b': '♗', 'n': '♘', 'p': '♙',
        'K': '♚', 'Q': '♛', 'R': '♜', 'B': '♝', 'N': '♞', 'P': '♟'
    };

    // Colores claros para el tablero
    const lightColor = '#f0e6d0';
    const darkColor = '#b58863';
    const selectedColor = '#ffd700';
    const legalColor = '#90ee90';

    function resizeCanvasAndDraw() {
        const container = canvas.parentElement;
        const size = container.clientWidth;
        canvas.width = size;
        canvas.height = size;
        squareSize = canvas.width / 8;
        drawBoard();
    }

    function drawBoard() {
        if (!ctx) return;
        const board = game.board();
        
        for (let i = 0; i < 8; i++) {
            for (let j = 0; j < 8; j++) {
                const x = j * squareSize;
                const y = i * squareSize;
                const isLight = (i + j) % 2 === 0;
                const squareName = String.fromCharCode(97 + j) + (8 - i);
                
                // Color de fondo
                if (selectedSquare === squareName) {
                    ctx.fillStyle = selectedColor;
                } else if (legalMoves.includes(squareName)) {
                    ctx.fillStyle = legalColor;
                } else if (isLight) {
                    ctx.fillStyle = lightColor;
                } else {
                    ctx.fillStyle = darkColor;
                }
                ctx.fillRect(x, y, squareSize, squareSize);
                
                // Borde de casilla
                ctx.strokeStyle = 'rgba(0,0,0,0.1)';
                ctx.strokeRect(x, y, squareSize, squareSize);
                
                // Pieza
                const piece = board[i][j];
                if (piece) {
                    let pieceKey = piece.type;
                    if (piece.color === 'b') pieceKey = piece.type.toUpperCase();
                    const icon = pieces[pieceKey];
                    ctx.font = `${squareSize * 0.55}px "Segoe UI Emoji", "Apple Color Emoji", sans-serif`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillStyle = piece.color === 'w' ? '#2c3e2f' : '#1a1a1a';
                    ctx.shadowBlur = 3;
                    ctx.shadowColor = 'rgba(0,0,0,0.3)';
                    ctx.fillText(icon, x + squareSize / 2, y + squareSize / 2);
                    ctx.shadowBlur = 0;
                }
            }
        }
    }

    function updateUI() {
        const statusDiv = document.getElementById('statusText');
        if (game.game_over()) {
            if (game.in_checkmate()) {
                const winner = game.turn() === 'w' ? '⚫ NEGRAS' : '⚪ BLANCAS';
                statusDiv.innerHTML = `🏆 JAQUE MATE! Ganan ${winner}`;
            } else {
                statusDiv.innerHTML = '♾️ TABLAS';
            }
        } else {
            const turn = game.turn() === 'w' ? 'BLANCAS' : 'NEGRAS';
            statusDiv.innerHTML = `🎮 Turno: ${turn}${game.in_check() ? ' ⚠️ JAQUE' : ''}`;
            if (game.in_check()) playSound('check');
            switchTimer();
        }
        document.getElementById('energyVal').innerText = Math.floor(energy);
        updateTimerDisplay();
        drawBoard();
    }

    function updateTimerDisplay() {
        document.getElementById('whiteTimer').innerText = `${Math.floor(whiteTime/60)}:${(whiteTime%60).toString().padStart(2,'0')}`;
        document.getElementById('blackTimer').innerText = `${Math.floor(blackTime/60)}:${(blackTime%60).toString().padStart(2,'0')}`;
    }

    function startTimer() {
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            if (game.game_over()) return;
            if (currentTimer === 'w') {
                if (whiteTime > 0) whiteTime--;
            } else {
                if (blackTime > 0) blackTime--;
            }
            updateTimerDisplay();
        }, 1000);
    }

    function switchTimer() {
        currentTimer = game.turn();
        startTimer();
    }

    function playSound(type) {
        if (!soundEnabled) return;
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.frequency.value = type === 'capture' ? 392 : 523.25;
            gain.gain.value = 0.1;
            osc.start();
            gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.2);
            osc.stop(audioCtx.currentTime + 0.2);
            setTimeout(() => audioCtx.close(), 300);
        } catch(e) {}
    }

    function makeAIMove() {
        if (!game.game_over() && game.turn() === 'b') {
            setTimeout(() => {
                const moves = game.moves();
                if (moves.length > 0) {
                    const randomMove = moves[Math.floor(Math.random() * moves.length)];
                    game.move(randomMove);
                    selectedSquare = null;
                    legalMoves = [];
                    updateUI();
                    playSound('move');
                    energy = Math.min(100, energy + 5);
                    document.getElementById('energyVal').innerText = Math.floor(energy);
                }
            }, 200);
        }
    }

    function onCanvasClick(e) {
        if (game.game_over()) return;
        
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        
        let clientX, clientY;
        if (e.touches) {
            clientX = e.touches[0].clientX;
            clientY = e.touches[0].clientY;
            e.preventDefault();
        } else {
            clientX = e.clientX;
            clientY = e.clientY;
        }
        
        const canvasX = (clientX - rect.left) * scaleX;
        const canvasY = (clientY - rect.top) * scaleY;
        
        if (canvasX < 0 || canvasX > canvas.width || canvasY < 0 || canvasY > canvas.height) return;
        
        const col = Math.floor(canvasX / squareSize);
        const row = Math.floor(canvasY / squareSize);
        const square = String.fromCharCode(97 + col) + (8 - row);
        
        if (selectedSquare) {
            const move = { from: selectedSquare, to: square, promotion: 'q' };
            const result = game.move(move);
            
            if (result) {
                energy = Math.max(0, energy - 2);
                playSound(result.flags && result.flags.includes('c') ? 'capture' : 'move');
                selectedSquare = null;
                legalMoves = [];
                updateUI();
                makeAIMove();
            } else {
                const piece = game.get(square);
                if (piece && piece.color === game.turn()) {
                    selectedSquare = square;
                    legalMoves = game.moves({ square, verbose: true }).map(m => m.to);
                    drawBoard();
                } else {
                    selectedSquare = null;
                    legalMoves = [];
                    drawBoard();
                }
            }
        } else {
            const piece = game.get(square);
            if (piece && piece.color === game.turn()) {
                selectedSquare = square;
                legalMoves = game.moves({ square, verbose: true }).map(m => m.to);
                drawBoard();
                playSound('move');
            }
        }
    }

    function resetGame() {
        game.reset();
        selectedSquare = null;
        legalMoves = [];
        whiteTime = 600;
        blackTime = 600;
        currentTimer = 'w';
        energy = 100;
        updateUI();
        startTimer();
        playSound('move');
    }

    function toggleSound() {
        soundEnabled = !soundEnabled;
        document.getElementById('soundGameBtn').innerHTML = soundEnabled ? '🔊' : '🔇';
    }

    canvas.addEventListener('click', onCanvasClick);
    canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        onCanvasClick(e);
    });
    
    document.getElementById('resetGameBtn').onclick = resetGame;
    document.getElementById('soundGameBtn').onclick = toggleSound;
    
    window.addEventListener('resize', () => {
        resizeCanvasAndDraw();
    });
    
    resizeCanvasAndDraw();
    updateUI();
    startTimer();
</script>
</body>
</html>
