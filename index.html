<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Firebase</title>
    <style>
        body { background: #0a0a2e; color: white; font-family: sans-serif; padding: 20px; text-align: center; }
        .btn { padding: 15px 30px; margin: 10px; border-radius: 25px; border: none; font-size: 16px; cursor: pointer; background: #ffd700; color: #000; font-weight: bold; }
        .log { background: #111; padding: 15px; border-radius: 10px; margin: 15px 0; text-align: left; font-family: monospace; font-size: 12px; max-height: 300px; overflow-y: auto; }
        input { padding: 10px; border-radius: 20px; border: 1px solid #ffd700; background: #222; color: white; text-align: center; margin: 5px; }
    </style>
</head>
<body>
    <h1>🔍 Diagnóstico Firebase</h1>
    <p id="status">Conectando...</p>
    
    <button class="btn" onclick="crearSala()">Crear Sala</button>
    <br>
    <input type="text" id="roomId" placeholder="ID de sala">
    <button class="btn" onclick="unirseSala()">Unirse</button>
    <br>
    <button class="btn" onclick="enviarMensaje()">Enviar Mensaje de Prueba</button>
    
    <div class="log" id="log">Esperando...</div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script>
        function log(msg) {
            const l = document.getElementById('log');
            l.innerHTML += '<br>' + new Date().toLocaleTimeString() + ': ' + msg;
            l.scrollTop = l.scrollHeight;
        }

        // Inicializar Firebase
        try {
            firebase.initializeApp({
                apiKey: "AIzaSyDMu83hA5xjmwSlUX4KUgWkYlx6SqHcaAk",
                authDomain: "royal-chess-multiplayer.firebaseapp.com",
                databaseURL: "https://royal-chess-multiplayer-default-rtdb.firebaseio.com",
                projectId: "royal-chess-multiplayer",
                storageBucket: "royal-chess-multiplayer.firebasestorage.app",
                messagingSenderId: "380447919929",
                appId: "1:380447919929:web:13c8584bf1e688830ea2e8"
            });
            const db = firebase.database();
            document.getElementById('status').textContent = '✅ Firebase conectado';
            log('✅ Firebase inicializado correctamente');
            
            // Probar escritura
            db.ref('test').set({ mensaje: 'Hola', timestamp: Date.now() }).then(() => {
                log('✅ Escritura de prueba exitosa');
            }).catch(e => {
                log('❌ Error de escritura: ' + e.message);
            });
            
            // Probar lectura
            db.ref('test').once('value', (snap) => {
                log('📖 Lectura de prueba: ' + JSON.stringify(snap.val()));
            });

        } catch(e) {
            document.getElementById('status').textContent = '❌ Error: ' + e.message;
            log('❌ Error al inicializar: ' + e.message);
        }

        let currentRoom = null;

        function crearSala() {
            const roomId = 'test_' + Date.now();
            db.ref('rooms/' + roomId).set({
                creador: 'Jugador1',
                visitante: null,
                mensajes: ['Sala creada'],
                timestamp: Date.now()
            }).then(() => {
                currentRoom = roomId;
                log('✅ Sala creada: ' + roomId);
                document.getElementById('roomId').value = roomId;
                
                // Escuchar cambios
                db.ref('rooms/' + roomId).on('value', (snap) => {
                    const data = snap.val();
                    if (data) {
                        log('📩 Datos recibidos: ' + JSON.stringify(data));
                        if (data.visitante) {
                            log('👤 ¡Alguien se unió! Visitante: ' + data.visitante);
                        }
                    }
                });
            }).catch(e => {
                log('❌ Error al crear sala: ' + e.message);
            });
        }

        function unirseSala() {
            const roomId = document.getElementById('roomId').value.trim();
            if (!roomId) return alert('Ingresa un ID de sala');
            
            db.ref('rooms/' + roomId).update({
                visitante: 'Jugador2',
            }).then(() => {
                currentRoom = roomId;
                log('✅ Unido a sala: ' + roomId);
                
                db.ref('rooms/' + roomId).on('value', (snap) => {
                    const data = snap.val();
                    if (data) {
                        log('📩 Datos de sala: ' + JSON.stringify(data));
                    }
                });
            }).catch(e => {
                log('❌ Error al unirse: ' + e.message);
            });
        }

        function enviarMensaje() {
            if (!currentRoom) return alert('Primero crea o únete a una sala');
            const msg = 'Mensaje de prueba ' + Date.now();
            db.ref('rooms/' + currentRoom + '/mensajes').push(msg).then(() => {
                log('📤 Mensaje enviado: ' + msg);
            });
        }
    </script>
</body>
</html>
