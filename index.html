<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>♔ Royal Chess Arena - Play & Earn</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #0a0a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .app-container {
            position: relative;
            z-index: 1;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background: #0a0a2e;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        @media (orientation: landscape) {
            .app-container {
                flex-direction: row;
            }
        }

        .screen {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
            animation: fadeIn 0.4s ease-out;
        }

        .screen.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        /* HOME SCREEN */
        .home-screen {
            align-items: center;
            justify-content: center;
            gap: 15px;
            padding: 15px;
            background: linear-gradient(180deg, #0a0a2e 0%, #1a1a4e 50%, #0a0a2e 100%);
            overflow-y: auto;
        }

        .logo-container {
            text-align: center;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .crown-icon {
            font-size: 60px;
            filter: drop-shadow(0 0 25px rgba(255, 215, 0, 0.6));
        }

        .title {
            font-size: 30px;
            font-weight: 900;
            background: linear-gradient(45deg, #ffd700, #ffed4a, #daa520);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
        }

        .subtitle {
            color: #c0c0c0;
            font-size: 12px;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-top: 5px;
        }

        .btn {
            padding: 14px 35px;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
            position: relative;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn-play {
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            color: #1a1a2e;
            box-shadow: 0 8px 25px rgba(255, 140, 0, 0.5);
            font-size: 22px;
            padding: 18px 50px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 8px 25px rgba(255, 140, 0, 0.5); }
            50% { box-shadow: 0 12px 40px rgba(255, 140, 0, 0.8); }
            100% { box-shadow: 0 8px 25px rgba(255, 140, 0, 0.5); }
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            color: white;
            border: 1px solid rgba(255, 215, 0, 0.25);
            font-size: 13px;
            padding: 10px 20px;
        }

        .btn-secondary:active {
            background: rgba(255, 215, 0, 0.2);
        }

        .btn-music {
            position: fixed;
            bottom: 15px;
            right: 15px;
            z-index: 300;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(0,0,0,0.7);
            border: 2px solid rgba(255,215,0,0.4);
            color: #ffd700;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
        }

        .stats-container {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 215, 0, 0.15);
            border-radius: 12px;
            padding: 10px 18px;
            text-align: center;
            min-width: 80px;
        }

        .stat-value {
            color: #ffd700;
            font-size: 24px;
            font-weight: 900;
        }

        .stat-label {
            color: #888;
            font-size: 10px;
            text-transform: uppercase;
        }

        /* GAME SCREEN */
        .game-screen {
            display: flex;
            flex-direction: column;
            height: 100%;
            background: #0a0a1a;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 10px;
            background: rgba(10, 10, 30, 0.95);
            border-bottom: 1px solid rgba(255, 215, 0, 0.2);
            flex-shrink: 0;
            z-index: 10;
        }

        .player-info {
            display: flex;
            align-items: center;
            gap: 8px;
            color: white;
        }

        .player-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
        }

        .player-avatar.silver {
            background: linear-gradient(135deg, #c0c0c0, #808080);
        }

        .player-name {
            font-size: 11px;
            color: #aaa;
            white-space: nowrap;
        }

        .timer-display {
            font-size: 22px;
            font-weight: 900;
            color: #ffd700;
            font-family: 'Courier New', monospace;
            letter-spacing: 1px;
        }

        .timer-display.urgent {
            color: #ff3333;
            animation: blink 0.5s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }

        .board-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 5px;
            min-height: 0;
            position: relative;
        }

        canvas {
            border-radius: 8px;
            box-shadow: 0 0 60px rgba(255, 215, 0, 0.15), 0 5px 30px rgba(0, 0, 0, 0.8);
            cursor: pointer;
            touch-action: manipulation;
            max-width: 100%;
            max-height: 100%;
        }

        .game-footer {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 10px;
            background: rgba(10, 10, 30, 0.95);
            border-top: 1px solid rgba(255, 215, 0, 0.2);
            flex-shrink: 0;
            flex-wrap: wrap;
        }

        .energy-bar-container {
            flex: 1;
            min-width: 100px;
            height: 16px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid rgba(255, 215, 0, 0.2);
        }

        .energy-bar {
            height: 100%;
            background: linear-gradient(90deg, #ff3333, #ffaa00, #ffd700, #44ff44);
            border-radius: 8px;
            transition: width 0.4s ease;
            box-shadow: inset 0 0 10px rgba(255, 255, 255, 0.3);
        }

        .energy-label {
            color: #ffd700;
            font-size: 11px;
            font-weight: 700;
            white-space: nowrap;
        }

        .btn-back {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 215, 0, 0.2);
            color: #ffd700;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            white-space: nowrap;
            font-weight: 700;
        }

        .btn-back:active {
            background: rgba(255, 215, 0, 0.2);
        }

        .combo-display {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 42px;
            font-weight: 900;
            color: #ffd700;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.9);
            pointer-events: none;
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 100;
            text-align: center;
        }

        .combo-display.active {
            opacity: 1;
            animation: comboPop 0.6s ease-out;
        }

        @keyframes comboPop {
            0% { transform: translate(-50%, -50%) scale(0.3); opacity: 0; }
            40% { transform: translate(-50%, -50%) scale(1.3); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
        }

        /* MODAL MULTIJUGADOR */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(5px);
            z-index: 200;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: linear-gradient(135deg, #1a1a3e, #2a2a5e);
            border: 2px solid rgba(255,215,0,0.4);
            border-radius: 16px;
            padding: 20px;
            max-width: 380px;
            width: 100%;
            color: white;
            box-shadow: 0 20px 60px rgba(0,0,0,0.7);
        }

        .modal h2 {
            color: #ffd700;
            font-size: 24px;
            margin-bottom: 15px;
            text-align: center;
        }

        .modal input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 25px;
            border: 1px solid rgba(255,215,0,0.3);
            background: rgba(255,255,255,0.1);
            color: white;
            text-align: center;
            font-size: 14px;
        }

        .modal .btn {
            margin: 5px 0;
            width: 100%;
        }

        .room-link {
            color: #ffd700;
            word-break: break-all;
            font-size: 12px;
            background: rgba(0,0,0,0.5);
            padding: 8px;
            border-radius: 10px;
            margin: 5px 0;
        }

        /* Estilos de trivia, ranking, etc. se mantienen (no los incluyo por brevedad, están en tu versión) */
        /* Los tienes completos en la versión anterior, no los modificaré */
    </style>
</head>
<body>
    <button class="btn-music" id="musicBtn" onclick="toggleMusic()">🎵</button>
    <div id="toastContainer"></div>

    <div class="app-container">
        <!-- HOME SCREEN -->
        <div class="screen active" id="homeScreen">
            <div class="home-screen">
                <div class="logo-container">
                    <div class="crown-icon">👑</div>
                    <h1 class="title">ROYAL CHESS</h1>
                    <p class="subtitle">Play & Earn Arena</p>
                </div>

                <div class="stats-container">
                    <div class="stat-card"><div class="stat-value" id="level">1</div><div class="stat-label">Nivel</div></div>
                    <div class="stat-card"><div class="stat-value" id="totalXp">0</div><div class="stat-label">XP</div></div>
                    <div class="stat-card"><div class="stat-value" id="coins">💰 500</div><div class="stat-label">Monedas</div></div>
                </div>

                <!-- Botones secundarios -->
                <div style="display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;">
                    <button class="btn btn-secondary" onclick="startGame('local')">👥 2 LOCALES</button>
                    <button class="btn btn-secondary" onclick="showScreen('triviaScreen')">📚 TRIVIA</button>
                </div>
                <div style="display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;">
                    <button class="btn btn-secondary" onclick="showScreen('rankingScreen')">🏆 RANKING</button>
                    <button class="btn btn-secondary" onclick="showInstructions()">📚 CLASES</button>
                </div>
                <div style="display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;">
                    <button class="btn btn-secondary" onclick="openMultiplayerModal()">🌐 MULTIJUGADOR</button>
                </div>

                <!-- BOTÓN PLAY NOW AL FINAL, CENTRADO Y ÚNICO -->
                <button class="btn btn-play" onclick="startGame('ai')">⚔️ PLAY NOW</button>
            </div>
        </div>

        <!-- GAME SCREEN (se mantiene como antes) -->
        <div class="screen" id="gameScreen">
            <div class="game-screen">
                <div class="game-header">
                    <div class="player-info">
                        <div class="player-avatar silver" id="topAvatar">🤖</div>
                        <div><div class="player-name" id="topName">IA OPONENTE</div><div class="timer-display" id="aiTimer">10:00</div></div>
                    </div>
                    <div class="player-info">
                        <div class="player-avatar">👤</div>
                        <div><div class="player-name">TÚ</div><div class="timer-display" id="playerTimer">10:00</div></div>
                    </div>
                </div>
                <div class="board-container" id="boardContainer">
                    <canvas id="chessCanvas"></canvas>
                    <div class="combo-display" id="comboDisplay"></div>
                </div>
                <div class="game-footer">
                    <span class="energy-label">⚡</span>
                    <div class="energy-bar-container"><div class="energy-bar" id="energyBar" style="width:100%"></div></div>
                    <span class="energy-label" id="energyValue">100%</span>
                    <button class="btn-back" onclick="backToHome()">🏠 MENÚ</button>
                </div>
            </div>
        </div>

        <!-- TRIVIA SCREEN (sin cambios) -->
        <!-- ... -->
        <!-- RANKING SCREEN (sin cambios) -->
        <!-- ... -->
        <!-- MODALES DE INSTRUCCIONES (sin cambios) -->
        <!-- ... -->
    </div>

    <!-- MODAL MULTIJUGADOR -->
    <div class="modal-overlay" id="multiplayerModal">
        <div class="modal">
            <h2>🌐 Multijugador</h2>
            <button class="btn btn-secondary" onclick="createRoom()">🏠 Crear Sala</button>
            <div id="roomLinkDisplay" class="room-link" style="display:none;"></div>
            <hr style="border-color:rgba(255,215,0,0.2); margin:15px 0;">
            <input type="text" id="roomIdInput" placeholder="Código de sala">
            <button class="btn btn-secondary" onclick="joinRoom()">🔗 Unirse</button>
            <button class="btn-back" onclick="closeMultiplayerModal()" style="width:100%; margin-top:10px;">CERRAR</button>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
        import { getDatabase, ref, set, onValue, update } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';

        // ⚠️ REEMPLAZA ESTOS DATOS CON LOS DE TU PROYECTO FIREBASE (abajo te explico cómo)
        const firebaseConfig = {
            apiKey: "AIzaSyDummyKey123456789",
            authDomain: "tu-proyecto.firebaseapp.com",
            databaseURL: "https://tu-proyecto-default-rtdb.firebaseio.com",
            projectId: "tu-proyecto",
            storageBucket: "tu-proyecto.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abc123"
        };

        try {
            const app = initializeApp(firebaseConfig);
            const db = getDatabase(app);
            window.db = db;
            console.log('Firebase conectado');
        } catch (e) {
            console.warn('Firebase no configurado. El multijugador no funcionará.');
            window.db = null;
        }
    </script>

    <script>
        // ============ MULTIJUGADOR ============
        function openMultiplayerModal() {
            document.getElementById('multiplayerModal').classList.add('active');
        }
        function closeMultiplayerModal() {
            document.getElementById('multiplayerModal').classList.remove('active');
        }

        function generateRoomId() {
            return 'room_' + Math.random().toString(36).substr(2, 8);
        }

        async function createRoom() {
            if (!window.db) {
                alert('Firebase no está configurado. Sigue las instrucciones para activar el multijugador.');
                return;
            }
            const roomId = generateRoomId();
            const roomRef = ref(window.db, 'rooms/' + roomId);
            await set(roomRef, {
                board: chess.board,
                turn: 'w',
                white: getUserData().name,
                black: null,
                status: 'waiting'
            });
            document.getElementById('roomLinkDisplay').style.display = 'block';
            const link = `${window.location.origin}${window.location.pathname}?room=${roomId}`;
            document.getElementById('roomLinkDisplay').textContent = `Comparte este enlace: ${link}`;
            // Escuchar cambios
            listenToRoom(roomId, 'w');
        }

        async function joinRoom() {
            const roomId = document.getElementById('roomIdInput').value.trim();
            if (!roomId) return alert('Ingresa un código de sala');
            if (!window.db) return alert('Firebase no configurado.');
            const roomRef = ref(window.db, 'rooms/' + roomId);
            const snapshot = await new Promise(resolve => onValue(roomRef, resolve, { onlyOnce: true }));
            const room = snapshot.val();
            if (!room) return alert('Sala no encontrada');
            if (room.status !== 'waiting') return alert('Sala llena o en juego');
            await update(roomRef, { black: getUserData().name, status: 'playing' });
            listenToRoom(roomId, 'b');
            closeMultiplayerModal();
            startGame('multiplayer');
        }

        function listenToRoom(roomId, color) {
            const roomRef = ref(window.db, 'rooms/' + roomId);
            onValue(roomRef, (snapshot) => {
                const room = snapshot.val();
                if (!room) return;
                if (room.board && room.turn !== gameState.currentTurn) {
                    chess.board = room.board;
                    gameState.currentTurn = room.turn;
                    drawBoard();
                }
                if (room.status === 'finished') {
                    gameState.gameOver = true;
                    clearInterval(timerInterval);
                    alert(room.winner ? `${room.winner} gana!` : 'Partida terminada');
                }
            });
        }

        function sendMoveToFirebase() {
            if (!window.db || !currentRoomId) return;
            update(ref(window.db, 'rooms/' + currentRoomId), {
                board: chess.board,
                turn: gameState.currentTurn
            });
        }

        // ============ RESTO DEL CÓDIGO (AJEDREZ, CANVAS, TRIVIA, ETC.) ============
        // Se mantiene exactamente igual a tu versión anterior. Solo se agrega la llamada a sendMoveToFirebase() después de cada movimiento en partidas multijugador.
        // El código del juego no se modifica, excepto un pequeño ajuste en makeMove() para sincronizar Firebase.

        // ... (todo el código del juego, audio, trivia, ranking, etc. está incluido, pero no lo copio completo aquí por brevedad)
        // *** NOTA: EN EL ARCHIVO REAL DEBES INCLUIR TODO EL CÓDIGO ORIGINAL COMPLETO ***
        // Solo añade al final de la función makeMove() esta línea:
        // if (gameState.mode === 'multiplayer') sendMoveToFirebase();
    </script>
</body>
</html>
