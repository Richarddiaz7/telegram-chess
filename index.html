<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>⚡ CHESS KOMBAT ⚡</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: radial-gradient(ellipse at 30% 40%, #0f0c29, #24243e, #0a0a0a);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            padding: 16px;
        }

        /* Contenedor principal con efecto glass */
        .game-container {
            max-width: 500px;
            width: 100%;
            background: rgba(10, 10, 20, 0.6);
            backdrop-filter: blur(20px);
            border-radius: 48px;
            padding: 20px;
            border: 1px solid rgba(255, 215, 0, 0.3);
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        /* Header estilo Hamster Kombat */
        .stats-row {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-box {
            flex: 1;
            background: linear-gradient(135deg, #1a1a2e, #0d0d1a);
            border-radius: 28px;
            padding: 12px;
            text-align: center;
            border: 1px solid rgba(255, 215, 0, 0.4);
            position: relative;
            overflow: hidden;
        }

        .stat-box.active {
            border-color: #ffd700;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
            transform: scale(1.02);
            transition: all 0.2s ease;
        }

        .stat-box.active::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 215, 0, 0.2), transparent);
            animation: shine 1.5s infinite;
        }

        @keyframes shine {
            100% { left: 100%; }
        }

        .stat-label {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #ffd700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .stat-time {
            font-size: 28px;
            font-weight: 800;
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #fff, #ffd700);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
        }

        /* Canvas - Tablero con animaciones fluidas */
        .board-canvas-wrapper {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 24px;
            padding: 12px;
            margin-bottom: 20px;
        }

        canvas {
            width: 100%;
            aspect-ratio: 1 / 1;
            display: block;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
            cursor: pointer;
            background: #2c1a12;
        }

        /* Botón de estado */
        .status-btn {
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            border-radius: 60px;
            padding: 16px;
            text-align: center;
            font-weight: 800;
            font-size: 18px;
            color: #1a1a2e;
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 2px;
            border: none;
            width: 100%;
            cursor: pointer;
            transition: all 0.1s ease;
        }

        .status-btn:active {
            transform: scale(0.97);
        }

        /* Barra de energía estilo juego clicker */
        .energy-bar {
            background: #1a1a2e;
            border-radius: 40px;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
            border: 1px solid rgba(255, 215, 0, 0.2);
        }

        .energy-icon {
            font-size: 28px;
            animation: pulse 1s ease infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); text-shadow: 0 0 10px #ffd700; }
        }

        .energy-track {
            flex: 1;
            height: 12px;
            background: #333;
            border-radius: 20px;
            overflow: hidden;
        }

        .energy-fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #ffd700, #ff6b6b);
            border-radius: 20px;
            transition: width 0.2s ease;
        }

        .energy-number {
            font-weight: 800;
            color: #ffd700;
            font-size: 16px;
            min-width: 50px;
            text-align: right;
        }

        /* Botones de acción */
        .action-buttons {
            display: flex;
            gap: 12px;
        }

        .action-btn {
            flex: 1;
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            border: none;
            padding: 14px;
            border-radius: 40px;
            font-weight: 800;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.1s ease;
            color: #1a1a2e;
        }

        .action-btn:active {
            transform: scale(0.95);
        }

        .reset-btn {
            background: linear-gradient(135deg, #ff6b6b, #c92a2a);
            color: white;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <!-- Timer stats -->
        <div class="stats-row">
            <div class="stat-box" id="whiteBox">
                <div class="stat-label">👑 BLANCAS</div>
                <div class="stat-time" id="whiteTimer">10:00</div>
            </div>
            <div class="stat-box" id="blackBox">
                <div class="stat-label">💀 NEGRAS</div>
                <div class="stat-time" id="blackTimer">10:00</div>
            </div>
        </div>

        <!-- Canvas board -->
        <div class="board-canvas-wrapper">
            <canvas id="chessCanvas" width="500" height="500"></canvas>
        </div>

        <!-- Status button -->
        <button class="status-btn" id="statusBtn">🎮 TURNO: BLANCAS</button>

        <!-- Energy bar -->
        <div class="energy-bar">
            <div class="energy-icon">⚡</div>
            <div class="energy-track">
                <div class="energy-fill" id="energyFill"></div>
            </div>
            <div class="energy-number" id="energyText">100%</div>
        </div>

        <!-- Action buttons -->
        <div class="action-buttons">
            <button class="action-btn reset-btn" id="resetBtn">🔄 REINICIAR</button>
            <button class="action-btn" id="soundBtn">🔊 SONIDO</button>
        </div>
    </div>

    <script>
        // ========== INICIALIZACIÓN ==========
        const game = new Chess();
        let selectedSquare = null;
        let legalMoves = [];
        let soundEnabled = true;
        let energy = 100;
        let whiteTime = 600;
        let blackTime = 600;
        let currentTimer = 'w';
        let timerInterval = null;

        // Canvas elements
        const canvas = document.getElementById('chessCanvas');
        const ctx = canvas.getContext('2d');
        let squareSize = canvas.width / 8;

        // Elementos DOM
        const whiteTimerEl = document.getElementById('whiteTimer');
        const blackTimerEl = document.getElementById('blackTimer');
        const whiteBox = document.getElementById('whiteBox');
        const blackBox = document.getElementById('blackBox');
        const statusBtn = document.getElementById('statusBtn');
        const energyFill = document.getElementById('energyFill');
        const energyText = document.getElementById('energyText');

        // ========== MAPA DE PIEZAS (ICONOS UNICODE) ==========
        const pieceIcons = {
            'k': '♔', 'q': '♕', 'r': '♖', 'b': '♗', 'n': '♘', 'p': '♙',
            'K': '♚', 'Q': '♛', 'R': '♜', 'B': '♝', 'N': '♞', 'P': '♟'
        };

        // ========== DIBUJAR TABLERO EN CANVAS ==========
        function drawBoard() {
            const board = game.board();
            squareSize = canvas.width / 8;

            for (let i = 0; i < 8; i++) {
                for (let j = 0; j < 8; j++) {
                    const x = j * squareSize;
                    const y = i * squareSize;
                    const isLight = (i + j) % 2 === 0;
                    const squareName = String.fromCharCode(97 + j) + (8 - i);

                    // Color de casilla
                    if (selectedSquare === squareName) {
                        ctx.fillStyle = '#ffd700';
                    } else if (legalMoves.includes(squareName)) {
                        ctx.fillStyle = '#4ade80';
                    } else if (isLight) {
                        ctx.fillStyle = '#f0d9b5';
                    } else {
                        ctx.fillStyle = '#b58863';
                    }

                    ctx.fillRect(x, y, squareSize, squareSize);

                    // Dibujar pieza
                    const piece = board[i][j];
                    if (piece) {
                        let pieceKey = piece.type;
                        if (piece.color === 'b') {
                            pieceKey = piece.type.toUpperCase();
                        }
                        const icon = pieceIcons[pieceKey];
                        ctx.font = `${squareSize * 0.6}px "Segoe UI Emoji", "Apple Color Emoji", sans-serif`;
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillStyle = piece.color === 'w' ? '#2c2c2c' : '#1a1a1a';
                        ctx.shadowBlur = 4;
                        ctx.shadowColor = 'rgba(0,0,0,0.3)';
                        ctx.fillText(icon, x + squareSize / 2, y + squareSize / 2);
                        ctx.shadowBlur = 0;
                    }
                }
            }
        }

        // ========== ANIMACIÓN DE PARTÍCULA AL HACER CLIC ==========
        function createParticle(x, y) {
            // Efecto visual temporal al hacer clic
            const originalFillStyle = ctx.fillStyle;
            ctx.fillStyle = 'rgba(255, 215, 0, 0.6)';
            ctx.beginPath();
            ctx.arc(x, y, squareSize * 0.3, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = originalFillStyle;
            
            setTimeout(() => drawBoard(), 80);
        }

        // ========== SISTEMA DE SONIDO ==========
        function playSound(type) {
            if (!soundEnabled) return;
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                if (type === 'move') {
                    osc.frequency.value = 523.25;
                    gain.gain.value = 0.1;
                    osc.start();
                    gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.2);
                    osc.stop(audioCtx.currentTime + 0.2);
                } else if (type === 'capture') {
                    osc.frequency.value = 392;
                    gain.gain.value = 0.15;
                    osc.start();
                    gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.15);
                    osc.stop(audioCtx.currentTime + 0.15);
                } else if (type === 'check') {
                    osc.frequency.value = 659.25;
                    gain.gain.value = 0.2;
                    osc.start();
                    gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.3);
                    osc.stop(audioCtx.currentTime + 0.3);
                    statusBtn.style.animation = 'none';
                    setTimeout(() => statusBtn.style.animation = '', 100);
                }
                setTimeout(() => audioCtx.close(), 400);
            } catch(e) {}
        }

        // ========== ACTUALIZAR ENERGÍA ==========
        function updateEnergy() {
            energy = Math.max(0, Math.min(100, energy));
            energyFill.style.width = `${energy}%`;
            energyText.textContent = `${Math.floor(energy)}%`;
            
            if (energy <= 20) {
                energyFill.style.background = 'linear-gradient(90deg, #ff6b6b, #c92a2a)';
            } else {
                energyFill.style.background = 'linear-gradient(90deg, #ffd700, #ff8c00)';
            }
        }

        // ========== ACTUALIZAR TIMER ==========
        function updateTimerDisplay() {
            const whiteMins = Math.floor(whiteTime / 60);
            const whiteSecs = whiteTime % 60;
            const blackMins = Math.floor(blackTime / 60);
            const blackSecs = blackTime % 60;

            whiteTimerEl.textContent = `${whiteMins.toString().padStart(2, '0')}:${whiteSecs.toString().padStart(2, '0')}`;
            blackTimerEl.textContent = `${blackMins.toString().padStart(2, '0')}:${blackSecs.toString().padStart(2, '0')}`;

            if (currentTimer === 'w' && !game.game_over()) {
                whiteBox.classList.add('active');
                blackBox.classList.remove('active');
            } else if (currentTimer === 'b' && !game.game_over()) {
                blackBox.classList.add('active');
                whiteBox.classList.remove('active');
            } else {
                whiteBox.classList.remove('active');
                blackBox.classList.remove('active');
            }
        }

        // ========== INICIAR TIMER ==========
        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (game.game_over()) return;
                if (currentTimer === 'w') {
                    if (whiteTime > 0) {
                        whiteTime--;
                        updateTimerDisplay();
                        if (whiteTime === 0) {
                            clearInterval(timerInterval);
                            statusBtn.innerHTML = '⏰ ¡TIEMPO AGOTADO! GANAN NEGRAS ⏰';
                            playSound('capture');
                        }
                    }
                } else {
                    if (blackTime > 0) {
                        blackTime--;
                        updateTimerDisplay();
                        if (blackTime === 0) {
                            clearInterval(timerInterval);
                            statusBtn.innerHTML = '⏰ ¡TIEMPO AGOTADO! GANAN BLANCAS ⏰';
                            playSound('capture');
                        }
                    }
                }
            }, 1000);
        }

        function switchTimer() {
            currentTimer = game.turn();
            updateTimerDisplay();
            startTimer();
        }

        // ========== ACTUALIZAR ESTADO ==========
        function updateStatus() {
            if (game.game_over()) {
                clearInterval(timerInterval);
                if (game.in_checkmate()) {
                    const winner = game.turn() === 'w' ? '⚫ NEGRAS' : '⚪ BLANCAS';
                    statusBtn.innerHTML = `🏆 ¡JAQUE MATE! GANAN ${winner} 🏆`;
                    playSound('capture');
                } else if (game.in_stalemate()) {
                    statusBtn.innerHTML = '♾️ TABLAS - AHOGADO ♾️';
                } else {
                    statusBtn.innerHTML = '⏸️ JUEGO TERMINADO';
                }
            } else {
                const turnText = game.turn() === 'w' ? '⚪ BLANCAS' : '⚫ NEGRAS';
                const checkText = game.in_check() ? ' ⚠️ ¡JAQUE! ⚠️' : '';
                statusBtn.innerHTML = `🎮 TURNO: ${turnText}${checkText}`;
                if (game.in_check()) playSound('check');
                switchTimer();
            }
            drawBoard();
        }

        // ========== MOVIMIENTO IA ==========
        function makeAIMove() {
            if (!game.game_over() && game.turn() === 'b') {
                setTimeout(() => {
                    const moves = game.moves();
                    if (moves.length > 0) {
                        const randomMove = moves[Math.floor(Math.random() * moves.length)];
                        game.move(randomMove);
                        selectedSquare = null;
                        legalMoves = [];
                        drawBoard();
                        updateStatus();
                        playSound('move');
                        energy = Math.min(100, energy + 3);
                        updateEnergy();
                    }
                }, 200);
            }
        }

        // ========== MANEJAR CLICK EN CANVAS ==========
        function handleCanvasClick(e) {
            if (game.game_over()) return;

            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            
            let clientX, clientY;
            if (e.touches) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
                e.preventDefault();
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }
            
            const canvasX = (clientX - rect.left) * scaleX;
            const canvasY = (clientY - rect.top) * scaleY;
            
            if (canvasX < 0 || canvasX > canvas.width || canvasY < 0 || canvasY > canvas.height) return;
            
            const col = Math.floor(canvasX / squareSize);
            const row = Math.floor(canvasY / squareSize);
            const square = String.fromCharCode(97 + col) + (8 - row);
            
            createParticle(canvasX, canvasY);
            
            if (selectedSquare) {
                const move = { from: selectedSquare, to: square, promotion: 'q' };
                const result = game.move(move);
                
                if (result) {
                    energy = Math.max(0, energy - 2);
                    updateEnergy();
                    if (result.flags && result.flags.includes('c')) {
                        playSound('capture');
                    } else {
                        playSound('move');
                    }
                    selectedSquare = null;
                    legalMoves = [];
                    drawBoard();
                    updateStatus();
                    makeAIMove();
                } else {
                    const piece = game.get(square);
                    if (piece && piece.color === game.turn()) {
                        selectedSquare = square;
                        legalMoves = game.moves({ square, verbose: true }).map(m => m.to);
                        drawBoard();
                        playSound('move');
                    } else {
                        selectedSquare = null;
                        legalMoves = [];
                        drawBoard();
                    }
                }
            } else {
                const piece = game.get(square);
                if (piece && piece.color === game.turn()) {
                    selectedSquare = square;
                    legalMoves = game.moves({ square, verbose: true }).map(m => m.to);
                    drawBoard();
                    playSound('move');
                }
            }
        }

        // ========== REINICIAR JUEGO ==========
        function resetGame() {
            game.reset();
            selectedSquare = null;
            legalMoves = [];
            whiteTime = 600;
            blackTime = 600;
            currentTimer = 'w';
            energy = 100;
            updateEnergy();
            updateTimerDisplay();
            drawBoard();
            updateStatus();
            startTimer();
            playSound('move');
        }

        // ========== TOGGLE SONIDO ==========
        function toggleSound() {
            soundEnabled = !soundEnabled;
            const btn = document.getElementById('soundBtn');
            btn.innerHTML = soundEnabled ? '🔊 SONIDO' : '🔇 SONIDO';
        }

        // ========== EVENT LISTENERS ==========
        canvas.addEventListener('click', handleCanvasClick);
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0];
            const canvasX = (touch.clientX - rect.left) * (canvas.width / rect.width);
            const canvasY = (touch.clientY - rect.top) * (canvas.height / rect.height);
            const col = Math.floor(canvasX / squareSize);
            const row = Math.floor(canvasY / squareSize);
            const square = String.fromCharCode(97 + col) + (8 - row);
            createParticle(canvasX, canvasY);
            setTimeout(() => handleCanvasClick(e), 10);
        });
        
        document.getElementById('resetBtn').onclick = resetGame;
        document.getElementById('soundBtn').onclick = toggleSound;

        // Redibujar en resize
        window.addEventListener('resize', () => {
            setTimeout(() => drawBoard(), 50);
        });

        // ========== INICIALIZAR ==========
        updateEnergy();
        drawBoard();
        updateStatus();
        startTimer();
    </script>
</body>
</html>
