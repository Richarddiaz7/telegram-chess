<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>♔ Royal Chess Arena</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
        html, body { width: 100%; height: 100%; overflow: hidden; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0a0a1a; display: flex; justify-content: center; align-items: center; }
        .app-container { width: 100vw; height: 100vh; height: 100dvh; background: #0a0a2e; overflow: hidden; display: flex; flex-direction: column; max-width: 500px; margin: 0 auto; }
        .screen { display: none; width: 100%; height: 100%; flex-direction: column; }
        .screen.active { display: flex; }

        .home-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 20px; width: 100%; height: 100%; text-align: center; background: linear-gradient(180deg, rgba(10,10,46,0.65), rgba(26,26,78,0.8)), url('1779421764793.png') center center / cover no-repeat; }
        .game-screen { display: flex; flex-direction: column; height: 100%; background: linear-gradient(180deg, rgba(10,10,26,0.6), rgba(10,10,26,0.8)), url('1779422040370.png') center center / cover no-repeat; }
        .academy-screen { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 40px 20px; width: 100%; height: 100%; text-align: center; background: linear-gradient(180deg, rgba(10,10,46,0.7), rgba(26,26,78,0.9)); overflow-y: auto; }
        .ranking-screen { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 40px 20px; width: 100%; height: 100%; background: linear-gradient(180deg, rgba(10,10,46,0.7), rgba(26,26,78,0.9)); overflow-y: auto; }

        .crown-icon { font-size: 50px; filter: drop-shadow(0 0 25px rgba(255,215,0,0.6)); }
        .title { font-size: 28px; font-weight: 900; background: linear-gradient(45deg, #ffd700, #ffed4a, #daa520); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .user-badge { background: rgba(0,0,0,0.6); border: 1px solid rgba(255,215,0,0.3); padding: 10px 20px; border-radius: 30px; color: white; display: flex; flex-direction: column; align-items: center; gap: 4px; font-weight: bold; font-size: 14px; margin-bottom: 10px; min-width: 200px; }
        .points-display { color: #44ff44; font-size: 16px; font-weight: 900; }

        .btn { padding: 14px 30px; border: none; border-radius: 50px; font-size: 14px; font-weight: 700; cursor: pointer; text-transform: uppercase; width: 100%; max-width: 280px; transition: transform 0.1s; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn:active { transform: scale(0.95); }
        .btn-play { background: linear-gradient(135deg, #ffd700, #ff8c00); color: #1a1a2e; font-size: 18px; padding: 16px; box-shadow: 0 8px 25px rgba(255,140,0,0.5); }
        .btn-secondary { background: rgba(255,255,255,0.08); color: white; border: 1px solid rgba(255,215,0,0.25); }

        .game-header { display: flex; justify-content: space-between; padding: 8px; background: rgba(10,10,30,0.85); border-bottom: 1px solid rgba(255,215,0,0.2); min-height: 65px; align-items: center; }
        .player-info { display: flex; align-items: center; gap: 6px; color: white; flex: 1; }
        .player-name { font-size: 12px; font-weight: 600; color: #ffd700; }
        .turn-dot { width: 10px; height: 10px; border-radius: 50%; }
        .turn-dot.you { background: #44ff44; box-shadow: 0 0 10px #44ff44; }
        .turn-dot.opp { background: #555; }
        .board-container { flex: 1; display: flex; align-items: center; justify-content: center; padding: 5px; position: relative; }
        canvas { border-radius: 8px; box-shadow: 0 0 60px rgba(255,215,0,0.15); cursor: pointer; max-width: 100%; max-height: 100%; }
        .game-footer { display: flex; justify-content: space-between; padding: 10px; background: rgba(10,10,30,0.85); }
        .btn-back { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,215,0,0.2); color: #ffd700; padding: 8px 14px; border-radius: 18px; font-size: 11px; cursor: pointer; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 200; justify-content: center; align-items: center; }
        .modal.active { display: flex; }
        .modal-box { background: linear-gradient(135deg, #16163e, #2a2a5e); border: 2px solid rgba(255,215,0,0.4); border-radius: 16px; padding: 20px; max-width: 380px; width: 90%; color: white; }
        .room-card { background: rgba(0,0,0,0.4); border: 1px solid rgba(255,215,0,0.2); border-radius: 12px; padding: 12px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; width: 100%; cursor: pointer; }
        .setting-row { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .toggle-btn { background: #555; width: 50px; height: 26px; border-radius: 13px; position: relative; cursor: pointer; transition: 0.3s; }
        .toggle-btn.on { background: #44ff44; }
        .toggle-circle { width: 22px; height: 22px; background: white; border-radius: 50%; position: absolute; top: 2px; left: 2px; transition: 0.3s; }
        .toggle-btn.on .toggle-circle { left: 26px; }
        #academyMessage { position: absolute; top: 10px; background: rgba(0,0,0,0.9); color: #44ff44; padding: 10px; border-radius: 8px; border: 1px solid #44ff44; font-size: 13px; text-align: center; width: 90%; z-index: 10; display: none; }
        .trivia-btn { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,215,0,0.5); padding: 10px; border-radius: 8px; color: white; cursor: pointer; text-align: left; transition: background 0.2s; margin-bottom: 5px; }
        .trivia-btn:active { background: rgba(255,215,0,0.3); }
        .rank-item { background: rgba(255,255,255,0.1); padding: 10px; margin: 5px 0; border-radius: 10px; display: flex; justify-content: space-between; color: white; }
        .toast-notification { position: fixed; bottom: 20px; left: 20px; right: 20px; background: rgba(0,0,0,0.9); color: #ff4444; padding: 10px; border-radius: 8px; text-align: center; z-index: 300; font-weight: bold; display: none; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="screen active" id="homeScreen">
            <div class="home-screen">
                <div class="crown-icon">👑</div>
                <h1 class="title">ROYAL CHESS</h1>
                <div class="user-badge">
                    <span id="tgUsername">Cargando...</span>
                    <span class="points-display">⚡ <span id="tgPoints">0</span> PTS</span>
                </div>
                <button class="btn btn-play" onclick="playAI()">🤖 JUGAR VS IA</button>
                <button class="btn btn-secondary" onclick="playLocal()">👥 JUGAR LOCAL</button>
                <button class="btn btn-secondary" onclick="openLobby()">🌐 MULTIJUGADOR</button>
                <button class="btn btn-secondary" onclick="openAcademy()">🧠 ACADEMIA TUTOR</button>
                <button class="btn btn-secondary" onclick="showRanking()">🏆 RANKING</button>
                <button class="btn btn-secondary" onclick="openSettings()">⚙️ CONFIGURACIÓN</button>
            </div>
        </div>

        <div class="screen" id="settingsScreen">
            <div class="home-screen" style="justify-content: flex-start; padding-top: 40px;">
                <h1 class="title">⚙️ AJUSTES</h1>
                <div style="width: 100%; max-width: 300px; margin-top: 30px; background: rgba(0,0,0,0.5); padding: 20px; border-radius: 15px; border: 1px solid rgba(255,215,0,0.3);">
                    <div class="setting-row">
                        <span>🎵 Música de Fondo</span>
                        <div class="toggle-btn" id="toggleMusic" onclick="toggleAudio('bgm')"><div class="toggle-circle"></div></div>
                    </div>
                    <div class="setting-row" style="border-bottom:none;">
                        <span>🔊 Efectos de Sonido</span>
                        <div class="toggle-btn on" id="toggleSfx" onclick="toggleAudio('sfx')"><div class="toggle-circle"></div></div>
                    </div>
                </div>
                <button class="btn btn-secondary" onclick="goHome()" style="margin-top: auto; margin-bottom: 20px;">🏠 VOLVER</button>
            </div>
        </div>

        <div class="screen" id="gameScreen">
            <div class="game-screen">
                <div class="game-header">
                    <div class="player-info"><div><div class="player-name" id="topName">OPONENTE</div></div><div class="turn-dot opp" id="topTurn"></div></div>
                    <div class="player-info" style="justify-content: flex-end;"><div class="turn-dot you" id="bottomTurn"></div><div><div class="player-name" id="bottomName">TÚ</div></div></div>
                </div>
                <div class="board-container" id="boardContainer">
                    <div id="academyMessage">...</div>
                    <canvas id="chessCanvas"></canvas>
                </div>
                <div class="game-footer"><button class="btn-back" onclick="exitGame()">🏠 SALIR</button></div>
            </div>
        </div>

        <div class="screen" id="academyScreen">
            <div class="academy-screen">
                <div class="crown-icon">🧠</div><h1 class="title">ACADEMIA</h1>
                <p style="color:#aaa;font-size:12px;margin-bottom:20px;">Aprende Jugadas Maestras</p>
                <div id="lessonsContainer" style="width:100%; display:flex; flex-direction:column; gap:8px;"></div>
                <button class="btn btn-secondary" onclick="goHome()" style="margin-top: auto; margin-bottom: 20px;">🏠 VOLVER</button>
            </div>
        </div>

        <div class="screen" id="rankingScreen">
            <div class="ranking-screen">
                <h1 class="title">🏆 TOP JUGADORES</h1>
                <div id="rankingList" style="width:100%; max-width:350px; margin-top:20px;"></div>
                <button class="btn btn-secondary" onclick="goHome()" style="margin-top: auto; margin-bottom: 20px;">🏠 VOLVER</button>
            </div>
        </div>
    </div>

    <div class="modal" id="triviaModal">
        <div class="modal-box"><h2 id="triviaTitle">Trivia</h2><div style="border-bottom:1px solid rgba(255,215,0,0.2);margin:10px 0"></div><p id="triviaQuestion" style="font-size:16px;margin-bottom:15px"></p><div id="triviaOptions" style="display:flex;flex-direction:column;gap:8px"></div><button class="btn-back" onclick="closeTrivia()" style="width:100%;margin-top:15px">CANCELAR</button></div>
    </div>

    <div class="modal" id="lobbyModal">
        <div class="modal-box"><h2 style="color:#ffd700;text-align:center">🌐 Salas Activas</h2><button class="btn btn-secondary" onclick="createRoom()" style="margin-bottom:10px;width:100%">🏠 Crear Sala de Juego</button><div id="roomList" style="max-height:200px;overflow-y:auto"></div><button class="btn-back" onclick="closeLobby()" style="width:100%;margin-top:10px">CERRAR</button></div>
    </div>

    <div class="modal" id="resultModal">
        <div class="modal-box" style="text-align:center;">
            <h2 id="resultTitle" style="font-size:28px; margin-bottom:10px;"></h2>
            <p id="resultMessage" style="font-size:16px; margin-bottom:15px;"></p>
            <p id="resultPoints" style="color:#ffd700; font-weight:700;"></p>
            <button class="btn btn-play" onclick="closeResultModal()" style="margin-top:15px; width:100%;">CONTINUAR</button>
        </div>
    </div>
    <div id="toastNotification" class="toast-notification"></div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <script>
        // ============ TELEGRAM & PERFIL ============
        const tg = window.Telegram.WebApp; tg.expand();
        let userProfile = { id: "dev_123", name: "Jugador Local", points: 0 };
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            userProfile.id = String(tg.initDataUnsafe.user.id);
            userProfile.name = tg.initDataUnsafe.user.first_name;
        }

        // ============ SISTEMA DE AUDIO COMPLETO ============
        const audioSys = {
            sfxOn: true, bgmOn: false,
            click: new Audio('sounds/click.mp3'), move: new Audio('sounds/move.mp3'), capture: new Audio('sounds/capture.mp3'),
            check: new Audio('sounds/check.mp3'), checkmate: new Audio('sounds/checkmate.mp3'),
            victory: new Audio('sounds/victory.mp3'), defeat: new Audio('sounds/defeat.mp3'), bgm: new Audio('sounds/bgm.mp3')
        };
        audioSys.bgm.loop = true;

        function playSound(type) { if (!audioSys.sfxOn && type !== 'bgm') return; try { if (type === 'bgm') { if (audioSys.bgmOn) audioSys.bgm.play().catch(e=>{}); else audioSys.bgm.pause(); return; } audioSys[type].currentTime = 0; audioSys[type].play().catch(e=>{}); } catch(e) {} }
        function toggleAudio(type) { playSound('click'); if (type === 'bgm') { audioSys.bgmOn = !audioSys.bgmOn; document.getElementById('toggleMusic').className = audioSys.bgmOn ? 'toggle-btn on' : 'toggle-btn'; playSound('bgm'); } else { audioSys.sfxOn = !audioSys.sfxOn; document.getElementById('toggleSfx').className = audioSys.sfxOn ? 'toggle-btn on' : 'toggle-btn'; } }
        document.body.addEventListener('click', (e) => { if(e.target.closest('button') || e.target.closest('.room-card')) playSound('click'); });

        // ============ FIREBASE ============
        firebase.initializeApp({ apiKey: "AIzaSyDMu83hA5xjmwSlUX4KUgWkYlx6SqHcaAk", databaseURL: "https://royal-chess-multiplayer-default-rtdb.firebaseio.com" });
        const db = firebase.database();
        let rankingListener = null;

        db.ref('users/' + userProfile.id).once('value', (snap) => {
            if (snap.exists()) userProfile.points = snap.val().points || 0;
            else db.ref('users/' + userProfile.id).set({ name: userProfile.name, points: 0 });
            document.getElementById('tgUsername').innerText = userProfile.name;
            document.getElementById('tgPoints').innerText = userProfile.points;
        });

        function addPoints(amount) { userProfile.points += amount; document.getElementById('tgPoints').innerText = userProfile.points; db.ref('users/' + userProfile.id).update({ points: userProfile.points }); }
        function showToast(msg) { const t = document.getElementById('toastNotification'); t.innerText = msg; t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 2000); }

        // ============ DATOS ACADEMIA ============
        const academyData = { mate_pastor: { title: "Mate del Pastor", trivia: [ { q: "¿A qué casilla apunta el ataque directo en f7?", opts: ["Alfil", "Caballo", "Reina", "Rey"], ans: 2 }, { q: "¿Cuántos movimientos se necesitan para este mate?", opts: ["2", "3", "4", "5"], ans: 2 } ], steps: [ { msg: "1. Mueve el peón de Rey a e4.", fr:6, fc:4, tr:4, tc:4, opp:{fr:1, fc:4, tr:3, tc:4} }, { msg: "2. Desarrolla el Alfil a c4.", fr:7, fc:5, tr:4, tc:2, opp:{fr:0, fc:1, tr:2, tc:2} }, { msg: "3. Saca tu Reina a h5.", fr:7, fc:3, tr:3, tc:7, opp:{fr:0, fc:6, tr:2, tc:5} }, { msg: "4. ¡Captura en f7 para dar Mate!", fr:3, fc:7, tr:1, tc:5, end:true } ] } };

        // ============ ESTADO GLOBAL ============
        const gs = { mode:'ai', roomId:null, role:'w', viewBlack:false, turn:'w', sel:null, lessonId:null, lessonStep:0, currentTriviaIndex:0, over:false, academyLock:false };

        // ============ MOTOR AJEDREZ (CORREGIDO) ============
        const chess = {
            board:[],
            init(){ this.board = [['r','n','b','q','k','b','n','r'],['p','p','p','p','p','p','p','p'],['','','','','','','',''],['','','','','','','',''],['','','','','','','',''],['','','','','','','',''],['P','P','P','P','P','P','P','P'],['R','N','B','Q','K','B','N','R']]; },
            getPiece(r,c){ return this.board[r]?.[c]||''; },
            inCheck(c){const k=c==='w'?'K':'k';let kr=-1,kc=-1;for(let r=0;r<8;r++)for(let cc=0;cc<8;cc++)if(this.board[r][cc]===k){kr=r;kc=cc;}if(kr===-1)return false;for(let r=0;r<8;r++)for(let cc=0;cc<8;cc++){const p=this.board[r][cc];if(p&&((c==='w'&&p===p.toLowerCase())||(c==='b'&&p===p.toUpperCase())))if(this.isValid(r,cc,kr,kc))return true;}return false;},
            hasMoves(c){for(let r=0;r<8;r++)for(let cc=0;cc<8;cc++){const p=this.board[r][cc];if((c==='w'&&p&&p===p.toUpperCase())||(c==='b'&&p&&p===p.toLowerCase()))for(let tr=0;tr<8;tr++)for(let tc=0;tc<8;tc++)if(this.isValid(r,cc,tr,tc)){const sv=this.board[tr][tc];this.board[tr][tc]=p;this.board[r][cc]='';if(!this.inCheck(c)){this.board[r][cc]=p;this.board[tr][tc]=sv;return true;}this.board[r][cc]=p;this.board[tr][tc]=sv;}}return false;},
            isValid(fr,fc,tr,tc){
                const p=this.getPiece(fr,fc), tgt=this.getPiece(tr,tc);
                if(!p || (tgt && ((p===p.toUpperCase()&&tgt===tgt.toUpperCase())||(p===p.toLowerCase()&&tgt===tgt.toLowerCase())))) return false;
                const type=p.toLowerCase(), rd=tr-fr, cd=tc-fc, ard=Math.abs(rd), acd=Math.abs(cd);
                const cp=(dr,dc)=>{const s=Math.max(Math.abs(dr),Math.abs(dc)),sr=dr===0?0:dr/Math.abs(dr),sc=dc===0?0:dc/Math.abs(dc);for(let i=1;i<s;i++)if(this.getPiece(fr+sr*i,fc+sc*i))return false;return true;};
                switch(type){case'p':const d=p==='P'?-1:1,sr=p==='P'?6:1;if(cd===0&&!tgt){if(rd===d)return true;if(fr===sr&&rd===2*d&&!this.getPiece(fr+d,fc))return true;}return acd===1&&rd===d&&!!tgt;case'r':return(rd===0||cd===0)&&cp(rd,cd);case'n':return(ard===2&&acd===1)||(ard===1&&acd===2);case'b':return ard===acd&&cp(rd,cd);case'q':return(rd===0||cd===0||ard===acd)&&cp(rd,cd);case'k':return ard<=1&&acd<=1;}return false;
            },
            aiMove(){
                const moves=[];
                for(let r=0;r<8;r++)for(let c=0;c<8;c++){const p=this.board[r][c];if(p&&p===p.toLowerCase())for(let tr=0;tr<8;tr++)for(let tc=0;tc<8;tc++)if(this.isValid(r,c,tr,tc)){const sv=this.board[tr][tc];this.board[tr][tc]=p;this.board[r][c]='';if(!this.inCheck('b')){let sc=sv?(sv.toUpperCase()==='Q'?9:sv.toUpperCase()==='R'?5:'BN'.includes(sv.toUpperCase())?3:1):0;moves.push({fr:r,fc:c,tr,tc,score:sc});}this.board[r][c]=p;this.board[tr][tc]=sv;}}
                if(!moves.length)return null;
                moves.sort((a,b)=>b.score-a.score);
                return Math.random()<0.7 ? moves[0] : moves[Math.floor(Math.random()*Math.min(5,moves.length))];
            },
            move(fr,fc,tr,tc){ const p=this.getPiece(fr,fc), tgt=this.getPiece(tr,tc); this.board[tr][tc]=p; this.board[fr][fc]=''; if(tgt) playSound('capture'); else playSound('move'); return tgt; }
        };

        // ============ RENDERIZADO ============
        const canvas=document.getElementById('chessCanvas'), ctx=canvas.getContext('2d');
        let B=0, S=0;
        function resize(){const c=document.getElementById('boardContainer'); B=Math.floor(Math.min(c.clientWidth,c.clientHeight)*0.98); S=B/8; canvas.width=B; canvas.height=B; draw();}
        const SYM={K:'♔',Q:'♕',R:'♖',B:'♗',N:'♘',P:'♙',k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟'};

        function draw(){
            ctx.clearRect(0,0,B,B);
            for(let r=0;r<8;r++)for(let c=0;c<8;c++){
                let dr=r,dc=c; if(gs.viewBlack){dr=7-r;dc=7-c;}
                const x=dc*S, y=dr*S, light=(r+c)%2===0;
                ctx.fillStyle = light ? '#f5deb3' : '#8b6914'; ctx.fillRect(x,y,S,S);
            }
            if(gs.mode==='academy' && academyData[gs.lessonId]){
                const step=academyData[gs.lessonId].steps[gs.lessonStep];
                if(step){
                    let sc=gs.viewBlack?7-step.fc:step.fc, sr=gs.viewBlack?7-step.fr:step.fr;
                    let tc=gs.viewBlack?7-step.tc:step.tc, tr=gs.viewBlack?7-step.tr:step.tr;
                    ctx.fillStyle='rgba(68,255,68,0.4)'; ctx.fillRect(sc*S,sr*S,S,S);
                    ctx.strokeStyle='#00ffff'; ctx.lineWidth=3; ctx.strokeRect(tc*S+2,tr*S+2,S-4,S-4);
                }
            }
            if(gs.sel){let r=gs.sel.row,c=gs.sel.col; if(gs.viewBlack){r=7-r;c=7-c;} ctx.fillStyle='rgba(255,215,0,0.4)'; ctx.fillRect(c*S,r*S,S,S);}
            for(let r=0;r<8;r++)for(let c=0;c<8;c++){
                const p=chess.getPiece(r,c); if(!p)continue;
                let dr=r,dc=c; if(gs.viewBlack){dr=7-r;dc=7-c;}
                const cx=dc*S+S/2, cy=dr*S+S/2, isW=p===p.toUpperCase(), R=S*0.4;
                ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2);
                const g=ctx.createRadialGradient(cx-R*0.3,cy-R*0.3,R*0.05,cx,cy,R);
                isW?(g.addColorStop(0,'#fff'),g.addColorStop(1,'#aaa')):(g.addColorStop(0,'#666'),g.addColorStop(1,'#000'));
                ctx.fillStyle=g; ctx.fill(); ctx.strokeStyle=isW?'#888':'#333'; ctx.lineWidth=2; ctx.stroke();
                ctx.fillStyle=isW?'#000':'#fff'; ctx.font=`bold ${S*0.7}px Arial`; ctx.textAlign='center'; ctx.textBaseline='middle';
                ctx.fillText(SYM[p],cx,cy+2);
            }
        }

        function showResultModal(title, message, points) { document.getElementById('resultTitle').innerText = title; document.getElementById('resultMessage').innerText = message; document.getElementById('resultPoints').innerText = points ? `+${points} PTS` : ''; document.getElementById('resultModal').classList.add('active'); }
        function closeResultModal() { document.getElementById('resultModal').classList.remove('active'); exitGame(); }

        // ============ LÓGICA DE FIN DE JUEGO (CORREGIDA) ============
        function checkGameEnd() {
            const currentTurn = gs.turn;
            const inCheck = chess.inCheck(currentTurn);
            const hasMoves = chess.hasMoves(currentTurn);

            if (inCheck && !hasMoves) {
                playSound('checkmate');
                gs.over = true;
                const winnerColor = currentTurn === 'w' ? 'Negras' : 'Blancas';
                if (gs.mode === 'ai') {
                    if (currentTurn === 'b') { playSound('victory'); addPoints(10); showResultModal('🏆 ¡Victoria!', 'Has derrotado a la IA con Jaque Mate.', 10); }
                    else { playSound('defeat'); showResultModal('💀 Derrota', 'La IA te ha dado Jaque Mate.', 0); }
                } else if (gs.mode === 'local') {
                    addPoints(5); playSound('victory');
                    showResultModal('🏆 ¡Jaque Mate!', `${winnerColor} ganan la partida.`, 5);
                } else if (gs.mode === 'multi') {
                    if (currentTurn === gs.role) { playSound('defeat'); showResultModal('💀 Derrota', 'Tu oponente te ha dado Jaque Mate.', 0); }
                    else { playSound('victory'); addPoints(15); showResultModal('🏆 ¡Victoria!', 'Has derrotado a tu oponente con Jaque Mate.', 15); }
                    db.ref('rooms/' + gs.roomId).update({ status: 'finished', winner: currentTurn === 'w' ? 'b' : 'w' });
                }
                return true;
            } else if (!hasMoves) {
                playSound('defeat'); gs.over = true;
                showResultModal('🤝 Tablas', 'La partida termina en ahogado.', 0);
                return true;
            } else if (inCheck) { playSound('check'); }
            return false;
        }

        // ============ LÓGICA DE MOVIMIENTO UNIFICADA ============
        function tryMove(fr, fc, tr, tc) {
            const movingPiece = chess.board[fr][fc];
            const capturedPiece = chess.board[tr][tc];
            
            chess.board[tr][tc] = movingPiece;
            chess.board[fr][fc] = '';

            const currentPlayerColor = gs.turn; // 'w' o 'b'
            if (chess.inCheck(currentPlayerColor)) {
                // Revertir movimiento ilegal
                chess.board[fr][fc] = movingPiece;
                chess.board[tr][tc] = capturedPiece;
                showToast("Movimiento ilegal: No puedes poner a tu rey en jaque.");
                return false;
            }
            // Movimiento legal, confirmar
            chess.move(fr, fc, tr, tc);
            return true;
        }

        canvas.addEventListener('click', (e) => {
            if (gs.over || gs.academyLock) return;
            if (gs.mode === 'multi' && gs.roomId && gs.turn !== gs.role) return;
            if (gs.mode === 'ai' && gs.turn !== 'w') return;

            const rect = canvas.getBoundingClientRect();
            let c = Math.floor((e.clientX - rect.left) / S), r = Math.floor((e.clientY - rect.top) / S);
            if (gs.viewBlack) { r = 7 - r; c = 7 - c; }
            const p = chess.getPiece(r, c);

            if (gs.sel) {
                if (gs.mode === 'academy') {
                    const step = academyData[gs.lessonId].steps[gs.lessonStep];
                    if (gs.sel.row === step.fr && gs.sel.col === step.fc && r === step.tr && c === step.tc) {
                        chess.move(step.fr, step.fc, step.tr, step.tc);
                        gs.sel = null; draw();
                        if (step.end) { document.getElementById('academyMessage').innerText = "¡Mate Conseguido! Lección Completada. +10 PTS"; addPoints(10); setTimeout(goHome, 3000); }
                        else { gs.academyLock = true; setTimeout(() => { chess.move(step.opp.fr, step.opp.fc, step.opp.tr, step.opp.tc); gs.lessonStep++; gs.turn = 'w'; updateAcademyMessage(); gs.academyLock = false; draw(); }, 800); }
                    } else { gs.sel = null; draw(); }
                    return;
                }

                if (chess.isValid(gs.sel.row, gs.sel.col, r, c)) {
                    if (tryMove(gs.sel.row, gs.sel.col, r, c)) {
                        gs.sel = null;
                        const nextTurn = gs.turn === 'w' ? 'b' : 'w';
                        gs.turn = nextTurn;
                        draw();
                        
                        if (gs.mode === 'multi' && gs.roomId) {
                            db.ref('rooms/' + gs.roomId).update({ board: chess.board, turn: nextTurn });
                        }
                        
                        checkGameEnd();
                        
                        if (gs.mode === 'ai' && gs.turn === 'b' && !gs.over) {
                            setTimeout(() => {
                                const m = chess.aiMove();
                                if (m) {
                                    if (tryMove(m.fr, m.fc, m.tr, m.tc)) {
                                        gs.turn = 'w';
                                        draw();
                                        checkGameEnd();
                                    }
                                }
                            }, 500);
                        }
                    } else {
                        gs.sel = null;
                        draw();
                    }
                } else {
                    if (p && ((gs.turn === 'w' && p === p.toUpperCase()) || (gs.turn === 'b' && p === p.toLowerCase()))) gs.sel = {row:r, col:c};
                    else gs.sel = null;
                }
            } else {
                if (gs.mode === 'academy') { if (p && p === p.toUpperCase()) gs.sel = {row:r, col:c}; }
                else { if (p && ((gs.turn === 'w' && p === p.toUpperCase()) || (gs.turn === 'b' && p === p.toLowerCase()))) gs.sel = {row:r, col:c}; }
            }
            draw();
        });

        function updateTurns() { const mt = (gs.mode === 'multi') ? (gs.turn === gs.role) : (gs.turn === 'w'); document.getElementById('bottomTurn').className = mt ? 'turn-dot you' : 'turn-dot opp'; document.getElementById('topTurn').className = mt ? 'turn-dot opp' : 'turn-dot you'; }

        function showScreen(id) { document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active')); document.getElementById(id).classList.add('active'); if(id==='gameScreen') resize(); if(id !== 'rankingScreen' && rankingListener) { db.ref('users').off('value', rankingListener); rankingListener = null; } }
        function goHome() { gs.over = true; document.getElementById('academyMessage').style.display = 'none'; if (rankingListener) { db.ref('users').off('value', rankingListener); rankingListener = null; } showScreen('homeScreen'); }
        function openSettings() { showScreen('settingsScreen'); }
        function playAI() { gs.mode='ai'; gs.roomId=null; gs.viewBlack=false; gs.turn='w'; gs.over=false; chess.init(); document.getElementById('topName').innerText="BOT (IA) ⚫"; document.getElementById('bottomName').innerText=userProfile.name+" ⚪"; updateTurns(); showScreen('gameScreen'); }
        function playLocal() { gs.mode='local'; gs.roomId=null; gs.viewBlack=false; gs.turn='w'; gs.over=false; chess.init(); document.getElementById('topName').innerText="RIVAL LOCAL"; document.getElementById('bottomName').innerText=userProfile.name+" (Blancas)"; updateTurns(); showScreen('gameScreen'); }

        const lessons = [{ id:'mate_pastor', name:'💥 El Mate del Pastor', desc:'Supera la trivia y domina la apertura.' }];
        function openAcademy() { showScreen('academyScreen'); document.getElementById('lessonsContainer').innerHTML = lessons.map(l=>`<div class="room-card" onclick="startLesson('${l.id}')" style="flex-direction:column;align-items:flex-start"><div style="font-weight:700;color:#ffd700">${l.name}</div><div style="font-size:12px;color:#bbb;margin-top:5px">${l.desc}</div></div>`).join(''); }
        function startLesson(id) { gs.lessonId=id; gs.currentTriviaIndex=0; document.getElementById('triviaTitle').innerText=academyData[id].title; showTriviaQuestion(); document.getElementById('triviaModal').classList.add('active'); }
        function closeTrivia() { document.getElementById('triviaModal').classList.remove('active'); }
        function showTriviaQuestion() { const t=academyData[gs.lessonId].trivia[gs.currentTriviaIndex]; document.getElementById('triviaQuestion').innerText=t.q; const optsDiv=document.getElementById('triviaOptions'); optsDiv.innerHTML=''; t.opts.forEach((opt,idx)=>{ optsDiv.innerHTML+=`<button class="trivia-btn" onclick="checkTrivia(${idx})">${opt}</button>`; }); }
        function checkTrivia(idx) { const t=academyData[gs.lessonId].trivia[gs.currentTriviaIndex]; if(idx===t.ans){ gs.currentTriviaIndex++; if(gs.currentTriviaIndex<academyData[gs.lessonId].trivia.length) showTriviaQuestion(); else{ closeTrivia(); enterAcademyBoard(); } } else alert("Respuesta incorrecta. ¡Intenta de nuevo!"); }
        function enterAcademyBoard() { gs.mode='academy'; gs.viewBlack=false; gs.lessonStep=0; gs.turn='w'; gs.academyLock = false; chess.init(); document.getElementById('topName').innerText="TUTOR"; document.getElementById('bottomName').innerText="ESTUDIANTE"; showScreen('gameScreen'); document.getElementById('academyMessage').style.display='block'; updateAcademyMessage(); draw(); }
        function updateAcademyMessage() { const step=academyData[gs.lessonId].steps[gs.lessonStep]; if(step) document.getElementById('academyMessage').innerText=step.msg; }

        function showRanking() { showScreen('rankingScreen'); const list = document.getElementById('rankingList'); list.innerHTML = 'Cargando...'; if (rankingListener) db.ref('users').off('value', rankingListener); rankingListener = db.ref('users').orderByChild('points').limitToLast(10).on('value', snap => { list.innerHTML = ''; const users = []; snap.forEach(child => { users.push({ name: child.val().name || 'Jugador', points: child.val().points || 0 }); }); users.sort((a, b) => b.points - a.points); users.forEach((u, i) => { list.innerHTML += `<div class="rank-item"><span>${i+1}. ${u.name}</span><span>${u.points} pts</span></div>`; }); if (users.length === 0) list.innerHTML = '<p style="color:#888;">No hay jugadores aún.</p>'; }); }

        function openLobby() { document.getElementById('lobbyModal').classList.add('active'); db.ref('rooms').on('value', snap=>{ const list=document.getElementById('roomList'); list.innerHTML=''; snap.forEach(child=>{ const room=child.val(); if(room.status==='waiting') list.innerHTML+=`<div class="room-card"><span class="room-name">Sala de ${room.white}</span><button class="btn-secondary" onclick="joinRoom('${child.key}')">UNIRSE</button></div>`; }); }); }
        function closeLobby() { document.getElementById('lobbyModal').classList.remove('active'); db.ref('rooms').off(); }
        function createRoom() { const name=userProfile.name; const ref=db.ref('rooms').push(); gs.roomId=ref.key; gs.mode='multi'; gs.role='w'; gs.viewBlack=false; gs.over=false; chess.init(); ref.onDisconnect().remove(); ref.set({white:name,status:'waiting',turn:'w',board:chess.board}); closeLobby(); listenRoom(gs.roomId); }
        function joinRoom(id) { const name=userProfile.name; gs.roomId=id; gs.mode='multi'; gs.role='b'; gs.viewBlack=true; gs.over=false; db.ref('rooms/'+id).onDisconnect().remove(); db.ref('rooms/'+id).update({black:name,status:'playing'}).then(()=>{ closeLobby(); listenRoom(id); }); }
        function listenRoom(id) { db.ref('rooms/'+id).on('value', snap=>{ const room=snap.val(); if(!room){ alert('Partida terminada.'); exitGame(); return; } if(room.status==='playing'){ if(room.board && room.turn) { chess.board=room.board; gs.turn=room.turn; updateTurns(); showScreen('gameScreen'); draw(); checkGameEnd(); } } if(room.status==='finished'){ alert(room.winner===gs.role?'¡Ganaste!':'¡Perdiste!'); exitGame(); } }); }
        function exitGame() { if(gs.mode==='multi'&&gs.roomId){ db.ref('rooms/'+gs.roomId).remove(); db.ref('rooms/'+gs.roomId).off(); gs.roomId=null; } goHome(); }

        window.addEventListener('resize', resize);
    </script>
</body>
