<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>♔ CHESS MASTERS - Edición Realista ♚</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(135deg, #1a0f0a 0%, #0d0705 100%);
            min-height: 100vh;
            font-family: 'Poppins', 'Segoe UI', system-ui, sans-serif;
            overflow-x: hidden;
        }

        /* Pantallas */
        .screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-y: auto;
            overflow-x: hidden;
        }

        .screen-hidden {
            transform: translateX(100%);
            pointer-events: none;
        }

        .screen-visible {
            transform: translateX(0);
            pointer-events: auto;
        }

        /* ========== HOME REALISTA ========== */
        #homeScreen {
            background: radial-gradient(ellipse at 30% 40%, #2a1a12, #0a0604);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Marco de madera para el logo */
        .logo-frame {
            background: linear-gradient(145deg, #8b5a2b, #5c3a1a);
            border-radius: 60px;
            padding: 30px 50px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.2);
            margin-bottom: 40px;
            animation: woodGlow 3s ease infinite;
        }

        @keyframes woodGlow {
            0%, 100% { box-shadow: 0 20px 40px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.2); }
            50% { box-shadow: 0 20px 50px rgba(218, 165, 32, 0.3), inset 0 1px 0 rgba(255,255,255,0.2); }
        }

        .main-logo {
            font-size: 90px;
            filter: drop-shadow(4px 6px 8px rgba(0,0,0,0.5));
        }

        .game-title {
            font-size: 38px;
            font-weight: 800;
            background: linear-gradient(135deg, #e8c97a, #c9a03d);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: 3px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        /* Botón PLAY tallado */
        .play-btn {
            background: linear-gradient(145deg, #d4a55a, #8b5a2b);
            border: none;
            width: 220px;
            padding: 18px;
            border-radius: 50px;
            font-size: 24px;
            font-weight: 800;
            color: #1a0f0a;
            margin: 20px 0;
            cursor: pointer;
            transition: all 0.1s ease;
            box-shadow: 0 8px 0 #4a2a10, 0 10px 30px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .play-btn:active {
            transform: translateY(4px);
            box-shadow: 0 4px 0 #4a2a10;
        }

        .home-buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .home-btn {
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(218, 165, 32, 0.4);
            padding: 12px 24px;
            border-radius: 40px;
            color: #e8c97a;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        /* ========== JUEGO - TABLERO REALISTA ========== */
        #gameScreen {
            background: #0a0604;
            padding: 15px;
            display: flex;
            flex-direction: column;
        }

        /* Header elegante */
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .back-btn {
            background: rgba(139, 90, 43, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(218, 165, 32, 0.4);
            width: 44px;
            height: 44px;
            border-radius: 30px;
            font-size: 22px;
            cursor: pointer;
            color: #e8c97a;
        }

        /* Relojes estilo madera */
        .timer-compact {
            background: linear-gradient(145deg, #3a2518, #1f140a);
            border-radius: 40px;
            padding: 8px 20px;
            display: flex;
            gap: 20px;
            border: 1px solid rgba(218, 165, 32, 0.3);
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.5), 0 4px 8px rgba(0,0,0,0.3);
        }

        .timer-item {
            text-align: center;
        }

        .timer-label {
            font-size: 10px;
            color: #e8c97a;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .timer-value {
            font-size: 20px;
            font-weight: 800;
            font-family: 'Courier New', monospace;
            color: #f0e6c5;
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
        }

        /* Barra de energía con efecto vidrio */
        .energy-compact {
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
            border-radius: 40px;
            padding: 8px 18px;
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid rgba(218, 165, 32, 0.3);
        }

        /* TABLERO - EFECTO 3D REALISTA */
        .board-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 800px;
            margin: 10px 0;
        }

        canvas {
            width: min(82vw, 82vh);
            height: min(82vw, 82vh);
            display: block;
            border-radius: 16px;
            box-shadow: 0 25px 45px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.1);
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        canvas:active {
            transform: scale(0.98);
        }

        /* Orientación horizontal */
        @media (orientation: landscape) {
            #gameScreen {
                flex-direction: row;
                gap: 15px;
            }
            .game-header {
                flex-direction: column;
                width: auto;
                margin-bottom: 0;
            }
            .board-wrapper {
                flex: 2;
            }
            canvas {
                width: min(60vh, 60vw);
                height: min(60vh, 60vw);
            }
            .right-panel {
                flex: 1;
                display: flex;
                flex-direction: column;
                gap: 15px;
            }
        }

        .game-controls {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .game-btn {
            flex: 1;
            background: linear-gradient(145deg, #d4a55a, #8b5a2b);
            border: none;
            padding: 12px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            box-shadow: 0 3px 0 #4a2a10;
            transition: all 0.05s linear;
        }

        .game-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #4a2a10;
        }

        .game-btn.reset {
            background: linear-gradient(145deg, #8b3a2a, #5a2010);
            color: #f0d9b5;
        }

        #statusText {
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);
            border-radius: 40px;
            padding: 12px;
            text-align: center;
            font-size: 14px;
            font-weight: 600;
            color: #e8c97a;
            border: 1px solid rgba(218, 165, 32, 0.3);
        }

        /* ========== INSTRUCCIONES ========== */
        #instructionsScreen, #comingScreen {
            background: linear-gradient(135deg, #1a0f0a, #0a0604);
            padding: 20px;
        }

        .instructions-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .instructions-title {
            font-size: 28px;
            font-weight: 800;
            color: #e8c97a;
        }

        .moves-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
        }

        .move-card {
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 15px;
            text-align: center;
            border: 1px solid rgba(218, 165, 32, 0.2);
        }

        .move-icon {
            font-size: 42px;
            filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.5));
        }

        .move-name {
            color: #e8c97a;
            font-weight: 700;
            margin: 8px 0;
        }

        /* Próximamente */
        .coming-icon {
            font-size: 80px;
            margin-bottom: 20px;
        }

        .coming-title {
            font-size: 32px;
            font-weight: 800;
            color: #e8c97a;
        }
    </style>
</head>
<body>
    <!-- HOME -->
    <div id="homeScreen" class="screen screen-visible">
        <div class="logo-frame">
            <div class="main-logo">♔</div>
            <div class="game-title">CHESS MASTERS</div>
        </div>
        <button class="play-btn" id="playBtn">▶ PLAY</button>
        <div class="home-buttons">
            <button class="home-btn" id="instructionsHomeBtn">📖 MASTER MOVES</button>
            <button class="home-btn" id="comingHomeBtn">🔜 PRÓXIMAMENTE</button>
        </div>
    </div>

    <!-- JUEGO -->
    <div id="gameScreen" class="screen screen-hidden">
        <div class="game-header">
            <button class="back-btn" id="backFromGameBtn">←</button>
            <div class="timer-compact">
                <div class="timer-item"><div class="timer-label">⚪ BLANCAS</div><div class="timer-value" id="whiteTimer">10:00</div></div>
                <div class="timer-item"><div class="timer-label">⚫ NEGRAS</div><div class="timer-value" id="blackTimer">10:00</div></div>
            </div>
            <div class="energy-compact"><span>⚡</span><span id="energyValue">100</span><span>%</span></div>
        </div>
        <div class="board-wrapper"><canvas id="chessCanvas" width="600" height="600"></canvas></div>
        <div class="right-panel">
            <div id="statusText">🎮 Turno: Blancas</div>
            <div class="game-controls">
                <button class="game-btn reset" id="resetGameBtn">🔄 Reiniciar</button>
                <button class="game-btn" id="soundGameBtn">🔊 Sonido</button>
            </div>
        </div>
    </div>

    <!-- INSTRUCCIONES -->
    <div id="instructionsScreen" class="screen screen-hidden">
        <div class="instructions-header">
            <button class="back-btn" id="backFromInstructionsBtn">←</button>
            <div class="instructions-title">JUGADAS MAESTRAS</div>
        </div>
        <div class="moves-grid">
            <div class="move-card"><div class="move-icon">♔</div><div class="move-name">Apertura Italiana</div></div>
            <div class="move-card"><div class="move-icon">♕</div><div class="move-name">Apertura Española</div></div>
            <div class="move-card"><div class="move-icon">♖</div><div class="move-name">Enroque</div></div>
            <div class="move-card"><div class="move-icon">♝</div><div class="move-name">Alfil de Rey</div></div>
            <div class="move-card"><div class="move-icon">♞</div><div class="move-name">Caballo a f3</div></div>
            <div class="move-card"><div class="move-icon">♟</div><div class="move-name">Peón al centro</div></div>
        </div>
    </div>

    <!-- PRÓXIMAMENTE -->
    <div id="comingScreen" class="screen screen-hidden">
        <button class="back-btn" id="backFromComingBtn" style="position:absolute;top:20px;left:20px;">←</button>
        <div style="display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:100vh;">
            <div class="coming-icon">🎮</div>
            <div class="coming-title">PRÓXIMAMENTE</div>
            <div style="color:rgba(255,255,255,0.7);margin:20px;text-align:center;">
                ⚡ Modo Torneo<br>🏆 Ranking Global<br>👥 Jugar con Amigos<br>💰 Recompensas
            </div>
            <button class="play-btn" id="volverHomeBtn" style="width:auto;padding:12px 30px;font-size:16px;">Volver</button>
        </div>
    </div>

    <script>
        // Navegación
        const screens = {
            home: document.getElementById('homeScreen'),
            game: document.getElementById('gameScreen'),
            instructions: document.getElementById('instructionsScreen'),
            coming: document.getElementById('comingScreen')
        };
        function showScreen(name) {
            Object.keys(screens).forEach(k => {
                screens[k].classList.add('screen-hidden');
                screens[k].classList.remove('screen-visible');
            });
            screens[name].classList.remove('screen-hidden');
            screens[name].classList.add('screen-visible');
            if (name === 'game') setTimeout(() => { resizeCanvas(); drawBoard(); }, 100);
        }
        document.getElementById('playBtn').onclick = () => showScreen('game');
        document.getElementById('instructionsHomeBtn').onclick = () => showScreen('instructions');
        document.getElementById('comingHomeBtn').onclick = () => showScreen('coming');
        document.getElementById('backFromGameBtn').onclick = () => showScreen('home');
        document.getElementById('backFromInstructionsBtn').onclick = () => showScreen('home');
        document.getElementById('backFromComingBtn').onclick = () => showScreen('home');
        document.getElementById('volverHomeBtn').onclick = () => showScreen('home');

        // AJEDREZ REALISTA
        const game = new Chess();
        let selectedSquare = null;
        let legalMoves = [];
        let soundEnabled = true;
        let energy = 100;
        let whiteTime = 600, blackTime = 600, currentTimer = 'w', timerInterval = null;

        const canvas = document.getElementById('chessCanvas');
        let ctx = canvas.getContext('2d');
        let squareSize = 75;

        // Colores REALISTAS (madera noble)
        const COLORS = {
            lightWood: '#e8d5a3',
            darkWood: '#8b5a3c',
            selectedGlow: '#f5e56b',
            legalMove: '#7cb342'
        };

        // Piezas REALISTAS (sombra + relieve)
        const pieceIcons = {
            'k': '♔', 'q': '♕', 'r': '♖', 'b': '♗', 'n': '♘', 'p': '♙',
            'K': '♚', 'Q': '♛', 'R': '♜', 'B': '♝', 'N': '♞', 'P': '♟'
        };

        function drawWoodTexture(x, y, size, isLight) {
            ctx.save();
            ctx.shadowBlur = 0;
            const grad = ctx.createLinearGradient(x, y, x+size, y+size);
            if (isLight) {
                grad.addColorStop(0, '#e8d5a3');
                grad.addColorStop(0.5, '#f0e0b5');
                grad.addColorStop(1, '#dccf9a');
            } else {
                grad.addColorStop(0, '#7a4a2a');
                grad.addColorStop(0.5, '#8b5a3c');
                grad.addColorStop(1, '#6b3a1a');
            }
            ctx.fillStyle = grad;
            ctx.fillRect(x, y, size, size);
            
            // Veta de madera
            ctx.beginPath();
            ctx.strokeStyle = isLight ? '#c4a86a' : '#4a2a10';
            ctx.lineWidth = 1.5;
            for(let i=0; i<3; i++) {
                ctx.beginPath();
                ctx.moveTo(x + 5 + i*15, y);
                ctx.lineTo(x + size - 5 - i*10, y+size);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(x, y + 5 + i*15);
                ctx.lineTo(x+size, y+size - 5 - i*10);
                ctx.stroke();
            }
            ctx.shadowBlur = 0;
        }

        function drawPieceWithRelief(piece, x, y, size) {
            const icon = pieceIcons[piece];
            ctx.save();
            ctx.shadowBlur = 4;
            ctx.shadowColor = 'rgba(0,0,0,0.4)';
            ctx.font = `${size * 0.68}px "Segoe UI Emoji", "Apple Color Emoji"`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            // Sombra de la pieza
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.fillText(icon, x + size/2 + 2, y + size/2 + 2);
            
            // Pieza principal con gradiente
            const grad = ctx.createLinearGradient(x+size*0.3, y+size*0.3, x+size*0.7, y+size*0.7);
            if (piece === piece.toUpperCase()) {
                grad.addColorStop(0, '#1a1a1a');
                grad.addColorStop(1, '#0a0a0a');
            } else {
                grad.addColorStop(0, '#f5f5f5');
                grad.addColorStop(1, '#c0c0c0');
            }
            ctx.fillStyle = grad;
            ctx.fillText(icon, x + size/2, y + size/2);
            
            // Brillo
            ctx.shadowBlur = 0;
            ctx.fillStyle = piece === piece.toUpperCase() ? 'rgba(255,255,255,0.15)' : 'rgba(255,255,255,0.4)';
            ctx.fillText(icon, x + size/2 - 1, y + size/2 - 1);
            ctx.restore();
        }

        function drawBoard() {
            const board = game.board();
            squareSize = canvas.width / 8;
            for(let i=0; i<8; i++) {
                for(let j=0; j<8; j++) {
                    const x = j * squareSize;
                    const y = i * squareSize;
                    const isLight = (i+j)%2 === 0;
                    const squareName = String.fromCharCode(97+j) + (8-i);
                    
                    if(selectedSquare === squareName) {
                        ctx.fillStyle = COLORS.selectedGlow;
                        ctx.fillRect(x, y, squareSize, squareSize);
                        ctx.shadowBlur = 10;
                        ctx.shadowColor = '#ffd700';
                        ctx.fillStyle = 'rgba(255,215,0,0.3)';
                        ctx.fillRect(x, y, squareSize, squareSize);
                        ctx.shadowBlur = 0;
                    } else if(legalMoves.includes(squareName)) {
                        ctx.fillStyle = COLORS.legalMove;
                        ctx.fillRect(x, y, squareSize, squareSize);
                        ctx.fillStyle = 'rgba(124,179,66,0.5)';
                        ctx.beginPath();
                        ctx.arc(x+squareSize/2, y+squareSize/2, squareSize*0.2, 0, 2*Math.PI);
                        ctx.fill();
                    } else {
                        drawWoodTexture(x, y, squareSize, isLight);
                    }
                    
                    const piece = board[i][j];
                    if(piece) {
                        let pieceKey = piece.type;
                        if(piece.color === 'b') pieceKey = piece.type.toUpperCase();
                        drawPieceWithRelief(pieceKey, x, y, squareSize);
                    }
                }
            }
        }

        function updateEnergy() { energy = Math.max(0,Math.min(100,energy)); document.getElementById('energyValue').innerText = Math.floor(energy); }
        function updateTimerDisplay() {
            document.getElementById('whiteTimer').innerText = `${Math.floor(whiteTime/60)}:${(whiteTime%60).toString().padStart(2,'0')}`;
            document.getElementById('blackTimer').innerText = `${Math.floor(blackTime/60)}:${(blackTime%60).toString().padStart(2,'0')}`;
        }
        function startTimer() {
            if(timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if(game.game_over()) return;
                if(currentTimer === 'w') { if(whiteTime>0) whiteTime--; }
                else { if(blackTime>0) blackTime--; }
                updateTimerDisplay();
            },1000);
        }
        function switchTimer() { currentTimer = game.turn(); startTimer(); }
        
        function updateStatus() {
            const status = document.getElementById('statusText');
            if(game.game_over()) {
                if(game.in_checkmate()) status.innerHTML = game.turn() === 'w' ? '🏆 Ganan NEGRAS' : '🏆 Ganan BLANCAS';
                else status.innerHTML = '♾️ TABLAS';
            } else {
                status.innerHTML = `🎮 Turno: ${game.turn() === 'w' ? 'BLANCAS' : 'NEGRAS'}${game.in_check() ? ' ⚠️ JAQUE' : ''}`;
                if(game.in_check()) playSound('check');
                switchTimer();
            }
            drawBoard();
        }

        function playSound(type) {
            if(!soundEnabled) return;
            try {
                const audio = new (window.AudioContext||window.webkitAudioContext)();
                const osc = audio.createOscillator();
                const gain = audio.createGain();
                osc.connect(gain);
                gain.connect(audio.destination);
                osc.frequency.value = type==='capture'?392:523;
                gain.gain.value = 0.1;
                osc.start();
                gain.gain.exponentialRampToValueAtTime(0.00001, audio.currentTime+0.2);
                osc.stop(audio.currentTime+0.2);
                setTimeout(()=>audio.close(),300);
            } catch(e) {}
        }

        function makeAIMove() {
            if(!game.game_over() && game.turn() === 'b') {
                setTimeout(()=>{
                    const moves = game.moves();
                    if(moves.length) {
                        game.move(moves[Math.floor(Math.random()*moves.length)]);
                        selectedSquare=null;
                        legalMoves=[];
                        drawBoard();
                        updateStatus();
                        playSound('move');
                        energy = Math.min(100, energy+5);
                        updateEnergy();
                    }
                },200);
            }
        }

        function handleCanvasClick(e) {
            if(game.game_over()) return;
            const rect = canvas.getBoundingClientRect();
            const scale = canvas.width / rect.width;
            let cx, cy;
            if(e.touches) { cx = e.touches[0].clientX; cy = e.touches[0].clientY; e.preventDefault(); }
            else { cx = e.clientX; cy = e.clientY; }
            const canvasX = (cx - rect.left) * scale;
            const canvasY = (cy - rect.top) * scale;
            if(canvasX<0||canvasX>canvas.width||canvasY<0||canvasY>canvas.height) return;
            const col = Math.floor(canvasX / squareSize);
            const row = Math.floor(canvasY / squareSize);
            const square = String.fromCharCode(97+col)+(8-row);
            
            if(selectedSquare) {
                const move = { from: selectedSquare, to: square, promotion: 'q' };
                const result = game.move(move);
                if(result) {
                    energy = Math.max(0, energy-2);
                    updateEnergy();
                    playSound(result.flags?.includes('c')?'capture':'move');
                    selectedSquare=null;
                    legalMoves=[];
                    drawBoard();
                    updateStatus();
                    makeAIMove();
                } else {
                    const piece = game.get(square);
                    if(piece && piece.color === game.turn()) {
                        selectedSquare = square;
                        legalMoves = game.moves({ square, verbose: true }).map(m=>m.to);
                        drawBoard();
                    } else {
                        selectedSquare=null;
                        legalMoves=[];
                        drawBoard();
                    }
                }
            } else {
                const piece = game.get(square);
                if(piece && piece.color === game.turn()) {
                    selectedSquare = square;
                    legalMoves = game.moves({ square, verbose: true }).map(m=>m.to);
                    drawBoard();
                }
            }
        }

        function resetGame() {
            game.reset();
            selectedSquare=null;
            legalMoves=[];
            whiteTime=600; blackTime=600;
            currentTimer='w';
            energy=100;
            updateEnergy();
            updateTimerDisplay();
            drawBoard();
            updateStatus();
            startTimer();
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            document.getElementById('soundGameBtn').innerHTML = soundEnabled ? '🔊 Sonido' : '🔇 Sonido';
        }

        function resizeCanvas() {
            const wrapper = canvas.parentElement;
            const size = Math.min(wrapper.clientWidth, wrapper.clientHeight);
            canvas.width = size;
            canvas.height = size;
            drawBoard();
        }

        canvas.addEventListener('click', handleCanvasClick);
        canvas.addEventListener('touchstart', (e)=>{ e.preventDefault(); handleCanvasClick(e); });
        document.getElementById('resetGameBtn').onclick = resetGame;
        document.getElementById('soundGameBtn').onclick = toggleSound;
        window.addEventListener('resize', ()=>setTimeout(resizeCanvas,100));
        resizeCanvas();
        updateEnergy();
        updateTimerDisplay();
        updateStatus();
        startTimer();
    </script>
</body>
</html>
